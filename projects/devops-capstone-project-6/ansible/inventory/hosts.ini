# ==============================================================================
# SUPPLYSHIELD DEVSECOPS PLATFORM - AUTO-GENERATED ANSIBLE INVENTORY
# ==============================================================================
# Bu dosya Terraform `local_file.ansible_inventory` kaynağı ve `templatefile()`
# fonksiyonu tarafından otomatik olarak üretilmiştir. Manuel olarak düzenlemeyiniz!
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI (BASTION / PROXYCOMMAND)?
# - Prod'da: Özel alt ağdaki (`10.40.1.0/24`) SecOps (`vm-worker-secops`) ve
#   uygulama düğümlerinin güvenlik (Zero-Trust) nedeniyle doğrudan SSH'a açık
#   Public IP adresleri yoktur. Sistem yöneticileri ve Ansible otomasyonu, bir
#   Bastion / Jump Host (`vm-master`) üzerinden `-W %h:%p` parametresiyle şifreli
#   SSH tüneli (ProxyCommand) açarak özel düğümlere erişir.
# - Lab'da: `vm-worker-secops` (`10.40.1.5`) sunucumuzun Public IP'si yoktur
#   (yalnızca NAT Gateway ile dışarı çıkar). Hem `vm-worker-secops` hem de
#   `vm-worker-app` düğümlerine VNet içinden tutarlı ve güvenli şekilde ulaşmak
#   için `vm-master` (9.205.89.163) üzerinden SSH ProxyCommand tüneli kullanıyoruz.
# ==============================================================================

[master]
vm-master ansible_host=9.205.89.163 private_ip=10.40.1.4 node_role=control-plane

[workers]
vm-worker-app ansible_host=10.40.1.6 private_ip=10.40.1.6 worker_tier=app
vm-worker-secops ansible_host=10.40.1.5 private_ip=10.40.1.5 worker_tier=secops

[secops_workers]
vm-worker-secops ansible_host=10.40.1.5 private_ip=10.40.1.5 worker_tier=secops

[app_workers]
vm-worker-app ansible_host=10.40.1.6 private_ip=10.40.1.6 worker_tier=app

[k8s_cluster:children]
master
workers

[all:vars]
ansible_user=ysf
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
master_private_ip=10.40.1.4
master_public_ip=9.205.89.163
app_public_ip=9.205.90.218
app_worker_public_ip=9.205.90.218

# ------------------------------------------------------------------------------
# Özel Alt Ağdaki Worker Düğümleri İçin SSH Bastion / Jump Host Tünel Ayarı
# ------------------------------------------------------------------------------
# `-o ProxyCommand="ssh ... -W %h:%p ysf@9.205.89.163"`
# Ansible, `vm-worker-secops` (`10.40.1.5`) ve `vm-worker-app` (`10.40.1.6`) özel
# IP'lerine bağlanmak istediğinde önce `vm-master` genel IP'sine SSH açar ve
# standart girdi/çıktıyı (`-W %h:%p`) hedef Worker düğümünün 22 portuna yönlendirir.
[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -W %h:%p ysf@9.205.89.163"'
