---
# ==============================================================================
# FAZ 2: RKE2 CONTROL PLANE, CONTAINERD HARBOR ENTEGRASYONU (registries.yaml)
# Dosya: playbooks/02-rke2-master.yml
# Hedef: vm-master (Standard_B2s_v2 — 2 vCPU / 8 GB RAM — 10.40.1.4)
# ==============================================================================
# MİMARİ AMAÇ:
# 1. KRİTİK DEVSECOPS DERSİ (`/etc/rancher/rke2/registries.yaml`):
#    Kubernetes düğümlerinde çalışan `containerd`, varsayılan olarak yalnızca
#    resmi CA sertifikalı HTTPS kayıt defterlerinden (Docker Hub, GHCR vb.)
#    imaj çeker. Kendi kurduğumuz Self-Hosted Harbor (`http://harbor.<IP>.nip.io`)
#    adresinden imaj çekmeye çalıştığında `http: server gave HTTP response to HTTPS client`
#    veya `x509: certificate signed by unknown authority` hatası verir!
#    Bunu çözmek için RKE2'ye özel `/etc/rancher/rke2/registries.yaml` dosyasında
#    Harbor adresini `mirrors` ve `configs` altında tanımlıyoruz. RKE2 başlarken
#    bu dosyayı okuyup `containerd/config.toml` içerisine otomatik işler!
# 2. Local-Path Provisioner Taint Toleration Yaması:
#    `vm-worker-secops` düğümünde `dedicated=secops:NoSchedule` Taint'i olacağı için
#    Harbor ve Jenkins PVC'leri oluşturulurken Local-Path `helper-pod`'un Taint'e
#    takılmaması adına `tolerations: [{operator: Exists}]` yaması uygulanır.
# ==============================================================================

- name: "Faz 2: vm-master Üzerinde RKE2 Server, Harbor registries.yaml, Helm 3 ve Local-Path Kurulumu"
  hosts: master
  become: true
  vars:
    rke2_version: "v1.31.2+rke2r1"
    kubectl_cmd: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    helm_cmd: "KUBECONFIG=/etc/rancher/rke2/rke2.yaml /usr/local/bin/helm"

  tasks:
    - name: "RKE2 konfigürasyon dizinini (/etc/rancher/rke2) oluştur"
      file:
        path: /etc/rancher/rke2
        state: directory
        mode: '0755'

    - name: "RKE2 Server yapılandırma dosyasını (/etc/rancher/rke2/config.yaml) oluştur"
      copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          tls-san:
            - "{{ master_public_ip }}"
            - "10.40.1.4"
            - "vm-master"
          cni: canal
          write-kubeconfig-mode: "0644"
        mode: '0644'

    - name: "RKE2 containerd için Self-Hosted Harbor registries.yaml yapılandırmasını oluştur"
      copy:
        dest: /etc/rancher/rke2/registries.yaml
        content: |
          mirrors:
            "harbor.{{ master_public_ip }}.nip.io":
              endpoint:
                - "http://harbor.{{ master_public_ip }}.nip.io"
            "harbor-core.harbor.svc.cluster.local":
              endpoint:
                - "http://harbor-core.harbor.svc.cluster.local"
          configs:
            "harbor.{{ master_public_ip }}.nip.io":
              tls:
                insecure_skip_verify: true
              auth:
                username: admin
                password: "AdminPassword2026!"
            "harbor-core.harbor.svc.cluster.local":
              tls:
                insecure_skip_verify: true
              auth:
                username: admin
                password: "AdminPassword2026!"
        mode: '0600'

    - name: "RKE2 Server ({{ rke2_version }}) ikili dosyalarını indir ve kur"
      shell: "curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION={{ rke2_version }} sh -"
      args:
        creates: /usr/local/bin/rke2

    - name: "rke2-server systemd servisini etkinleştir ve başlat"
      systemd:
        name: rke2-server
        state: started
        enabled: true

    - name: "Kubernetes API Server'ın yanıt vermesini ve vm-master'ın Ready olmasını bekle"
      shell: "{{ kubectl_cmd }} get nodes | grep -w 'Ready'"
      register: master_ready
      until: master_ready.rc == 0
      retries: 36
      delay: 10
      changed_when: false

    - name: "kubectl ve crictl araçlarını /usr/local/bin altına sembolik bağla"
      file:
        src: "/var/lib/rancher/rke2/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl

    - name: "Kullanıcı (/home/ysf/.kube) dizinini oluştur ve kubeconfig kopyala"
      file:
        path: "/home/{{ ansible_user | default('ysf') }}/.kube"
        state: directory
        owner: "{{ ansible_user | default('ysf') }}"
        group: "{{ ansible_user | default('ysf') }}"
        mode: '0755'

    - name: "Kubeconfig dosyasını /home/ysf/.kube/config konumuna kopyala"
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "/home/{{ ansible_user | default('ysf') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('ysf') }}"
        group: "{{ ansible_user | default('ysf') }}"
        mode: '0600'

    - name: "Helm 3 paket yöneticisini indir ve kur"
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
        rm -f get_helm.sh
      args:
        creates: /usr/local/bin/helm

    - name: "daemonset/rke2-ingress-nginx-controller oluşana kadar bekle"
      shell: "{{ kubectl_cmd }} get daemonset rke2-ingress-nginx-controller -n kube-system"
      register: ingress_ds
      until: ingress_ds.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: "RKE2 NGINX Ingress Controller DaemonSet'inin tamamen Ready olmasını bekle"
      shell: "{{ kubectl_cmd }} rollout status daemonset/rke2-ingress-nginx-controller -n kube-system --timeout=300s"
      changed_when: false

    - name: "Rancher Local-Path Storage Provisioner manifestini uygula"
      shell: "{{ kubectl_cmd }} apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml"
      changed_when: true

    - name: "local-path StorageClass'ını varsayılan (default) olarak işaretle"
      shell: |
        {{ kubectl_cmd }} patch storageclass local-path \
          -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      changed_when: true

    - name: "local-path-provisioner Deployment ve helperPod.yaml ConfigMap'ine Taint Toleration yaması uygula"
      shell: |
        {{ kubectl_cmd }} patch deployment local-path-provisioner -n local-path-storage --type='json' \
          -p='[{"op": "add", "path": "/spec/template/spec/tolerations", "value": [{"operator": "Exists"}]}]'
        {{ kubectl_cmd }} get configmap local-path-config -n local-path-storage -o json | \
          jq '.data["helperPod.yaml"] = "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n  tolerations:\n  - operator: Exists\n  containers:\n  - name: helper-pod\n    image: busybox:stable\n    imagePullPolicy: IfNotPresent\n"' | \
          {{ kubectl_cmd }} apply -f -
        {{ kubectl_cmd }} rollout restart deployment local-path-provisioner -n local-path-storage
        {{ kubectl_cmd }} rollout status deployment local-path-provisioner -n local-path-storage --timeout=120s
      changed_when: true
