# ==============================================================================
# RANCHER SERVER (rancher-latest/rancher) — ÜRETİM ORTAMI HELM DEĞERLERİ
# ==============================================================================
# MİMARİ AMAÇ:
# Rancher Server; SupplyShield DevSecOps platformumuzun üzerinde koştuğu RKE2
# kümemizin çoklu-küme (multi-cluster) yönetim panelini, RBAC (Rol Tabanlı Erişim
# Kontrolü) politikalarını, proje/namespace izolasyonunu (`harbor`, `jenkins`,
# `app`, `data`, `monitoring`) ve görsel iş yükü izleme katmanını sağlayan merkezi
# yönetim düzlemidir (Management Plane).
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI?
# - Prod'da: Rancher kendi adanmış 3 düğümlü yönetim kümesinde (`replicas: 3`) ve
#   Let's Encrypt / Kurumsal PKI sertifikalarıyla çalışır.
# - Lab'da: `vm-worker-secops` ve `vm-worker-app` düğümlerimiz 4 GB RAM boyutundadır
#   ve Harbor, Trivy, Jenkins, PostgreSQL, Redis ile SupplyShield FastAPI iş yüklerini
#   çalıştırmaktadır. Rancher Server ~800 MB - 1.2 GB RAM tükettiği için 8 GB RAM'e
#   sahip `vm-master` (`tier: platform`, taint `CriticalAddonsOnly=true:NoSchedule`)
#   sunucusuna kesin olarak sabitlenmiştir (`replicas: 1`). Master düğümünde
#   "Insufficient cpu" hatası yaşanmaması için CPU request değeri `20m` olarak
#   optimize edilmiştir.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. KOPYA SAYISI (REPLICAS) VE YÜKSEK ERİŞİLEBİLİRLİK OPTİMİZASYONU
# ------------------------------------------------------------------------------
replicas: 1

# ------------------------------------------------------------------------------
# 1.1 BAŞLANGIÇ PROBE ZAMAN AŞIMI (CATALOG RESTORATION OPTİMİZASYONU)
# ------------------------------------------------------------------------------
# Rancher ilk açılışta dahili git depolarını (rancher-charts, partner-charts)
# diske açar. 2 vCPU sanal sunucuda varsayılan 120 sn (failureThreshold: 12)
# yetmediğinden Kubelet pod'u sürekli SIGKILL ile öldürür ve I/O kilitlenmesi yaşanır.
# failureThreshold: 45 (450 saniye / 7.5 dk) verilerek temiz başlangıç sağlanır.
startupProbe:
  failureThreshold: 45
  periodSeconds: 10
  timeoutSeconds: 5

# ------------------------------------------------------------------------------
# 2. İLK KURULUM (BOOTSTRAP) YÖNETİCİ ŞİFRESİ
# ------------------------------------------------------------------------------
bootstrapPassword: "AdminPassword2026!"

# ------------------------------------------------------------------------------
# 3. INGRESS VE TLS SERTİFİKA YÖNETİMİ (CERT-MANAGER ENTEGRASYONU)
# ------------------------------------------------------------------------------
# hostname değeri Ansible playbook tarafından dinamik olarak
# "rancher.<MASTER_IP>.nip.io" şeklinde enjekte edilir.
hostname: rancher.MASTER_IP.nip.io

ingress:
  ingressClassName: nginx
  tls:
    source: rancher

# ------------------------------------------------------------------------------
# 4. DÜĞÜM SEÇİCİ (NODE SELECTOR) — SADECE VM-MASTER ÜZERİNDE ÇALIŞTIRMA
# ------------------------------------------------------------------------------
nodeSelector:
  tier: platform

extraNodeSelectorTerms:
  - key: tier
    operator: In
    values:
      - platform

# ------------------------------------------------------------------------------
# 5. TAINT TOLERASYONU (CRITICAL ADDONS ONLY İZOLASYONU)
# ------------------------------------------------------------------------------
tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
    effect: "NoSchedule"

extraTolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
    effect: "NoSchedule"

# ------------------------------------------------------------------------------
# 6. KAYNAK KISITLAMALARI (MASTER CPU REQUEST BÜTÇESİ OPTİMİZASYONU)
# ------------------------------------------------------------------------------
resourcesPreset: "none"

resources:
  requests:
    # Başlangıçta yalnızca 20 milicore (0.02 vCPU) ve 512 MB RAM rezerve edilir.
    # Bu sayede 8 GB RAM'li vm-master üzerinde RKE2 Control Plane, ArgoCD ve
    # kube-prometheus-stack ile "Insufficient cpu" çakışması yaşanmaz.
    cpu: 20m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi
