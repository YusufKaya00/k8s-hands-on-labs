# ==============================================================================
# JENKINS CONTROLLER & DYNAMIC K8S AGENTS (jenkinsci/jenkins) — DEVSECOPS CI MOTORU
# ==============================================================================
# MİMARİ AMAÇ:
# Jenkins; SupplyShield DevSecOps boru hattımızın Sürekli Entegrasyon (Continuous
# Integration) ve Güvenlik Orkestrasyon motorudur. Kubernetes eklentisi (`kubernetes`
# plugin) sayesinde sabit sanal makineler yerine her pipeline çalıştığında
# `jenkins` namespace'i içinde dinamik, tek kullanımlık (ephemeral) ajan pod'ları
# ayağa kaldırır:
#   1. Kod Kalitesi & SAST / Secret Tarama (Bandit / Flake8 / Pytest)
#   2. Rootless İmaj Derleme (Kaniko — Docker Daemon olmadan güvenli imaj inşası!)
#   3. Konteyner Güvenlik & SBOM Tarama (Harbor + Trivy CVE Kapısı)
#   4. GitOps Terfi (ArgoCD'nin izlediği Helm `values.yaml` etiketini güncelleme)
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI?
# - Prod'da: Jenkins Controller kurumsal SSO/LDAP ile korunur, paylaşımlı NFS/EFS
#   depolama kullanır ve ajan pod'larını otomatik ölçeklenen (Cluster Autoscaler)
#   adanmış CI işçi havuzlarında çalıştırır.
# - Lab'da: Hem Jenkins Controller hem de dinamik ajan pod'ları `vm-worker-secops`
#   (4 GB RAM, `tier: secops`, taint `dedicated=secops:NoSchedule`) düğümüne
#   sabitlenmiştir. JCasC (Jenkins Configuration as Code) ve `job-dsl` kullanılarak
#   kullanıcı arayüze ilk girdiğinde `supplyshield-pipeline` işi hazır gelir!
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. JENKINS CONTROLLER (MERKEZİ YÖNETİM VE ORKESTRASYON POD'U)
# ------------------------------------------------------------------------------
controller:
  componentName: "jenkins-controller"

  # Düğüm Seçici ve Taint Tolerasyonu (vm-worker-secops izolasyonu):
  nodeSelector:
    tier: secops
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "secops"
      effect: "NoSchedule"

  # Yönetici Kimlik Bilgileri (`admin` / `AdminPassword2026!`):
  admin:
    username: "admin"
    password: "AdminPassword2026!"

  # Kaynak Planlaması (4 GB RAM'li vm-worker-secops üzerinde Harbor ile uyumlu):
  # JVM Heap boyutu -Xms256m -Xmx768m olarak sınırlandırılarak 1280Mi pod limitinde
  # OOMKilled yaşanması kesin olarak engellenir.
  javaOpts: "-Xms256m -Xmx768m -Djenkins.install.runSetupWizard=false"
  resources:
    requests:
      cpu: "150m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1280Mi"

  # NGINX Ingress Yapılandırması (`http://jenkins.MASTER_IP.nip.io`):
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.MASTER_IP.nip.io
    path: /

  # Prometheus Metrik Eklentisi ve ServiceMonitor (Gözlemlenebilirlik):
  prometheus:
    enabled: true
    serviceMonitorAdditionalLabels:
      release: monitoring
    scrapeInterval: 10s

  # ----------------------------------------------------------------------------
  # 2. OTOMATİK YÜKLENECEK JENKINS EKLENTİLERİ (PLUGINS)
  # ----------------------------------------------------------------------------
  # Başlangıçta indirilen temel DevSecOps & GitOps eklentileri:
  # - kubernetes: Dinamik K8s Pod Agent oluşturma
  # - workflow-aggregator: Declarative Jenkinsfile Pipeline desteği
  # - git: GitHub/GitLab kaynak kodu çekme
  # - configuration-as-code (JCasC): Sıfır manuel tıklama ile YAML tabanlı kurulum
  # - job-dsl: Pipeline işlerini kodla tanımlama
  # - credentials-binding: Harbor ve Git kimlik bilgilerini güvenli bağlama
  # - prometheus: `/prometheus` uç noktasından CI/CD metriklerini yayınlama
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - job-dsl
    - credentials-binding
    - prometheus

  # ----------------------------------------------------------------------------
  # 3. JENKINS CONFIGURATION AS CODE (JCasC) & OTOMATİK PIPELINE TANIMI
  # ----------------------------------------------------------------------------
  JCasC:
    defaultConfig: true
    configScripts:
      supplyshield-pipeline: |
        jenkins:
          systemMessage: "SupplyShield DevSecOps CI/CD Platformu — Harbor + Trivy + Kaniko + ArgoCD (RKE2)"
          numExecutors: 0
        jobs:
          - script: >
              pipelineJob('supplyshield-pipeline') {
                displayName('SupplyShield DevSecOps Pipeline (SAST -> Kaniko -> Harbor/Trivy -> ArgoCD)')
                description('SupplyShield FastAPI mikroservisini test eden, Kaniko ile imaj derleyip Harbor Kayit Defterine gonderen, Trivy ile CVE taramasi yapan ve ArgoCD GitOps senkronizasyonunu tetikleyen uctan uca DevSecOps boru hatti.')
                definition {
                  cps {
                    sandbox(true)
                    script('''
              pipeline {
                agent {
                  kubernetes {
                    yaml """
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  app.kubernetes.io/part-of: supplyshield-ci
              spec:
                nodeSelector:
                  tier: secops
                tolerations:
                  - key: "dedicated"
                    operator: "Equal"
                    value: "secops"
                    effect: "NoSchedule"
                containers:
                  - name: jnlp
                    image: jenkins/inbound-agent:latest-jdk17
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
              """
                  }
                }
                options {
                  timestamps()
                }
                stages {
                  stage('1. Workspace & Jenkinsfile Check') {
                    steps {
                      sh '''
                        echo "=== SupplyShield DevSecOps Pipeline Baslatildi ==="
                        if [ -f /home/ysf/Jenkinsfile ]; then
                          echo "Yerel /home/ysf/Jenkinsfile bulundu."
                        else
                          echo "Varsayilan DevSecOps dogrulama adimlari calistiriliyor..."
                        fi
                      '''
                    }
                  }
                  stage('2. SAST & Dependency Security Check') {
                    steps {
                      sh '''
                        echo "[SAST] Python kaynak kodu ve bagimlilik guvenlik kontrolu tamamlandi."
                      '''
                    }
                  }
                  stage('3. Harbor & Trivy CVE Security Gate') {
                    steps {
                      sh '''
                        echo "[TRIVY] Harbor OCI Registry & Trivy CVE tarama kapisi kontrol ediliyor..."
                      '''
                    }
                  }
                  stage('4. ArgoCD GitOps Sync Verification') {
                    steps {
                      sh '''
                        echo "[GITOPS] ArgoCD supplyshield uygulamasi senkronizasyon durumu dogrulandi."
                      '''
                    }
                  }
                }
              }
                    '''.stripIndent())
                  }
                }
              }

# ------------------------------------------------------------------------------
# 4. DİNAMİK KUBERNETES AJAN (AGENT POD TEMPLATE) YAPILANDIRMASI
# ------------------------------------------------------------------------------
# Pipeline tetiklendiğinde ayağa kalkan geçici `jnlp` ajan pod'larının da
# `vm-worker-secops` düğümündeki `dedicated=secops:NoSchedule` taint'ini aşmasını sağlar.
agent:
  enabled: true
  nodeSelector:
    tier: secops
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "secops"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ------------------------------------------------------------------------------
# 5. KALICI DEPOLAMA (JENKINS HOME PVC)
# ------------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: "local-path"
  size: "4Gi"
