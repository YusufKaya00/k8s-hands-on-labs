# ==============================================================================
# GÖZLEMLENEBİLİRLİK VE ALARM YIĞINI (prometheus-community/kube-prometheus-stack)
# ==============================================================================
# MİMARİ AMAÇ:
# Bu dosya; SupplyShield DevSecOps platformumuzda Prometheus Operator, Prometheus
# Zaman Serisi Veritabanı (TSDB), Alertmanager (DevSecOps & SLO Alarm Yönlendiricisi),
# Grafana Görselleştirme Paneli, Kube-State-Metrics ve Node Exporter bileşenlerini
# tek bir entegre paket olarak yapılandırır.
#
# NEDEN PROD ORTAMINDA BÖYLEDİR VS LAB ORTAMI?
# 1. Hızlı DevSecOps & SLO Gözlemi (`scrapeInterval: "10s"`):
#    Harbor imaj tarama metriklerini, Jenkins CI/CD boru hattı durumunu ve
#    SupplyShield FastAPI servisinin Golden Signals (RPS, 5xx hata oranı, p99 gecikme,
#    PostgreSQL/Redis bağımlılık sağlığı) metriklerini 10 saniyelik yüksek çözünürlükle
#    topluyoruz.
# 2. Tüm Namespace'lerde Otomatik Keşif (`serviceMonitorSelectorNilUsesHelmValues: false`):
#    Prometheus'un yalnızca `monitoring` namespace'ini değil; `harbor`, `jenkins`,
#    `data` ve `app` namespace'lerindeki tüm `ServiceMonitor` ve `PrometheusRule`
#    nesnelerini etiket kısıtlaması olmadan otomatik keşfetmesini sağlar.
# 3. Grafana Sidecar Dashboard Yükleyici (`grafana_dashboard: "1"`):
#    Kubernetes kümesine `grafana_dashboard: "1"` etiketiyle basılan ConfigMap
#    panolarının (`01-harbor-jenkins-devsecops.json` ve `02-supplyshield-app-slo.json`)
#    Grafana tarafından otomatik olarak keşfedilip yüklenmesini sağlar.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RKE2 İÇ BİLEŞENLERİNDEKİ GEREKSİZ SCRAPE HEDEFLERİNİ KAPATMA
# ------------------------------------------------------------------------------
# RKE2 güvenlik sertleştirmesi gereği etcd, controller-manager ve scheduler metriklerini
# varsayılan olarak 127.0.0.1 üzerinde tutar. Sahte "TargetDown" alarmlarını önlemek
# için bu iç bileşen taramalarını kapatıyoruz.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

# ------------------------------------------------------------------------------
# 2. PROMETHEUS OPERATOR YAPILANDIRMASI (VM-MASTER / TIER=PLATFORM SABİTLEME)
# ------------------------------------------------------------------------------
prometheusOperator:
  resourcesPreset: "none"
  nodeSelector:
    tier: "platform"
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

# ------------------------------------------------------------------------------
# 3. PROMETHEUS SUNUCUSU (TSDB — 10s SCRAPE INTERVAL & EVRENSEL KEŞİF)
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    resourcesPreset: "none"
    nodeSelector:
      tier: "platform"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"

    # DevSecOps ve Uygulama SLO metrikleri için 10 saniyelik tarama aralığı:
    scrapeInterval: "10s"
    evaluationInterval: "10s"

    # ÇOK KRİTİK AYAR: Tüm namespace'lerdeki (`harbor`, `jenkins`, `data`, `app`)
    # ServiceMonitor, PodMonitor ve PrometheusRule kaynaklarını otomatik keşfet:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    retention: 2d

    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 600m
        memory: 1024Mi

# ------------------------------------------------------------------------------
# 4. ALERTMANAGER (DEVSECOPS & SLO ALARM YÖNETİCİSİ)
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    resourcesPreset: "none"
    replicas: 1
    nodeSelector:
      tier: "platform"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 256Mi

# ------------------------------------------------------------------------------
# 5. GRAFANA GÖRSELLEŞTİRME PANELİ VE SIDECAR DASHBOARD LOADER
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  resourcesPreset: "none"
  adminPassword: "AdminPassword2026!"
  nodeSelector:
    tier: "platform"
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Sidecar Dashboard & Datasource Yükleyici:
  # `grafana_dashboard: "1"` etiketine sahip ConfigMap'leri tüm namespace'lerde
  # (`searchNamespace: ALL`) dinleyerek panoları otomatik olarak Grafana'ya ekler.
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: true
        foldersFromFilesStructure: false

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.MASTER_IP.nip.io
    path: /
    pathType: Prefix

# ------------------------------------------------------------------------------
# 6. KUBE-STATE-METRICS (KUBERNETES OBJE DURUM METRİKLERİ)
# ------------------------------------------------------------------------------
kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    tier: "platform"
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 7. PROMETHEUS NODE EXPORTER (DONANIM METRİKLERİ — 3 DÜĞÜMÜN TAMAMINDA)
# ------------------------------------------------------------------------------
# `operator: "Exists"` joker tolerasyonu sayesinde `vm-master` (CriticalAddonsOnly),
# `vm-worker-secops` (dedicated=secops) ve `vm-worker-app` düğümlerinin tamamına
# yerleşerek CPU, bellek, disk ve ağ metriklerini toplar.
prometheus-node-exporter:
  resourcesPreset: "none"
  tolerations:
    - operator: "Exists"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true
