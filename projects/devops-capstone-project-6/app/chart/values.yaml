# ==============================================================================
# SUPPLYSHIELD APPLICATION HELM VALUES (app/chart/values.yaml)
# ==============================================================================
# Bu dosya, kendi kurduğumuz Harbor OCI Registry (harbor.MASTER_IP.nip.io)
# üzerinden imaj çeken ve PostgreSQL + Redis veri katmanıyla haberleşen
# SupplyShield FastAPI mikroservisinin üretim değerlerini tanımlar.
# ==============================================================================

replicaCount: 2

image:
  # İmaj doğrudan kümemizdeki Self-Hosted Harbor sunucusundan çekilir!
  repository: harbor.9.205.89.163.nip.io/supplyshield/supplyshield-api
  tag: "1.0.0"
  pullPolicy: Always

# Harbor özel projelerinden imaj çekebilmek için Kubernetes docker-registry Secret'ı
imagePullSecrets:
  - name: harbor-regcred

# Uygulama pod'ları vm-worker-app (tier=app) düğümünde çalışır
nodeSelector:
  tier: app

tolerations: []

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: app.9.205.90.218.nip.io

env:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  POSTGRES_HOST: "postgres-postgresql.data.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "supplyshield"
  POSTGRES_USER: "supplyshield"
  POSTGRES_PASSWORD: "AdminPassword2026!"
  REDIS_HOST: "redis-master.data.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "AdminPassword2026!"
  HARBOR_INTERNAL_URL: "http://harbor-core.harbor.svc.cluster.local"
  HARBOR_EXTERNAL_URL: "http://harbor.9.205.89.163.nip.io"

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: "10s"
