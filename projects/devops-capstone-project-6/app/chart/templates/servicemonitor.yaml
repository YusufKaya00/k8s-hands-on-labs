{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: supplyshield
  labels:
    app: supplyshield
    release: monitoring
spec:
  selector:
    matchLabels:
      app: supplyshield
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
