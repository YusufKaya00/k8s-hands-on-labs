# ==============================================================================
# Erasmus Connect - Helm Values Dosyası
# KURAL: Gerçek şifreler (DATABASE_URL, JWT_SECRET vb.) BURAYA YAZILMAZ!
# Şifreler .env.backend-secrets dosyasındadır ve kümeye `kubectl create secret` ile yüklenir.
# ==============================================================================

express:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  containerPort: 4000
  healthPath: /health
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

nextjs:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-frontend"
    tag: "local"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  containerPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  storage: 1Gi
  resources:
    # TODO: [Bilet 7] Redis için CPU ve RAM requests/limits değerlerini tanımla (ör. 50m/100m CPU, 64Mi/128Mi RAM)

ingress:
  enabled: true
  # TODO: [Bilet 9] className (nginx) ve host (erasmus.local) bilgilerini buraya tanımla

# ==============================================================================
# Secret & ConfigMap İSİM Referansları (Şifre DEĞİL, sadece kümedeki objenin ADI!)
# .env.backend-secrets -> kubectl create secret generic erasmus-backend-secrets ...
# .env.backend-config  -> kubectl create configmap erasmus-backend-config ...
# ==============================================================================
envFrom:
  backendSecretName: "erasmus-backend-secrets"
  backendConfigMapName: "erasmus-backend-config"
