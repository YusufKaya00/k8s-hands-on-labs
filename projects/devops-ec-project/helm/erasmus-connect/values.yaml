# Helm bu nesneleri OLUSTURMAZ. Onlari sen `.env.*` dosyalarindan kubectl ile olusturursun (Bilet 6).
# Azure'a gecince ayni isimdeki Secret'i Key Vault CSI Driver olusturacak; chart DEGISMEYECEK.
# ==============================================================================
envFrom:
  # TODO: [Bilet 6] Backend Secret'inin adini yaz (ör. erasmus-backend-secrets) -> .env.backend-secrets'tan olusturulacak
  backendSecretName: ""
  # TODO: [Bilet 6] Backend ConfigMap'inin adini yaz (ör. erasmus-backend-config) -> .env.backend-config'ten olusturulacak
  backendConfigMapName: ""
