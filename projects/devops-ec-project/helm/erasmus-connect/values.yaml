# ==============================================================================
# Erasmus Connect - Helm Values İskeleti
# KURAL: Bu dosyadaki TODO alanlarını README'deki Bilet sırasına göre doldur.
# ==============================================================================

express:
  replicaCount: 1
  image: 
    repository: "yusufk00/erasmus-connect-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type : ClusterIP
    port: 8080
  containerPort: 4000 
  healthPath: /health
  resources:
     limits:
       cpu: 150m
       memory: 1280mi
     requests:
      cpu: 100m
      memory: 512m

nextjs:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
   type: ClusterIP
   port: 8090
   targetport: 3000
  containerPort: 3000
  resources:
     limits : 
      cpu: 150m
      memory: 1000m
     requests:
      cpu: 100m
      memory: 512m

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  containerPorts:
     redis: 6379
  # TODO: [Bilet 5] Redis portunu (6379) ve kalıcı disk (PVC) boyutunu tanımla
  resources:
    # TODO: [Bilet 7] Redis için CPU ve RAM requests/limits değerlerini tanımla

ingress:
  enabled: true
  # TODO: [Bilet 9] ingressClassName (ör. nginx) ve host (ör. erasmus.local) bilgilerini buraya tanımla

# ==============================================================================
