express:
  replicaCount: 1
  image: 
    repository: "yusufk00/erasmus-connect-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type : ClusterIP
    port: 8080
    targetport : 4000  
  containerPort: 4000 
  healthPath: /health
  resources:
     limits:
       cpu: 150m
       memory: 1280mi
     requests:
      cpu: 100m
      memory: 512m

nextjs:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
   type: ClusterIP
   port: 8090
   targetport: 3000
  
  
    # TODO: [Bilet 4] Next.js Service tipini ve portunu tanımla
  containerPort: 3000
  # TODO: [Bilet 4] Next.js uygulamasının dinlediği port (varsayılan genelde 3000)
  resources:
     limits : 
      cpu: 150m
      memory: 1000m
     requests:
      cpu: 100m
      memory: 512m
    # TODO: [Bilet 7] Next.js için CPU ve RAM requests/limits değerlerini tanımla

