# ==============================================================================
# Erasmus Connect - Helm Values Dosyası
# KURAL: Gerçek şifreler (DATABASE_URL, JWT_SECRET vb.) BURAYA YAZILMAZ!
# Şifreler .env.backend-secrets dosyasındadır ve kümeye `kubectl create secret` ile yüklenir.
# ==============================================================================

express:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  containerPort: 4000
  healthPath: /health
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  

nextjs:
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-frontend"
    tag: "local"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  containerPort: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  readinessProbe:
   httpGet:
    path: /
    port: 3000
   initialDelaySeconds: 5
   periodSeconds: 5
  livenessProbe:
   httpGet:
    path: /
    port: 3000
   initialDelaySeconds: 20
   periodSeconds: 10
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  storage: 1Gi
  resources:
    requests:
     cpu: 50m
     memory: 50Mi
    limits:
     cpu: 300m
     memory: 512Mi
  readinessProbe:
    exec: 
     command: ["redis-cli" , "ping"]
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    exec: 
      command: ["redis-cli" , "ping"]
    initialDelaySeconds: 15
    periodSeconds: 10

admin:
  enabled: true
  replicaCount: 1
  image:
    repository: "yusufk00/erasmus-connect-admin"
    tag: "aks"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  containerPort: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi


ingress:
  enabled: true
  ingressClassName: nginx
  host: erasmus.local
  adminHost: admin.erasmus.local


envFrom:
  backendSecretName: "erasmus-backend-secrets"
  backendConfigMapName: "erasmus-backend-config"

pdb:
  enabled: true
  minAvailable: 1
  # TODO: [Bilet 18] Express ve Next.js için minAvailable (ör. 1 - sadece replica >= 2 iken!) değerini tanımlayıp enabled: true yap
