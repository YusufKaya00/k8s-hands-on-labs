apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erasmus-redis
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-redis
spec:
  serviceName: erasmus-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: erasmus-redis
  template:
    metadata:
      labels:
        app: erasmus-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports: 
          - containerPort: {{.Values.redis.port}}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts: 
            - name: redis-storage
              mountPath: /data
          readinessProbe: 
           {{- toYaml .Values.redis.readinessProbe | nindent 4  }}
          livenessProbe:
           {{- toYaml .Values.redis.livenessProbe | nindent 4}}
  volumeClaimTemplates:
   - metadata: 
      name: redis-storage
     spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
           storage: {{.Values.redis.storage}}
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` ekle (İpucu: Redis için `exec` -> `redis-cli ping` veya `tcpSocket` tercihini değerlendir)
    