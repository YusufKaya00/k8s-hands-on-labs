apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erasmus-redis
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-redis
spec:
  # TODO: [Bilet 5] StatefulSet'in zorunlu alanı `serviceName` değerini Headless Service adıyla eşleştir!
  replicas: 1
  selector:
    matchLabels:
      app: erasmus-redis
  template:
    metadata:
      labels:
        app: erasmus-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # TODO: [Bilet 5] `ports` bloğunu ekle (Redis varsayılan portu 6379)
          # TODO: [Bilet 7] `resources` bloğunu ekle (Redis hafif olduğu için uygun CPU/RAM requests & limits belirle)
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` ekle (İpucu: Redis için `exec` -> `redis-cli ping` veya `tcpSocket` tercihini değerlendir)
          # TODO: [Bilet 5] Kalıcı veri için `volumeMounts` (`mountPath: /data`) ekle
  # TODO: [Bilet 5] `volumeClaimTemplates` bloğunu ekle (ReadWriteOnce erişim modu ve storage requests boyutu belirle)
