apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erasmus-redis
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-redis
spec:
  serviceName: erasmus-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: erasmus-redis
  template:
    metadata:
      labels:
        app: erasmus-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports: 
          containerPort: {{.Values.redis.port}}

  volumeClaimTemplates:
   - metadata: 
      name: redis-storage
     spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
           storage: {{.Values.redis.storage}}
          # TODO: [Bilet 7] `resources` bloğunu ekle (Redis hafif olduğu için uygun CPU/RAM requests & limits belirle)
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` ekle (İpucu: Redis için `exec` -> `redis-cli ping` veya `tcpSocket` tercihini değerlendir)
          # TODO: [Bilet 5] Kalıcı veri için `volumeMounts` (`mountPath: /data`) ekle  modu ve storage requests boyutu belirle)
    