apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-nextjs
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-nextjs
spec:
  replicas: {{ .Values.nextjs.replicaCount }}
  selector:
    matchLabels:
      app: erasmus-nextjs
  template:
    metadata:
      labels:
        app: erasmus-nextjs
    spec:
      containers:
        - name: nextjs-web
          image: "{{ .Values.nextjs.image.repository }}:{{ .Values.nextjs.image.tag }}"
          imagePullPolicy: {{ .Values.nextjs.image.pullPolicy }}
          # TODO: [Bilet 4] `ports` bloğunu ekle ve Next.js `containerPort` değerini .Values.nextjs.containerPort ile tanımla
          ports: 
           - name: http
             containerPort: {{.Values.nextjs.containerPort}}
             protocol: TCP
            
          # TODO: [Bilet 4] `env` bloğunu ekle:
          #   - HOSTNAME="0.0.0.0" (Next.js standalone modda localhost'a bağlanırsa Service yönlendiremez!)
          #   - PORT -> .Values.nextjs.containerPort (quote ile)
          # DİKKAT: NEXT_PUBLIC_* değişkenlerini BURAYA YAZMA. Build sırasında imaja gömülürler;
          #   pod env'i onları değiştirmez. Onlar .env.frontend-build + `docker build --build-arg` ile verilir (README Bilet 4).
          env:
           - name: HOSTNAME
             value: "0.0.0.0"
           - name: PORT
             value: {{.Values.nextjs.containerPort | quote  }} 
          # TODO: [Bilet 7] `resources` bloğunu ekle (requests ve limits)
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` ekle (Next.js ana sayfasına `/` veya `/api/health` endpoint'ine httpGet)
