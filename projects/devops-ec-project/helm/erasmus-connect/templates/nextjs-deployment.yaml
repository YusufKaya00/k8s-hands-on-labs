apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-nextjs
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-nextjs
spec:
  replicas: {{ .Values.nextjs.replicaCount }}
  selector:
    matchLabels:
      app: erasmus-nextjs
  template:
    metadata:
      labels:
        app: erasmus-nextjs
    spec:
      containers:
        - name: nextjs-web
          image: "{{ .Values.nextjs.image.repository }}:{{ .Values.nextjs.image.tag }}"
          imagePullPolicy: {{ .Values.nextjs.image.pullPolicy }}
          ports: 
           - name: http
             containerPort: {{.Values.nextjs.containerPort}}
             protocol: TCP
          env:
           - name: HOSTNAME
             value: "0.0.0.0"
           - name: PORT
             value: {{.Values.nextjs.containerPort | quote  }} 
          resources:
             {{- toYaml .Values.express.resources | nindent 12 }}
          
         
          # TODO: [Bilet 7] `resources` bloğunu ekle (requests ve limits)
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` ekle (Next.js ana sayfasına `/` veya `/api/health` endpoint'ine httpGet)
