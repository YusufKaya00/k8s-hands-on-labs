apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erasmus-redis-isolation
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: erasmus-redis
    policyTypes:
    - Ingress
    ingress:
      - from:
        - podSelector:
          matchLabels:
           app: erasmus-express
        ports:
         - protocol: TCP
           port: {{.Values.redis.port}}
 