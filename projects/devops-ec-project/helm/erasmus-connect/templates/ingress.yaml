{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-ingress
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
  annotations:
     nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: {{.Values.ingress.ingressClassName}}
  rules: 
  - host: {{.Values.ingress.host}}
    http:
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
            name: erasmus-express-svc
            port: {{.Values.express.service.port}}
        - path: /
          pathType: Prefix
          backend:
            service: 
            name: erasmus-nextjs-svc
            port: {{.Values.nextjs.service.port}}

  
{{- end }}
