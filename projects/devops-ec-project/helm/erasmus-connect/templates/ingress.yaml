{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-ingress
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
  annotations:
     nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: {{.Values.ingress.ingressClassName}}
  rules: 
  - host: {{.Values.ingress.host}}
    http:
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: erasmus-express-svc
              port: 
                number: {{.Values.express.service.port}}
        - path: /
          pathType: Prefix
          backend:
            service: 
              name: erasmus-nextjs-svc
              port: 
                number: {{.Values.nextjs.service.port}}
  {{- if and .Values.admin.enabled .Values.ingress.adminHost }}
  - host: {{ .Values.ingress.adminHost }}
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: erasmus-admin-svc
              port:
                number: {{ .Values.admin.service.port }}
  {{- end }}

  
{{- end }}
