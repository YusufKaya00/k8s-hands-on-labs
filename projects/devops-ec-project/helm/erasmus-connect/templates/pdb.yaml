{{- if and .Values.pdb .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-express-pdb
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: erasmus-express

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-nextjs-pdb
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  minAvailable:  {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: erasmus-nextjs
{{- end }}
