apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-express
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-express
spec:
  replicas: {{ .Values.express.replicaCount }}
  selector:
    matchLabels:
      app: erasmus-express
  template:
    metadata:
      labels:
        app: erasmus-express
    spec:
      containers:
        - name: express-api
          image: "{{ .Values.express.image.repository }}:{{ .Values.express.image.tag }}"
          imagePullPolicy: {{ .Values.express.image.pullPolicy }}
          # --------------------------------------------------------------------
          # 1) TODO [Bilet 2] - PORTS:
          # imagePullPolicy ile aynı hizada (10 boşluk) `ports:` aç,
          # altına `- name: http`, `containerPort: {{ .Values.express.containerPort }}` ve `protocol: TCP` yaz.
          # --------------------------------------------------------------------

          # --------------------------------------------------------------------
          # 2) TODO [Bilet 6] - ENV (Pod'a özel sabit 2 değişken):
          # `env:` aç ve iki liste elemanı (`- name: ...` / `value: ...`) ekle:
          #   - HOST: "0.0.0.0"
          #   - PORT: {{ .Values.express.containerPort | quote }}
          # --------------------------------------------------------------------

          # --------------------------------------------------------------------
          # 3) TODO [Bilet 6] - ENVFROM (.env.backend-config ve .env.backend-secrets bağlantısı):
          # Tek tek 30 tane secret yazmak yerine `envFrom:` kullan!
          # `envFrom:` altında 2 liste elemanı (`-`) olacak:
          #   - configMapRef:
          #       name: {{ .Values.envFrom.backendConfigMapName }}
          #   - secretRef:
          #       name: {{ .Values.envFrom.backendSecretName }}
          # --------------------------------------------------------------------

          # --------------------------------------------------------------------
          # 4) TODO [Bilet 7] - RESOURCES:
          # `resources:` aç, altına `{{- toYaml .Values.express.resources | nindent 12 }}` yaz.
          # --------------------------------------------------------------------

          # --------------------------------------------------------------------
          # 5) TODO [Bilet 8] - PROBES (Sağlık Kontrolleri):
          # `readinessProbe:` ve `livenessProbe:` bloklarını ekle:
          #   httpGet:
          #     path: {{ .Values.express.healthPath }}
          #     port: {{ .Values.express.containerPort }}
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          # --------------------------------------------------------------------
