apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-express
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-express
spec:
  replicas: {{ .Values.express.replicaCount }}
  selector:
    matchLabels:
      app: erasmus-express
  template:
    metadata:
      labels:
        app: erasmus-express
    spec:
      containers:
        - name: express-api
          image: "{{ .Values.express.image.repository }}:{{ .Values.express.image.tag }}"
          imagePullPolicy: {{ .Values.express.image.pullPolicy }} 
          ports: 
            - name: http
              containerPort: {{.Values.express.containerPort}}
              protocol: TCP
          env:
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: {{.Values.express.port | quote}}
          envFrom:
          - secretRef: 
            name: {{.Values.envFrom.backendSecretName}}
          - configMapRef: {{.Values.envFrom.backendConfigMapName}}
          resources:
            requests: 
              cpu: {{.Values.express.resources.requests.cpu}}
              memory: {{.Values.express.resources.requests.memory}}
            limits: 
              cpu: {{.Values.express.resources.limits.cpu}}
              memory: {{.Values.express.resources.limits.memory}}
          # TODO: [Bilet 8] `readinessProbe` ve `livenessProbe` bloklarını ekle (httpGet ile healthPath ve containerPort kullan)
