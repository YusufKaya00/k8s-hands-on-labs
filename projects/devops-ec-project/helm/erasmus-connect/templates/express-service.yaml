apiVersion: v1
kind: Service
metadata:
  name: erasmus-express-svc
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-express
spec:
   type: {{.Values.express.service.type}}
   selector:
     app: erasmus-express
   ports: 
     - name: http
       port: {{.Values.express.service.port}}
       targetPort: {{.Values.express.containerPort}}    
       protocol: TCP

