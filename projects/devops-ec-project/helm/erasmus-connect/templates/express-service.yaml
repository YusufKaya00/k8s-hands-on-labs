apiVersion: v1
kind: Service
metadata:
  name: erasmus-express-svc
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-express
spec:
 type: {{.Values.express.service.type}}
 selector:
     app: erasmus-express
 ports: 
  - port: {{.Values.express.service.port}}
 targetPort: {{.Values.exppres.containerPort}}    
 protocol: TCP
 name: http

