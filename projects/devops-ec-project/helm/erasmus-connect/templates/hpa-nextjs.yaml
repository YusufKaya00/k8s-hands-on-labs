{{- if and .Values.nextjs.hpa .Values.nextjs.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-nextjs-hpa
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "erasmus-connect.fullname" . }}-nextjs
  minReplicas: {{ .Values.nextjs.hpa.minReplicas }}
  maxReplicas: {{ .Values.nextjs.hpa.maxReplicas }}
  metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: {{ .Values.nextjs.hpa.targetCPUUtilizationPercentage | default 60 }}
{{- end }}
