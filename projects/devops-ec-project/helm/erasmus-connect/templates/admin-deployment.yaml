{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-admin
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
    app: erasmus-admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      app: erasmus-admin
  template:
    metadata:
      labels:
        app: erasmus-admin
    spec:
      containers:
        - name: admin-web
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.admin.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.admin.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
