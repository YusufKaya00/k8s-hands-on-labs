{{- if and .Values.express.hpa .Values.express.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "erasmus-connect.fullname" . }}-express-hpa
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "erasmus-connect.fullname" . }}-express
    minReplicas: {{ .Values.express.hpa.minReplicas }}
    maxReplicas: {{ .Values.express.hpa.maxReplicas }}
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: {{ .Values.express.hpa.targetCPUUtilizationPercentage }}
      
{{- end }}
