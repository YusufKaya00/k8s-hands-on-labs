apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erasmus-express-post-dnat
  labels:
    {{- include "erasmus-connect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: 
       app: erasmus-express
  policyTypes:
   - Ingress
  ingress:
    - from:
       - podSelector:
          matchLabels: 
            app: erasmus-nextjs
       - namespaceSelector:
           matchLabels: 
             kubernetes.io/metadata.name: ingress-nginx
         podSelector:
            matchLabels:
               app.kubernetes.io/name: ingress-nginx
               app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: {{.Values.express.containerPort}}

