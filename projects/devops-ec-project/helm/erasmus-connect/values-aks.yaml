# ==============================================================================
# Azure AKS Ortamı Override Değerleri
# Kullanım (Ansible olmadan doğrudan Helm ile güncellemek için):
#   helm upgrade erasmus ./helm/erasmus-connect -f ./helm/erasmus-connect/values-aks.yaml
# ==============================================================================

nextjs:
  image:
    repository: "erasmusconnectv1.azurecr.io/erasmus-connect-frontend"
    tag: "v1"

admin:
  image:
    repository: "erasmusconnectv1.azurecr.io/erasmus-connect-admin"
    tag: "v1"

express:
  image:
    repository: "erasmusconnectv1.azurecr.io/erasmus-connect-backend"
    tag: "v1"

ingress:
  host: "<IP>.nip.io"
  adminHost: "admin.<IP>.nip.io"
