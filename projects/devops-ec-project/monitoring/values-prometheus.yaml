# ==============================================================================
# kube-prometheus-stack — Öğrenci / 2x Standard_B2s Kümesi İçin Hafif Ayarlar
# Referans: helm show values prometheus-community/kube-prometheus-stack | less
# Kurulum komutu (Bilet 27):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f ./monitoring/values-prometheus.yaml
# ==============================================================================

# 1) AKS control-plane bileşenleri Microsoft tarafından yönetilir, scrape edilemez.
#    Bunları kapatmazsan sürekli sahte "TargetDown" alarmı üretir!
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# 2) Prometheus Sunucusu (2x Standard_B2s'te ~8 GB toplam RAM için hafif sınırlar)
prometheus:
  prometheusSpec:
 
    retention: "2d"
    scrapeInterval: "30s"
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 600Mi



# 3) Grafana Arayüzü
grafana:
  
  adminPassword: "erasmus-grafana-123"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# 4) Alertmanager
alertmanager:
  alertmanagerSpec:
    
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
