# ==============================================================================
# Erasmus Connect - CI: Build -> ACR Push -> GitOps tag guncelleme
# KULLANIM: Bu dosyayi ILGILI UYGULAMA REPOSUNA kopyala:
#   <uygulama-repo>/.github/workflows/build-push.yml
# Her uygulama reposu icin sadece `env:` altindaki 3 degeri degistir.
# Sonuc: imaj ACR'ye pushlanir, GitOps reposunda values-aks.yaml tag'i degisir,
# ArgoCD (automated sync) yeni surumu kendisi deploy eder.
# ==============================================================================
name: build-push-update-tag

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: erasmus-connect-frontend      # backend: erasmus-connect-backend | admin: erasmus-connect-admin
  VALUES_KEY: nextjs                        # backend: express | admin: admin
  BUILD_ARG_ENV_FILE_SECRET: FRONTEND_BUILD_ENV  # build-arg gerekmiyorsa (backend) bos birak
  GITOPS_REPO: YusufKaya00/k8s-hands-on-labs
  GITOPS_VALUES: projects/devops-ec-project/helm/erasmus-connect/values-aks.yaml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      # NEXT_PUBLIC_* / VITE_* degerleri build-time gomuldugu icin build-arg olarak verilir.
      # Secret icerigi: .env.frontend-build dosyasinin tamami (KEY=VALUE satirlari).
      - name: Build-arg listesini hazirla
        id: args
        env:
          BUILD_ENV: ${{ secrets[env.BUILD_ARG_ENV_FILE_SECRET] }}
        run: |
          {
            echo "list<<EOF"
            printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ steps.args.outputs.list }}
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}   # contents:write yetkili PAT
          ref: main

      - name: values-aks.yaml tag guncelle
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq -i '.${{ env.VALUES_KEY }}.image.tag = "${{ needs.build-push.outputs.tag }}"' "${{ env.GITOPS_VALUES }}"

      - name: Commit & push
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add "${{ env.GITOPS_VALUES }}"
          git diff --cached --quiet && exit 0
          git commit -m "ci: ${{ env.IMAGE_NAME }} -> ${{ needs.build-push.outputs.tag }}"
          git pull --rebase origin main
          git push origin main
