---
# ==============================================================================
# Erasmus Connect - AKS Bootstrap & Helm Orkestrasyon Playbook'u
# ==============================================================================

- name: Erasmus Connect AKS Kurulum ve Helm Dagitim Playbook
  hosts: local
  gather_facts: false

  vars:
    resource_group: "rg-erasmus-connect-dev"
    cluster_name: "aks-erasmus-connect-dev"
    chart_path: "../helm/erasmus-connect"
    release_name: "erasmus"
    app_namespace: "default"
    # External IP ciktiktan sonra guncellenecek (Adim 5)
    aks_frontend_tag: "aks"
    aks_admin_tag: "aks"
    aks_ingress_host: ""
    aks_admin_host: ""

  tasks:
    - name: Baslangic kontrolu - degiskenlerin bos olmadigini dogrula
      ansible.builtin.assert:
        that:
          - resource_group | length > 0
          - cluster_name | length > 0
        fail_msg: "resource_group ve cluster_name bos olamaz!"
      tags: [ingress, deploy]

    - name: AKS Kubeconfig pull etme
      ansible.builtin.command:
        cmd: az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }} --overwrite-existing
      changed_when: false
      tags: [ingress, deploy]

    - name: NGINX Ingress Helm repo add
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx
        state: present
      tags: [ingress]

   
    - name: Terraformdan gelen sabir ingress IP'yi al
      ansible.builtin.command:
        cmd: terraform output -raw ingress_public_ip
        chdir: ../terraform
      register: tf_ingress_ip
      tags: [ingress]

    - name: NGINX Ingress Controller to AKS
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        wait: true
        values:
          controller:
            service:
              loadBalancerIP: "{{ tf_ingress_ip.stdout }}"
              annotations:
                service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
                service.beta.kubernetes.io/azure-load-balancer-resource-group: "{{ resource_group }}"
      tags: [ingress]

    - name: NGINX Ingress External IP adresini al
      ansible.builtin.shell: >
        kubectl get svc -n ingress-nginx ingress-nginx-controller
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: nginx_ingress_ip
      until: nginx_ingress_ip.stdout | length > 0
      retries: 15
      delay: 10
      changed_when: false
      tags: [ingress, deploy]

    - name: NGINX Ingress External IP ciktisi
      ansible.builtin.debug:
        msg: "AKS Ingress External IP: {{ nginx_ingress_ip.stdout }} (Test adresi: http://{{ nginx_ingress_ip.stdout }}.nip.io)"
      tags: [ingress, deploy]

    # --------------------------------------------------------------------------
    # ADIM 4 - Secret ve ConfigMap Yukleme (Idempotent)
    # --------------------------------------------------------------------------
    - name: Backend Secrets olustur (.env.backend-secrets)
      ansible.builtin.shell: >
        kubectl create secret generic erasmus-backend-secrets
        --from-env-file=../.env.backend-secrets
        -n {{ app_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      tags: [deploy]

    - name: Backend ConfigMap olustur (.env.backend-config)
      ansible.builtin.shell: >
        kubectl create configmap erasmus-backend-config
        --from-env-file=../.env.backend-config
        -n {{ app_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
      tags: [deploy]

    # --------------------------------------------------------------------------
