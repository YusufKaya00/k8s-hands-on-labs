---
# ==============================================================================
# Erasmus Connect - AKS Bootstrap & Helm Orkestrasyon Playbook'u
# ==============================================================================

- name: Erasmus Connect AKS Kurulum ve Helm Dagitim Playbook
  hosts: local
  gather_facts: false

  vars:
    resource_group: "rg-erasmus-connect-dev"
    cluster_name: "aks-erasmus-connect-dev"
    acr_name: "erasmusconnectv1"
    ci_sp_name: "sp-erasmus-acr-push"
    chart_path: "../helm/erasmus-connect"
    release_name: "erasmus"
    app_namespace: "default"


  tasks:
    - name: Baslangic kontrolu - degiskenlerin bos olmadigini dogrula
      ansible.builtin.assert:
        that:
          - resource_group | length > 0
          - cluster_name | length > 0
        fail_msg: "resource_group ve cluster_name bos olamaz!"
      tags: [ingress, deploy]

    - name: AKS Kubeconfig pull etme
      ansible.builtin.command:
        cmd: az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }} --overwrite-existing
      changed_when: false
      tags: [ingress, deploy]

    - name: CI Service Principal'a yeni ACR uzerinde AcrPush rolu ver (idempotent)
      ansible.builtin.shell: |
        set -euo pipefail
        ACR_ID=$(az acr show --name "{{ acr_name }}" --query id -o tsv)
        SP_APP_ID=$(az ad sp list --display-name "{{ ci_sp_name }}" --query "[0].appId" -o tsv)
        test -n "$SP_APP_ID"
        az role assignment create --assignee "$SP_APP_ID" --role AcrPush --scope "$ACR_ID"
      args:
        executable: /bin/bash
      changed_when: false
      tags: [acr, deploy]

    - name: NGINX Ingress Helm repo add
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx
        state: present
      tags: [ingress]

   
    - name: Terraformdan gelen sabir ingress IP'yi al
      ansible.builtin.command:
        cmd: terraform output -raw ingress_public_ip
        chdir: ../terraform
      register: tf_ingress_ip
      tags: [ingress]

    - name: NGINX Ingress Controller to AKS
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        wait: true
        values:
          controller:
            service:
              loadBalancerIP: "{{ tf_ingress_ip.stdout }}"
              annotations:
                service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
                service.beta.kubernetes.io/azure-load-balancer-resource-group: "{{ resource_group }}"
      tags: [ingress]

    - name: NGINX Ingress External IP adresini al
      ansible.builtin.shell: >
        kubectl get svc -n ingress-nginx ingress-nginx-controller
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: nginx_ingress_ip
      until: nginx_ingress_ip.stdout | length > 0
      retries: 15
      delay: 10
      changed_when: false
      tags: [ingress, deploy]

    - name: NGINX Ingress External IP ciktisi
      ansible.builtin.debug:
        msg: "AKS Ingress External IP: {{ nginx_ingress_ip.stdout }} (Test adresi: http://{{ nginx_ingress_ip.stdout }}.nip.io)"
      tags: [ingress, deploy]

    # --------------------------------------------------------------------------
    # ADIM 4 - Secret ve ConfigMap Yukleme (Idempotent)
    # --------------------------------------------------------------------------
    - name: Backend Secrets olustur (.env.backend-secrets)
      ansible.builtin.shell: >
        kubectl create secret generic erasmus-backend-secrets
        --from-env-file=../.env.backend-secrets
        -n {{ app_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      tags: [deploy]

    - name: Backend ConfigMap olustur (.env.backend-config)
      ansible.builtin.shell: >
        kubectl create configmap erasmus-backend-config
        --from-env-file=../.env.backend-config
        -n {{ app_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
      tags: [deploy]

    # --------------------------------------------------------------------------
    # ADIM 5 - ArgoCD Kurulumu (uygulamayi artik ArgoCD deploy eder; helm install YOK)
    # NOT: Ingress cakismasi olmamasi icin `helm upgrade --install erasmus` calistirma!
    # --------------------------------------------------------------------------


    - name: argocd helm repo ekle
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
        state: present
      tags: [argocd]


    - name: argocd kur
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: argocd
        create_namespace: true
        wait: true
        values:
          configs:
            params:
              "server.insecure": "true"

      
    - name: erasmus connect argocd application olustur
      kubernetes.core.k8s:
        state: present
        src: ../argocd/erasmus-app.yaml
      tags: [argocd]
       


    - name: ArgoCD initial admin password'i al
      ansible.builtin.shell: >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath="{.data.password}" | base64 -d
      register: argocd_initial_admin_password
      no_log: true
      tags: [argocd]


    # Adım 6 - Chaos Engineering (Helm)
    - name: chaos helm repo ekle
      kubernetes.core.helm_repository:
        name: chaos-mesh
        repo_url: https://charts.chaos-mesh.org
        state: present
      tags: [chaos]

    - name: chaos-mesh kur
      kubernetes.core.helm:
        name: chaos-mesh
        chart_ref: chaos-mesh/chaos-mesh
        release_namespace: chaos-mesh
        create_namespace: true
        wait: true  
        update_repo_cache: true
        values:
          chaosDaemon:
           runtime: "containerd"
           socketPath: "/run/containerd/containerd.sock"
           hostNetwork: true
          dashboard:
            service:
              type: ClusterIP
            securityMode: true
      tags: [chaos]

    # Adım 7 - Prometheus + Grafana + Alertmanager Kurulumu (Helm)
    - name: prometheus-community helm repo ekle
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        state: present
      tags: [monitoring]


    - name: prometheus-community/kube-prometheus-stack kur
      kubernetes.core.helm:
        name: monitoring
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        create_namespace: true
        wait: true  
        update_repo_cache: true
        values_files:
           - "{{ playbook_dir }}/../monitoring/values-prometheus.yaml"
      tags: [monitoring]