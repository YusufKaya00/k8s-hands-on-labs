---
# ==============================================================================
# Erasmus Connect - AKS Bootstrap & Helm Orkestrasyon Playbook'u (İskelet)
# Referans: ansible-doc kubernetes.core.helm | ansible-doc kubernetes.core.helm_repository
# ==============================================================================

- name: Erasmus Connect AKS Kurulum ve Helm Dagitim Playbook
  hosts: local
  gather_facts: false

  vars:
    resource_group: "rg-erasmus-connect"
    cluster_name: "aks-erasmus-connect"
    kubeconfig_path: "~/.kube/config"
    chart_path: "../helm/erasmus-connect"
    release_name: "erasmus"
    app_namespace: "default"

  tasks:
    - name: Baslangic kontrolu - degiskenlerin bos olmadigini dogrula
      ansible.builtin.assert:
        that:
          - resource_group | length > 0
          - cluster_name | length > 0
        fail_msg: "Once playbook.yml vars bolumundeki resource_group ve cluster_name TODO'larini doldur!"


    - name: AKS Kubeconfig pull etme
      ansible.builtin.command:
        cmd: az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }} --overwrite-existing
      changed_when: false

    - name: NGINX Ingress Helm repo add
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx
        state: present


    - name : NGINX Ingress Controller to AKS
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        wait: true
 
    - name: Docker Hub private imaj cekme Secret'ini olustur
      ansible.builtin.shell: >
        set -a && . ../.env.dockerhub && set +a &&
        kubectl create secret docker-registry dockerhub-secret
        --docker-server=https://index.docker.io/v1/
        --docker-username=yusufk00
        --docker-password="$DOCKERHUB_TOKEN"
        --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      no_log: true

    - name: Erasmus Connect Helm Chart'ini AKS'e deploy et
      kubernetes.core.helm:
        name: "{{ release_name }}"
        chart_ref: "{{ chart_path }}"
        release_namespace: "{{ app_namespace }}"
        wait: true

    


    - name: NGINX Ingress External IP adresini al ve ekrana bas (debug)
      ansible.builtin.shell: >
        kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: nginx_ingress_ip
      changed_when: false