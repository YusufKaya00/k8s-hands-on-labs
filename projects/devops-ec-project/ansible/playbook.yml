    # TODO: [Bilet 15] ADIM 3 - NGINX Ingress Controller'i AKS'e kur
    #   - Modül: kubernetes.core.helm (ansible-doc kubernetes.core.helm)
    #   - name: ingress-nginx
    #   - chart_ref: ingress-nginx/ingress-nginx
    #   - release_namespace: ingress-nginx
    #   - create_namespace: true
