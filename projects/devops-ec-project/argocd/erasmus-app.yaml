# ==============================================================================
# ArgoCD Application Manifestosu (GitOps İskeleti)
# Referans: kubectl explain application.spec (ArgoCD kurulduktan sonra)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erasmus-connect
  namespace: argocd
spec:
  project: default
  source:
   repoURL: https://github.com/YusufKaya00/k8s-hands-on-labs.git
   targetRevision: main
   path: projects/devops-ec-project/helm/erasmus-connect
   helm:
    valueFiles:
      - values.yaml
      - values-aks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
