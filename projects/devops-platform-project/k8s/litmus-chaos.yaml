# TODO [Bilet 8.2]: LitmusChaos ChaosEngine ile orders-api üzerinde canlı Pod-Delete dayanıklılık testi yap
# Ön şart: ChaosExperiment (pod-delete) manifestini litmus namespace'ine yükle:
#   kubectl apply -f https://raw.githubusercontent.com/litmuschaos/chaos-charts/v3.30.x/faults/kubernetes/pod-delete/fault.yaml -n litmus
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: orders-pod-delete-chaos
  namespace: litmus
spec:
  appinfo:
    appns: "shop-prod"
    applabel: "app=orders-api,version=v1"
    appkind: "deployment"
  engineState: "active"
  chaosServiceAccount: litmus
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"
