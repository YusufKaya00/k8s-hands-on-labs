apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-conf
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: edge-proxy
    app.kubernetes.io/part-of: helioscore
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 512;
    }

    http {
      proxy_temp_path /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

      server {
        listen {{ .Values.edgeProxy.port }};
        server_name _;

        location /healthz {
          access_log off;
          default_type application/json;
          return 200 '{"service":"edge-proxy","status":"ok","version":"17.0.0"}\n';
        }

        location /admin/health {
          access_log off;
          default_type application/json;
          return 200 '{"service":"admin-console","status":"ok","upstream":"edge-proxy"}\n';
        }

        location /api/notify {
          set $up_notify "notification-api.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.notificationApi.service.port }}";
          proxy_pass http://$up_notify;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/ledger {
          set $up_ledger "ledger-sync.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.ledgerSync.service.port }}";
          proxy_pass http://$up_ledger;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/orders {
          set $up_orders "orders-api.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.ordersApi.port }}";
          proxy_pass http://$up_orders;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/settlement {
          set $up_settlement "settlement-api.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.settlementApi.port }}";
          proxy_pass http://$up_settlement;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/worker {
          set $up_worker "worker-engine.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.workerEngine.port }}";
          proxy_pass http://$up_worker;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/telemetry {
          set $up_telemetry "telemetry-sink.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.telemetrySink.port }}";
          proxy_pass http://$up_telemetry;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/archive {
          set $up_archive "archive-worker.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.archiveWorker.port }}";
          proxy_pass http://$up_archive;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/nodes {
          set $up_nodes "node-inspector.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.nodeInspector.port }}";
          proxy_pass http://$up_nodes;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/payments {
          set $up_payments "payment-engine.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.paymentEngine.port }}";
          proxy_pass http://$up_payments;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }
      }
    }
