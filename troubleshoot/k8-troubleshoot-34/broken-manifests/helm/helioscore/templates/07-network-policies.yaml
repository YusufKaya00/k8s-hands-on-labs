apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-sync-netpol
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-sync
    app.kubernetes.io/part-of: helioscore
spec:
  podSelector:
    matchLabels:
      app: ledger-sync
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.edge }}
          podSelector:
            matchLabels:
              app: edge-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.ledgerSync.networkPolicy.allowedPort }}
