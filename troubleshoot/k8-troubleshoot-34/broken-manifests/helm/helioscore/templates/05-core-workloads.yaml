apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: notification-api
    app.kubernetes.io/part-of: helioscore
spec:
  selector:
    app: notification-api
  ports:
    - name: http
      protocol: {{ .Values.notificationApi.service.protocol }}
      port: {{ .Values.notificationApi.service.port }}
      targetPort: {{ .Values.notificationApi.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: notification-api
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.notificationApi.replicaCount }}
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
        - name: notification-api
          image: "{{ .Values.notificationApi.image.repository }}:{{ .Values.notificationApi.image.tag }}"
          imagePullPolicy: {{ .Values.notificationApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notificationApi.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/notify/status", "/healthz"):
                          body = json.dumps({"service": "notification-api", "queue_depth": 0, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.notificationApi.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.notificationApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.notificationApi.resources | nindent 12 }}
