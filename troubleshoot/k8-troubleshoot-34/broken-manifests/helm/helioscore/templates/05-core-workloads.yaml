---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-inspector
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: node-inspector
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.nodeInspector.replicaCount }}
  selector:
    matchLabels:
      app: node-inspector
  template:
    metadata:
      labels:
        app: node-inspector
    spec:
      serviceAccountName: {{ .Values.nodeInspector.serviceAccountName }}
      containers:
        - name: node-inspector
          image: "{{ .Values.nodeInspector.image.repository }}:{{ .Values.nodeInspector.image.tag }}"
          imagePullPolicy: {{ .Values.nodeInspector.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nodeInspector.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, ssl, sys, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                  token = f.read().strip()
              ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def fetch_nodes():
                  req = urllib.request.Request("https://kubernetes.default.svc/api/v1/nodes", headers={"Authorization": f"Bearer {token}"})
                  with urllib.request.urlopen(req, context=ctx, timeout=4) as resp:
                      return len(json.loads(resp.read().decode()).get("items", []))

              try:
                  n = fetch_nodes()
                  print(f"Cluster node inspection ready: {n} nodes")
              except Exception as e:
                  print(f"FATAL: Cluster-wide node lookup denied: {e}", file=sys.stderr)
                  sys.exit(1)

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/nodes/summary", "/healthz"):
                          body = json.dumps({"service": "node-inspector", "nodes": fetch_nodes(), "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.nodeInspector.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.nodeInspector.resources | nindent 12 }}
