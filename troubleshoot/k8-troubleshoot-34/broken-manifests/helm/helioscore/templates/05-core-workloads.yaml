apiVersion: v1
kind: Service
metadata:
  name: telemetry-sink
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: telemetry-sink
    app.kubernetes.io/part-of: helioscore
spec:
  selector:
    app: telemetry-sink
  ports:
    - name: http
