apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-engine
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: worker-engine
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.workerEngine.replicaCount }}
  selector:
    matchLabels:
      app: worker-engine
  template:
    metadata:
      labels:
        app: worker-engine
    spec:
      containers:
        - name: worker-engine
          image: "{{ .Values.workerEngine.image.repository }}:{{ .Values.workerEngine.image.tag }}"
          imagePullPolicy: {{ .Values.workerEngine.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.workerEngine.port }}
          env:
            - name: WARMUP_SECONDS
              value: {{ .Values.workerEngine.warmupSeconds | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os, time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              warmup = int(os.environ.get("WARMUP_SECONDS", "8"))
              print(f"Loading model index into worker-engine ({warmup}s warmup)...")
              time.sleep(warmup)

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/worker/status", "/healthz"):
                          body = json.dumps({"service": "worker-engine", "warmup_s": warmup, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              print("worker-engine ready and listening.")
              ReusableServer(("0.0.0.0", {{ .Values.workerEngine.port }}), Handler).serve_forever()
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.workerEngine.port }}
            initialDelaySeconds: {{ .Values.workerEngine.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.workerEngine.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.workerEngine.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.workerEngine.port }}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            {{- toYaml .Values.workerEngine.resources | nindent 12 }}
