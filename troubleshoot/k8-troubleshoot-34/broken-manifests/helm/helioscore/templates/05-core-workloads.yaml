apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: settlement-api
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.settlementApi.replicaCount }}
  selector:
    matchLabels:
      app: settlement-api
  template:
    metadata:
      labels:
        app: settlement-api
    spec:
      initContainers:
        - name: init-verify-vault
          image: "{{ .Values.settlementApi.image.repository }}:{{ .Values.settlementApi.image.tag }}"
          imagePullPolicy: {{ .Values.settlementApi.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import socket, sys

              host = "vault-service.{{ .Values.namespaces.data }}.svc.cluster.local"
              port = {{ .Values.settlementApi.initVaultPort }}
              print(f"Checking upstream vault dependency at {host}:{port}...")
              try:
                  s = socket.create_connection((host, port), timeout=3)
                  s.close()
                  print("Vault TCP connectivity verified!")
              except Exception as e:
                  print(f"FATAL: Cannot connect to {host}:{port} -> {e}", file=sys.stderr)
                  sys.exit(1)
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: settlement-api
          image: "{{ .Values.settlementApi.image.repository }}:{{ .Values.settlementApi.image.tag }}"
          imagePullPolicy: {{ .Values.settlementApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.settlementApi.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/settlement/info", "/healthz"):
                          body = json.dumps({"service": "settlement-api", "batch": "synced", "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.settlementApi.port }}), Handler).serve_forever()
          readinessProbe:
