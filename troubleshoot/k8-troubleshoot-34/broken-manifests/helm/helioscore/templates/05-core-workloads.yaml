---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-sink
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: telemetry-sink
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.telemetrySink.replicaCount }}
  selector:
    matchLabels:
      app: telemetry-sink
  template:
    metadata:
      labels:
        app: telemetry-sink
    spec:
      containers:
        - name: telemetry-sink
          image: "{{ .Values.telemetrySink.image.repository }}:{{ .Values.telemetrySink.image.tag }}"
          imagePullPolicy: {{ .Values.telemetrySink.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.telemetrySink.port }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.telemetrySink.readOnlyRootFilesystem }}
          {{- if .Values.telemetrySink.cacheMountEnabled }}
          volumeMounts:
            - name: cache-dir
              mountPath: /var/cache/telemetry
          {{- end }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              os.makedirs("/var/cache/telemetry", exist_ok=True)
              state_file = "/var/cache/telemetry/state.json"
              with open(state_file, "w") as f:
                  f.write('{"sink":"writable"}\n')

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/telemetry/ping", "/healthz"):
                          with open(state_file) as f:
                              state = json.loads(f.read())
                          body = json.dumps({"service": "telemetry-sink", "cache": state, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.telemetrySink.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.telemetrySink.resources | nindent 12 }}
      {{- if .Values.telemetrySink.cacheMountEnabled }}
      volumes:
        - name: cache-dir
          emptyDir: {}
      {{- end }}
---
