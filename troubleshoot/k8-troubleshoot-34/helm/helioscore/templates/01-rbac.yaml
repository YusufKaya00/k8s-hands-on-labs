apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.nodeInspector.serviceAccountName }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: node-inspector
    app.kubernetes.io/part-of: helioscore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-inspector-role
  namespace: {{ .Values.namespaces.core }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-inspector-binding
  namespace: {{ .Values.namespaces.core }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nodeInspector.serviceAccountName }}
    namespace: {{ .Values.namespaces.core }}
roleRef:
  kind: Role
  name: node-inspector-role
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.nodeInspector.clusterRbacEnabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helios-node-inspector-cluster-role
  labels:
    app.kubernetes.io/part-of: helioscore
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helios-node-inspector-cluster-binding
  labels:
    app.kubernetes.io/part-of: helioscore
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nodeInspector.serviceAccountName }}
    namespace: {{ .Values.namespaces.core }}
roleRef:
  kind: ClusterRole
  name: helios-node-inspector-cluster-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
