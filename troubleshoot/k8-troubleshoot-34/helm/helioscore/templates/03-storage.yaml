apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.archiveWorker.storage.pvName }}
  labels:
    app: archive-worker
    app.kubernetes.io/part-of: helioscore
spec:
  capacity:
    storage: {{ .Values.archiveWorker.storage.pvSize }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.archiveWorker.storage.storageClassName }}
  hostPath:
    path: /tmp/helios-archive
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.archiveWorker.storage.pvcName }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: archive-worker
    app.kubernetes.io/part-of: helioscore
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.archiveWorker.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.archiveWorker.storage.pvcSize }}
