apiVersion: v1
kind: Service
metadata:
  name: ledger-sync
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-sync
    app.kubernetes.io/part-of: helioscore
spec:
  selector:
    app: ledger-sync
  ports:
    - name: http
      port: {{ .Values.ledgerSync.service.port }}
      targetPort: {{ .Values.ledgerSync.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-sync
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-sync
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.ledgerSync.replicaCount }}
  selector:
    matchLabels:
      app: ledger-sync
  template:
    metadata:
      labels:
        app: ledger-sync
    spec:
      containers:
        - name: ledger-sync
          image: "{{ .Values.ledgerSync.image.repository }}:{{ .Values.ledgerSync.image.tag }}"
          imagePullPolicy: {{ .Values.ledgerSync.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ledgerSync.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/ledger/sync", "/healthz"):
                          body = json.dumps({"service": "ledger-sync", "lag_ms": 0, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.ledgerSync.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.ledgerSync.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-service
    app.kubernetes.io/part-of: helioscore
spec:
  selector:
    app: vault-service
  ports:
    - name: http
      port: {{ .Values.vaultService.port }}
      targetPort: {{ .Values.vaultService.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-service
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-service
    app.kubernetes.io/part-of: helioscore
spec:
  replicas: {{ .Values.vaultService.replicaCount }}
  selector:
    matchLabels:
      app: vault-service
  template:
    metadata:
      labels:
        app: vault-service
    spec:
      containers:
        - name: vault-service
          image: "{{ .Values.vaultService.image.repository }}:{{ .Values.vaultService.image.tag }}"
          imagePullPolicy: {{ .Values.vaultService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vaultService.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/status", "/healthz"):
                          body = json.dumps({"service": "vault-service", "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.vaultService.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.vaultService.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.vaultService.resources | nindent 12 }}
