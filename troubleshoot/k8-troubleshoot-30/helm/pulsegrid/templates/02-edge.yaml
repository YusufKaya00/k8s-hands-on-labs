apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-telemetry
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: edge-telemetry
    app.kubernetes.io/part-of: pulsegrid
spec:
  replicas: {{ .Values.edgeTelemetry.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-telemetry
        app.kubernetes.io/part-of: pulsegrid
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: telemetry
          image: "{{ .Values.edgeTelemetry.image.repository }}:{{ .Values.edgeTelemetry.image.tag }}"
          imagePullPolicy: {{ .Values.edgeTelemetry.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, socket

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class TelemetryHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def send_json(self, code, payload):
                      body = json.dumps(payload).encode("utf-8")
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/ping":
                          self.send_json(200, {
                              "status": "ok",
                              "service": "edge-telemetry",
                              "pod": socket.gethostname(),
                              "client_ip": self.client_address[0]
                          })
                      else:
                          self.send_json(404, {"error": "not found", "path": path})

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.edgeTelemetry.containerPort }}), TelemetryHandler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.edgeTelemetry.containerPort }}
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.edgeTelemetry.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.edgeTelemetry.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.edgeTelemetry.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-telemetry-lb
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: {{ .Values.edgeTelemetry.service.healthProbePath | quote }}
spec:
  type: {{ .Values.edgeTelemetry.service.type }}
  selector:
    app.kubernetes.io/name: edge-telemetry
  ports:
    - name: http
      port: {{ .Values.edgeTelemetry.service.port }}
      targetPort: {{ .Values.edgeTelemetry.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: gateway-api.{{ .Values.namespaces.app }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.gatewayApi.service.port }}
---
{{- $ingressHost := .Values.global.ingressHost | default .Values.ingress.host }}
{{- $adminHost := .Values.adminIngress.hostOverride | default ($ingressHost | replace "pulse." "admin.") }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.ordersIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-orders-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.ordersIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.ordersIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.adminIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-admin-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.adminIngress.ingressClassName }}
  rules:
    - host: {{ $adminHost | quote }}
      http:
        paths:
          - path: {{ .Values.adminIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.billingIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-billing-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.billingIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.billingIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.billingIngress.backendServiceName }}
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
