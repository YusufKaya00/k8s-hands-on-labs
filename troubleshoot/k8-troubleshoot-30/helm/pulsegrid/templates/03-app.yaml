---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-netpol
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: auth-engine
    app.kubernetes.io/part-of: pulsegrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-engine
  policyTypes:
    - Ingress
{{- if .Values.authEngine.networkPolicy.ingressRules }}
  ingress:
    {{- toYaml .Values.authEngine.networkPolicy.ingressRules | nindent 4 }}
{{- else }}
  ingress: []
{{- end }}
{{- end }}
