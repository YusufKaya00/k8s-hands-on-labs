apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-store
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-store
    app.kubernetes.io/part-of: pulsegrid
spec:
  replicas: {{ .Values.ledgerStore.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-store
        app.kubernetes.io/part-of: pulsegrid
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: ledger-store
          image: "{{ .Values.ledgerStore.image.repository }}:{{ .Values.ledgerStore.image.tag }}"
          imagePullPolicy: {{ .Values.ledgerStore.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import socketserver

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      body = json.dumps({"status": "ok", "service": "ledger-store", "entries": 1024}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.ledgerStore.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.ledgerStore.containerPort }}
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.ledgerStore.containerPort }}/ledger"
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.ledgerStore.containerPort }}/ledger"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ledgerStore.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-store
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-store
    app.kubernetes.io/part-of: pulsegrid
spec:
  type: {{ .Values.ledgerStore.service.type }}
  selector:
    app.kubernetes.io/name: ledger-store
  ports:
    - name: http
      port: {{ .Values.ledgerStore.service.port }}
      targetPort: {{ .Values.ledgerStore.service.targetPort }}
{{- if .Values.ledgerStore.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-netpol
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-store
    app.kubernetes.io/part-of: pulsegrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-store
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml .Values.ledgerStore.networkPolicy.ingressRules | nindent 4 }}
{{- end }}
