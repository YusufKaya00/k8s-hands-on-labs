apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-db
spec:
  replicas: {{ .Values.ledgerDb.replicaCount }}
  selector:
    matchLabels:
      app: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
    spec:
      containers:
        - name: ledger-db
          image: {{ .Values.ledgerDb.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"ledger": "ok", "currency": "EUR"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.ledgerDb.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.ledgerDb.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ledgerDb.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ledgerDb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.data }}
spec:
  type: {{ .Values.ledgerDb.service.type }}
  selector:
    app: ledger-db
  ports:
    - name: http
      port: {{ .Values.ledgerDb.service.port }}
      targetPort: {{ .Values.ledgerDb.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: billing-api
spec:
  replicas: {{ .Values.billingApi.replicaCount }}
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: billing-api
          image: {{ .Values.billingApi.image }}
          command:
            - python3
            - -c
            - |
              import json, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      try:
                          with urllib.request.urlopen("http://ledger-db.{{ .Values.namespaces.data }}.svc.cluster.local:8080/balance", timeout=3) as r:
                              upstream = json.loads(r.read().decode())
                          body = json.dumps({"service": "billing-api", "status": "ok", "upstream": upstream}).encode()
                          self.send_response(200)
                      except Exception as e:
                          body = json.dumps({"service": "billing-api", "error": str(e)}).encode()
                          self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.billingApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.billingApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.billingApi.probes.readiness.path }}
              port: {{ .Values.billingApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.billingApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.billingApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.billingApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: {{ .Values.namespaces.web }}
spec:
  type: {{ .Values.billingApi.service.type }}
  selector:
    app: billing-api
  ports:
    - name: http
      port: {{ .Values.billingApi.service.port }}
      targetPort: {{ .Values.billingApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: {{ .Values.billingApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.billingApi.ingress.path }}
            pathType: {{ .Values.billingApi.ingress.pathType }}
            backend:
              service:
                name: billing-api
                port:
                  number: {{ .Values.billingApi.service.port }}
