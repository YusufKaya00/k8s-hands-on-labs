apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: upload-api
spec:
  replicas: {{ .Values.uploadApi.replicaCount }}
  selector:
    matchLabels:
      app: upload-api
  template:
    metadata:
      labels:
        app: upload-api
    spec:
      containers:
        - name: upload-api
          image: {{ .Values.uploadApi.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "upload-api", "status": "ok"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      _ = self.rfile.read(length)
                      body = json.dumps({"service": "upload-api", "bytes": length, "status": "stored"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.uploadApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.uploadApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.uploadApi.probes.readiness.path }}
              port: {{ .Values.uploadApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.uploadApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.uploadApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.uploadApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: upload-api
  namespace: {{ .Values.namespaces.web }}
spec:
  type: {{ .Values.uploadApi.service.type }}
  selector:
    app: upload-api
  ports:
    - name: http
      port: {{ .Values.uploadApi.service.port }}
      targetPort: {{ .Values.uploadApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upload-ingress
  namespace: {{ .Values.namespaces.web }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: {{ .Values.uploadApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.uploadApi.ingress.path }}
            pathType: {{ .Values.uploadApi.ingress.pathType }}
            backend:
              service:
                name: upload-api
                port:
                  number: {{ .Values.uploadApi.service.port }}
