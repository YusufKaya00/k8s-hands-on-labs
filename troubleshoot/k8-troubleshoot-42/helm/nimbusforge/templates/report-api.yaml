apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: report-api
spec:
  replicas: {{ .Values.reportApi.replicaCount }}
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.reportApi.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.reportApi.securityContext.runAsUser }}
        runAsGroup: {{ .Values.reportApi.securityContext.runAsGroup }}
      containers:
        - name: report-api
          image: {{ .Values.reportApi.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.reportApi.securityContext.readOnlyRootFilesystem }}
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              os.makedirs("/tmp/reports", exist_ok=True)
              with open("/tmp/reports/boot.chk", "w") as f:
                  f.write("ok\n")
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "report-api", "status": "ok", "writable": True}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.reportApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.reportApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.reportApi.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.reportApi.resources | nindent 12 }}

          volumeMounts:
            - name: reports
              mountPath: /tmp/reports
      volumes:
        - name: reports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.web }}
spec:
  type: {{ .Values.reportApi.service.type }}
  selector:
    app: report-api
  ports:
    - name: http
      port: {{ .Values.reportApi.service.port }}
      targetPort: {{ .Values.reportApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: {{ .Values.reportApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.reportApi.ingress.path }}
            pathType: {{ .Values.reportApi.ingress.pathType }}
            backend:
              service:
                name: report-api
                port:
                  number: {{ .Values.reportApi.service.port }}
