apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sa
  namespace: {{ .Values.namespaces.data }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-role
  namespace: {{ .Values.namespaces.data }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-binding
  namespace: {{ .Values.namespaces.data }}
subjects:
  - kind: ServiceAccount
    name: audit-sa
    namespace: {{ .Values.namespaces.data }}
roleRef:
  kind: Role
  name: audit-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: audit-api
spec:
  replicas: {{ .Values.auditApi.replicaCount }}
  selector:
    matchLabels:
      app: audit-api
  template:
    metadata:
      labels:
        app: audit-api
    spec:
      serviceAccountName: audit-sa
      containers:
        - name: audit-api
          image: {{ .Values.auditApi.image }}
          command:
            - python3
            - -c
            - |
              import json, ssl, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              def list_secrets():
                  with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                      tok = f.read().strip()
                  ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
                  req = urllib.request.Request(
                      "https://kubernetes.default.svc/api/v1/namespaces/{{ .Values.namespaces.data }}/secrets",
                      headers={"Authorization": f"Bearer {tok}", "Accept": "application/json"},
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=4) as r:
                      return json.loads(r.read().decode())
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      try:
                          sec = list_secrets()
                          body = json.dumps({"service": "audit-api", "status": "ok", "secretCount": len(sec.get("items", []))}).encode()
                          self.send_response(200)
                      except Exception as e:
                          body = json.dumps({"service": "audit-api", "error": str(e)}).encode()
                          self.send_response(403)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.auditApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.auditApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.auditApi.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.auditApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: audit-api
  namespace: {{ .Values.namespaces.data }}
spec:
  type: {{ .Values.auditApi.service.type }}
  selector:
    app: audit-api
  ports:
    - name: http
      port: {{ .Values.auditApi.service.port }}
      targetPort: {{ .Values.auditApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audit-ingress
  namespace: {{ .Values.namespaces.data }}
spec:
  ingressClassName: {{ .Values.auditApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.auditApi.ingress.path }}
            pathType: {{ .Values.auditApi.ingress.pathType }}
            backend:
              service:
                name: audit-api
                port:
                  number: {{ .Values.auditApi.service.port }}
