apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-quota
  namespace: {{ .Values.namespaces.data }}
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-egress
  namespace: {{ .Values.namespaces.web }}
spec:
  podSelector:
    matchLabels:
      app: billing-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tier: data
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-billing-to-ledger
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector:
    matchLabels:
      app: ledger-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: web
          podSelector:
            matchLabels:
              app: billing-svc
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-audit
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector:
    matchLabels:
      app: audit-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.auditApi.service.targetPort }}
