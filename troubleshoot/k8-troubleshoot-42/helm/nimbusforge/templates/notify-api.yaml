apiVersion: v1
kind: ConfigMap
metadata:
  name: notify-config
  namespace: {{ .Values.namespaces.web }}
data:
  NOTIFY_CHANNEL: "email"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: notify-api
spec:
  replicas: {{ .Values.notifyApi.replicaCount }}
  selector:
    matchLabels:
      app: notify-api
  template:
    metadata:
      labels:
        app: notify-api
    spec:
      containers:
        - name: notify-api
          image: {{ .Values.notifyApi.image }}
          envFrom:
            - configMapRef:
                name: notify-config
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "notify-api", "status": "ok", "channel": os.environ.get("NOTIFY_CHANNEL", "")}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.notifyApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.notifyApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.notifyApi.probes.readiness.path }}
              port: {{ .Values.notifyApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.notifyApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.notifyApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.notifyApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notify-api
  namespace: {{ .Values.namespaces.web }}
spec:
  type: {{ .Values.notifyApi.service.type }}
  selector:
    app: notify-api
  ports:
    - name: http
      port: {{ .Values.notifyApi.service.port }}
      targetPort: {{ .Values.notifyApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notify-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: {{ .Values.notifyApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.notifyApi.ingress.path }}
            pathType: {{ .Values.notifyApi.ingress.pathType }}
            backend:
              service:
                name: notify-api
                port:
                  number: {{ .Values.notifyApi.service.port }}
