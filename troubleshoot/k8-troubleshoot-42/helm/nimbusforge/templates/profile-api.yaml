apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: profile-api
spec:
  replicas: {{ .Values.profileApi.replicaCount }}
  selector:
    matchLabels:
      app: profile-api
  template:
    metadata:
      labels:
        app: profile-api
    spec:
      containers:
        - name: profile-api
          image: {{ .Values.profileApi.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      body = json.dumps({"service": "profile-api", "path": self.path, "status": "ok"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.profileApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.profileApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.profileApi.probes.readiness.path }}
              port: {{ .Values.profileApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.profileApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.profileApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.profileApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: profile-api
  namespace: {{ .Values.namespaces.web }}
spec:
  type: {{ .Values.profileApi.service.type }}
  selector:
    app: profile-api
  ports:
    - name: http
      port: {{ .Values.profileApi.service.port }}
      targetPort: {{ .Values.profileApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profile-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: {{ .Values.profileApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.profileApi.ingress.path }}
            pathType: {{ .Values.profileApi.ingress.pathType }}
            backend:
              service:
                name: profile-api
                port:
                  number: {{ .Values.profileApi.service.port }}
