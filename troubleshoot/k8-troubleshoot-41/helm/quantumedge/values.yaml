global:
  ingressHost: "quantum.local.nip.io"
  imageRegistry: "docker.io"
  pythonImage: "python:3.11-alpine"

namespaces:
  edge: "edge-prod"
  core: "core-prod"

ordersApi:
  replicaCount: 1
  image: "python:3.11-alpine"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: "nginx"
    path: "/orders"
    pathType: "Prefix"
  probes:
    readiness:
      path: "/healthz"
      port: 8080
      initialDelaySeconds: 2
      periodSeconds: 5
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi

