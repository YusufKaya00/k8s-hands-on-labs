apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telemetry-agent
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: telemetry-agent
spec:
  selector:
    matchLabels:
      app: telemetry-agent
  template:
    metadata:
      labels:
        app: telemetry-agent
    spec:
      tolerations:
        - key: "quantum-pool"
          operator: "Equal"
          value: "data"
          effect: "NoSchedule"
      containers:
        - name: telemetry-agent
          image: {{ .Values.telemetryAgent.image }}
          command:
            - python3
            - -c
            - |
              import time
              print("telemetry-agent running", flush=True)
              while True:
                  time.sleep(30)
          resources:
            {{- toYaml .Values.telemetryAgent.resources | nindent 12 }}
