apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: cart-api
spec:
  replicas: {{ .Values.cartApi.replicaCount }}
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
        tier: web
    spec:
      containers:
        - name: cart-api
          image: {{ .Values.cartApi.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "cart-api", "status": "ok", "items": 3}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.cartApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.cartApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.cartApi.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cartApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cart-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.cartApi.service.type }}
  selector:
    app: cart-app
  ports:
    - name: http
      port: {{ .Values.cartApi.service.port }}
      targetPort: {{ .Values.cartApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.cartApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.cartApi.ingress.path }}
            pathType: {{ .Values.cartApi.ingress.pathType }}
            backend:
              service:
                name: cart-api
                port:
                  number: {{ .Values.cartApi.service.port }}
