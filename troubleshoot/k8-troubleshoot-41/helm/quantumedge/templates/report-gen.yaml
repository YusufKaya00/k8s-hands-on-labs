apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-gen
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: report-gen
spec:
  replicas: {{ .Values.reportGen.replicaCount }}
  selector:
    matchLabels:
      app: report-gen
  template:
    metadata:
      labels:
        app: report-gen
    spec:
      containers:
        - name: report-gen
          image: {{ .Values.reportGen.image }}
          command:
            - python3
            - -c
            - |
              import json, time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      time.sleep(4)
                      body = json.dumps({"service": "report-gen", "status": "generated", "pages": 12}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.reportGen.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.reportGen.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.reportGen.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.reportGen.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-gen
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.reportGen.service.type }}
  selector:
    app: report-gen
  ports:
    - name: http
      port: {{ .Values.reportGen.service.port }}
      targetPort: {{ .Values.reportGen.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-ingress
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
spec:
  ingressClassName: {{ .Values.reportGen.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.reportGen.ingress.path }}
            pathType: {{ .Values.reportGen.ingress.pathType }}
            backend:
              service:
                name: report-gen
                port:
                  number: {{ .Values.reportGen.service.port }}
