apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: orders-api
spec:
  replicas: {{ .Values.ordersApi.replicaCount }}
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: {{ .Values.ordersApi.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "orders-api", "status": "ok", "count": 18}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.ordersApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.ordersApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ordersApi.probes.readiness.path }}
              port: {{ .Values.ordersApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.ordersApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ordersApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.ordersApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.ordersApi.service.type }}
  selector:
    app: orders-api
  ports:
    - name: http
      port: {{ .Values.ordersApi.service.port }}
      targetPort: {{ .Values.ordersApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.ordersApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.ordersApi.ingress.path }}
            pathType: {{ .Values.ordersApi.ingress.pathType }}
            backend:
              service:
                name: orders-api
                port:
                  number: {{ .Values.ordersApi.service.port }}
