apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-worker
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: export-worker
spec:
  replicas: {{ .Values.exportWorker.replicaCount }}
  selector:
    matchLabels:
      app: export-worker
  template:
    metadata:
      labels:
        app: export-worker
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.exportWorker.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.exportWorker.securityContext.runAsUser }}
        runAsGroup: {{ .Values.exportWorker.securityContext.runAsGroup }}
      containers:
        - name: export-worker
          image: {{ .Values.exportWorker.image }}
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: {{ .Values.exportWorker.securityContext.readOnlyRootFilesystem }}
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              os.makedirs("/var/tmp/exports", exist_ok=True)
              with open("/var/tmp/exports/boot.chk", "w") as f:
                  f.write("ok\n")
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "export-worker", "status": "ok", "writable": True}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.exportWorker.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.exportWorker.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.exportWorker.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.exportWorker.resources | nindent 12 }}
          volumes:
            - name: export-worker-data
              emptyDir: {}
    volumeMounts:
      - name: export-worker-data
        mountPath: /var/tmp/exports
---
apiVersion: v1
kind: Service
metadata:
  name: export-worker
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.exportWorker.service.type }}
  selector:
    app: export-worker
  ports:
    - name: http
      port: {{ .Values.exportWorker.service.port }}
      targetPort: {{ .Values.exportWorker.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: export-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.exportWorker.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.exportWorker.ingress.path }}
            pathType: {{ .Values.exportWorker.ingress.pathType }}
            backend:
              service:
                name: export-worker
                port:
                  number: {{ .Values.exportWorker.service.port }}
