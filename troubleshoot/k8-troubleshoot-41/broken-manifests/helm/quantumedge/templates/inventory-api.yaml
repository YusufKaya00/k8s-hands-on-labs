apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: inventory-api
spec:
  replicas: {{ .Values.inventoryApi.replicaCount }}
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
        - name: inventory-api
          image: {{ .Values.inventoryApi.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      if self.path.startswith("/inventory"):
                          body = json.dumps({"service": "inventory-api", "status": "ok", "skus": 240}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                          return
                      self.send_response(404)
                      self.end_headers()
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.inventoryApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.inventoryApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.inventoryApi.probes.readiness.path }}
              port: {{ .Values.inventoryApi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.inventoryApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.inventoryApi.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.inventoryApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.inventoryApi.service.type }}
  selector:
    app: inventory-api
  ports:
    - name: http
      port: {{ .Values.inventoryApi.service.port }}
      targetPort: {{ .Values.inventoryApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.inventoryApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.inventoryApi.ingress.path }}
            pathType: {{ .Values.inventoryApi.ingress.pathType }}
            backend:
              service:
                name: inventory-api
                port:
                  number: {{ .Values.inventoryApi.service.port }}
