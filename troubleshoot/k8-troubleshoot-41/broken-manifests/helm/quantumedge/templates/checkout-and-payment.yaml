apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-core
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: payment-core
spec:
  replicas: {{ .Values.paymentCore.replicaCount }}
  selector:
    matchLabels:
      app: payment-core
  template:
    metadata:
      labels:
        app: payment-core
    spec:
      containers:
        - name: payment-core
          image: {{ .Values.paymentCore.image }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"payment": "approved", "currency": "EUR"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.paymentCore.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.paymentCore.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.paymentCore.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.paymentCore.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-core
  namespace: {{ .Values.namespaces.core }}
spec:
  type: {{ .Values.paymentCore.service.type }}
  selector:
    app: payment-core
  ports:
    - name: http
      port: {{ .Values.paymentCore.service.port }}
      targetPort: {{ .Values.paymentCore.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gw
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: payment-core.edge-prod.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: checkout-api
spec:
  replicas: {{ .Values.checkoutApi.replicaCount }}
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: {{ .Values.checkoutApi.image }}
          command:
            - python3
            - -c
            - |
              import json, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      try:
                          with urllib.request.urlopen("http://payment-gw:8080/pay", timeout=3) as r:
                              upstream = json.loads(r.read().decode())
                          body = json.dumps({"service": "checkout-api", "status": "ok", "payment": upstream}).encode()
                          self.send_response(200)
                      except Exception as e:
                          body = json.dumps({"service": "checkout-api", "error": str(e)}).encode()
                          self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.checkoutApi.service.targetPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.checkoutApi.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.checkoutApi.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.checkoutApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: {{ .Values.checkoutApi.service.type }}
  selector:
    app: checkout-api
  ports:
    - name: http
      port: {{ .Values.checkoutApi.service.port }}
      targetPort: {{ .Values.checkoutApi.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.checkoutApi.ingress.className }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: {{ .Values.checkoutApi.ingress.path }}
            pathType: {{ .Values.checkoutApi.ingress.pathType }}
            backend:
              service:
                name: checkout-api
                port:
                  number: {{ .Values.checkoutApi.service.port }}
