apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clusterInspector.serviceAccountName }}
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/part-of: velocecloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inspector-role
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/part-of: velocecloud
rules:
  - apiGroups: [""]
    resources:
      {{- toYaml .Values.clusterInspector.rbac.resources | nindent 6 }}
    verbs:
      {{- toYaml .Values.clusterInspector.rbac.verbs | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inspector-rb
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/part-of: velocecloud
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterInspector.serviceAccountName }}
    namespace: {{ .Values.namespaces.data }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inspector-role
