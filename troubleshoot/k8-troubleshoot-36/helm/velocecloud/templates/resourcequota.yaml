apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/part-of: velocecloud
spec:
  hard:
    pods: {{ .Values.appQuota.pods | quote }}
    requests.cpu: {{ .Values.appQuota.requestsCpu | quote }}
    limits.cpu: {{ .Values.appQuota.limitsCpu | quote }}
    requests.memory: {{ .Values.appQuota.requestsMemory | quote }}
    limits.memory: {{ .Values.appQuota.limitsMemory | quote }}
