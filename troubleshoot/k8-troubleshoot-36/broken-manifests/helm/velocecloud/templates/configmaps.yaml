apiVersion: v1
kind: ConfigMap
metadata:
  name: veloce-app-code
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/part-of: velocecloud
data:
  status.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({"service": "status-api", "status": "healthy", "version": "19.0"}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), H).serve_forever()

  orders.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if self.path == "/api/orders":
                body = json.dumps({"service": "orders-api", "endpoint": "root", "status": "ok"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body); return
            if self.path == "/api/orders/list":
                body = json.dumps({"service": "orders-api", "orders": ["ord-101", "ord-102", "ord-103"], "status": "ok"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body); return
            body = json.dumps({"error": "not_found", "path": self.path}).encode()
            self.send_response(404); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8081"))), H).serve_forever()

  export.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if self.path.startswith("/api/export"):
                time.sleep(3.5)
                body = json.dumps({"service": "export-api", "rows": 1250, "status": "exported"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body); return
            self.send_response(404); self.end_headers(); self.wfile.write(b"not found")
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8082"))), H).serve_forever()

  simple.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    SVC = os.environ.get("SERVICE_NAME", "app")
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if self.path.startswith("/api/"):
                body = json.dumps({"service": SVC, "status": "ok"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body); return
            self.send_response(404); self.end_headers(); self.wfile.write(b"not found")
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), H).serve_forever()

  ledger_gateway.py: |
    import json, os, urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    LEDGER_URL = os.environ.get("LEDGER_URL", "http://ledger-db.veloce-data.svc.cluster.local:8080/balance")
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            try:
                with urllib.request.urlopen(LEDGER_URL, timeout=3) as r:
                    upstream = json.loads(r.read().decode())
                body = json.dumps({"service": "ledger-gateway", "upstream": upstream, "status": "ok"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
            except Exception as e:
                body = json.dumps({"service": "ledger-gateway", "error": str(e), "target": LEDGER_URL}).encode()
                self.send_response(502); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8085"))), H).serve_forever()

  session.py: |
    import json, os
