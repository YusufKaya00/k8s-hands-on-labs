            self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8087"))), H).serve_forever()

  cache_worker.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    BUFFER_MB = 42
    CACHE_BLOB = bytearray(BUFFER_MB * 1024 * 1024)
    for i in range(0, len(CACHE_BLOB), 4096):
        CACHE_BLOB[i] = 1
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            body = json.dumps({"service": "cache-worker", "buffer_mb": BUFFER_MB, "status": "ok"}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8088"))), H).serve_forever()
