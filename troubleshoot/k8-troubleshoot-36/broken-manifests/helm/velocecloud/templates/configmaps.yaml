  inspector.py: |
    import json, os, ssl, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    NS = os.environ.get("TARGET_NAMESPACE", "veloce-data")
    API_URL = f"https://kubernetes.default.svc/api/v1/namespaces/{NS}/pods"
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            try:
                with open(TOKEN_PATH) as f:
                    token = f.read().strip()
                ctx = ssl.create_default_context(cafile=CA_PATH)
                req = urllib.request.Request(API_URL, headers={"Authorization": f"Bearer {token}"})
                with urllib.request.urlopen(req, context=ctx, timeout=4) as r:
                    data = json.loads(r.read().decode())
                pod_count = len(data.get("items", []))
                body = json.dumps({"service": "cluster-inspector", "namespace": NS, "pod_count": pod_count, "status": "ok"}).encode()
                self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
            except urllib.error.HTTPError as e:
                body = json.dumps({"service": "cluster-inspector", "error": f"HTTP {e.code}: {e.reason}", "status": "denied"}).encode()
                self.send_response(e.code); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
            except Exception as e:
                body = json.dumps({"service": "cluster-inspector", "error": str(e)}).encode()
                self.send_response(500); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
        def log_message(self, *args): pass
    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8090"))), H).serve_forever()

