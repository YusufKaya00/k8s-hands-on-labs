apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: status-api
    app.kubernetes.io/part-of: velocecloud
spec:
  replicas: {{ .Values.statusApi.replicaCount }}
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
        app.kubernetes.io/part-of: velocecloud
    spec:
      containers:
        - name: status-api
          image: "{{ .Values.statusApi.image.repository }}:{{ .Values.statusApi.image.tag }}"
          imagePullPolicy: {{ .Values.statusApi.image.pullPolicy }}
          command: ["python3", "/app/status.py"]
          env:
            - name: PORT
              value: "{{ .Values.statusApi.port }}"
          ports:
            - containerPort: {{ .Values.statusApi.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.statusApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.statusApi.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: veloce-app-code
---
