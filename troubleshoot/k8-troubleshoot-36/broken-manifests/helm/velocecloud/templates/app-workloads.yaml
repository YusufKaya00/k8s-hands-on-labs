              value: "{{ .Values.ledgerGateway.port }}"
            - name: LEDGER_URL
              value: "http://ledger-db.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.ledgerDb.servicePort }}/balance"
          ports:
            - containerPort: {{ .Values.ledgerGateway.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ledgerGateway.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ledgerGateway.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: veloce-app-code
