apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: session-api
    app.kubernetes.io/part-of: velocecloud
spec:
  replicas: {{ .Values.sessionApi.replicaCount }}
  selector:
    matchLabels:
      app: session-api
  template:
    metadata:
      labels:
        app: session-api
        app.kubernetes.io/part-of: velocecloud
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: session-api
          image: "{{ .Values.sessionApi.image.repository }}:{{ .Values.sessionApi.image.tag }}"
          imagePullPolicy: {{ .Values.sessionApi.image.pullPolicy }}
          command: ["python3", "/app/session.py"]
          env:
            - name: PORT
              value: "{{ .Values.sessionApi.port }}"
          ports:
            - containerPort: {{ .Values.sessionApi.port }}
          securityContext:
            {{- toYaml .Values.sessionApi.securityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sessionApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sessionApi.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            {{- if .Values.sessionApi.writableCacheMount }}
            - name: session-cache
              mountPath: /var/cache/session
            {{- end }}
      volumes:
        - name: code
          configMap:
            name: veloce-app-code
        {{- if .Values.sessionApi.writableCacheMount }}
        - name: session-cache
          emptyDir: {}
        {{- end }}
---
