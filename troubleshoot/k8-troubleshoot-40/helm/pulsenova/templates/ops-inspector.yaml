apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-inspector-sa
  namespace: {{ .Values.namespaces.data }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-pod-reader
  namespace: {{ .Values.namespaces.data }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-pod-reader-binding
  namespace: {{ .Values.namespaces.data }}
subjects:
  - kind: ServiceAccount
    name: ops-inspector-sa
    namespace: {{ .Values.namespaces.data }}
roleRef:
  kind: Role
  name: ops-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-inspector
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ops-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-inspector
  template:
    metadata:
      labels:
        app: ops-inspector
    spec:
      serviceAccountName: {{ .Values.opsInspector.serviceAccountName }}
      containers:
        - name: ops-inspector
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json, ssl, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              def list_pods():
                  with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                      tok = f.read().strip()
                  ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
                  req = urllib.request.Request(
                      "https://kubernetes.default.svc/api/v1/namespaces/{{ .Values.namespaces.data }}/pods",
                      headers={"Authorization": f"Bearer {tok}", "Accept": "application/json"},
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=4) as r:
                      return json.loads(r.read().decode())
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      try:
                          pods = list_pods()
                          body = json.dumps({"service": "ops-inspector", "status": "ok", "podCount": len(pods.get("items", []))}).encode()
                          self.send_response(200)
                      except Exception as e:
                          body = json.dumps({"service": "ops-inspector", "error": str(e)}).encode()
                          self.send_response(403)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.opsInspector.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.opsInspector.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.opsInspector.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: {{ .Values.opsInspector.memoryRequest | quote }}
            limits:
              cpu: 150m
              memory: {{ .Values.opsInspector.memoryLimit | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: ops-inspector
  namespace: {{ .Values.namespaces.data }}
spec:
  selector:
    app: ops-inspector
  ports:
    - name: http
      port: {{ .Values.opsInspector.servicePort }}
      targetPort: {{ .Values.opsInspector.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-ingress
  namespace: {{ .Values.namespaces.data }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /ops
            pathType: Prefix
            backend:
              service:
                name: ops-inspector
                port:
                  number: {{ .Values.opsInspector.servicePort }}
