apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: ingest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-api
  template:
    metadata:
      labels:
        app: ingest-api
    spec:
      containers:
        - name: ingest-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "ingest-api", "status": "ok"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      _ = self.rfile.read(length)
                      body = json.dumps({"service": "ingest-api", "bytes": length, "status": "accepted"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.ingest.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.ingest.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ingest.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: ingest-api
  ports:
    - name: http
      port: {{ .Values.ingest.servicePort }}
      targetPort: {{ .Values.ingest.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingest-ingress
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingest.proxyBodySize | quote }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: ingest-api
                port:
                  number: {{ .Values.ingest.servicePort }}
