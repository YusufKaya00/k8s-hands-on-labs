apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-core
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-core
  template:
    metadata:
      labels:
        app: vault-core
    spec:
      containers:
        - name: vault-core
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"vault": "unlocked", "authorized": True}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-core
  namespace: {{ .Values.namespaces.data }}
spec:
  selector:
    app: vault-core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vault-alias
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: {{ .Values.checkout.vaultExternalName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      try:
                          with urllib.request.urlopen("http://vault-alias:8080/check", timeout=3) as r:
                              upstream = json.loads(r.read().decode())
                          body = json.dumps({"service": "checkout-api", "status": "ok", "vault": upstream}).encode()
                          self.send_response(200)
                      except Exception as e:
                          body = json.dumps({"service": "checkout-api", "error": str(e)}).encode()
                          self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.checkout.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.checkout.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.checkout.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: {{ .Values.checkout.servicePort }}
      targetPort: {{ .Values.checkout.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /checkout
            pathType: Prefix
            backend:
              service:
                name: checkout-api
                port:
                  number: {{ .Values.checkout.servicePort }}
