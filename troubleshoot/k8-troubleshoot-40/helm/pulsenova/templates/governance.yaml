apiVersion: v1
kind: LimitRange
metadata:
  name: data-limits
  namespace: {{ .Values.namespaces.data }}
spec:
  limits:
    - type: Container
      default:
        cpu: 150m
        memory: 128Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checkout-to-vault
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector:
    matchLabels:
      app: vault-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: edge
          podSelector:
            matchLabels:
              app: checkout-api
      ports:
        - protocol: TCP
          port: {{ .Values.checkout.netpolAllowedPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ops
  namespace: {{ .Values.namespaces.data }}
spec:
  podSelector:
    matchLabels:
      app: ops-inspector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.opsInspector.containerPort }}
