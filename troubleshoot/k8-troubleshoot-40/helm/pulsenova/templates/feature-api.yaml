apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  namespace: {{ .Values.namespaces.edge }}
data:
  FEATURE_MODE: "enabled"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: feature-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-api
  template:
    metadata:
      labels:
        app: feature-api
    spec:
      containers:
        - name: feature-api
          image: {{ .Values.global.pythonImage }}
          envFrom:
            - configMapRef:
                name: feature-flags
          {{- if .Values.features.overrideFeatureMode }}
          env:
            - name: FEATURE_MODE
              value: {{ .Values.features.overrideFeatureMode | quote }}
          {{- end }}
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              mode = os.environ.get("FEATURE_MODE", "unknown")
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      if mode == "enabled":
                          body = json.dumps({"service": "feature-api", "mode": mode, "status": "ok"}).encode()
                          self.send_response(200)
                      else:
                          body = json.dumps({"service": "feature-api", "mode": mode, "error": "feature mode disabled"}).encode()
                          self.send_response(503)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.features.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.features.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.features.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: feature-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: feature-api
  ports:
    - name: http
      port: {{ .Values.features.servicePort }}
      targetPort: {{ .Values.features.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feature-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /features
            pathType: Prefix
            backend:
              service:
                name: feature-api
                port:
                  number: {{ .Values.features.servicePort }}
