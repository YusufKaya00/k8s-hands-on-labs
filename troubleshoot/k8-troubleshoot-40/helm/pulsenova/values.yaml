global:
  ingressHost: "nova.local.nip.io"
  pythonImage: "python:3.11-alpine"

namespaces:
  edge: "nova-edge"
  data: "nova-data"

status:
  ingressHostOverride: ""
  servicePort: 80
  containerPort: 8080

ingest:
  proxyBodySize: "10m"
  servicePort: 80
  containerPort: 8080

catalog:
  serviceProtocol: "TCP"
  servicePort: 80
  containerPort: 8080

checkout:
  vaultExternalName: "vault-core.nova-data.svc.cluster.local"
  netpolAllowedPort: 8080
  servicePort: 80
  containerPort: 8080

features:
  overrideFeatureMode: ""
  servicePort: 80
  containerPort: 8080

analytics:
  livenessInitialDelaySeconds: 10
  servicePort: 80
  containerPort: 8080

pdf:
  mountTmpVolume: true
  servicePort: 80
  containerPort: 8080

token:
  secretKeyRef: "TOKEN_KEY"
  servicePort: 80
  containerPort: 8080

nodeAgent:
  tolerationEffect: "NoSchedule"

opsInspector:
  serviceAccountName: "ops-inspector-sa"
  memoryRequest: "128Mi"
  memoryLimit: "256Mi"
  servicePort: 80
  containerPort: 8080
