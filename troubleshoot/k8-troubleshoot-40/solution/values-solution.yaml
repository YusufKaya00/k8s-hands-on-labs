status:
  ingressHostOverride: ""

ingest:
  proxyBodySize: "5m"

catalog:
  serviceProtocol: "TCP"

checkout:
  vaultExternalName: "vault-core.nova-data.svc.cluster.local"
  netpolAllowedPort: 8080

features:
  overrideFeatureMode: ""

analytics:
  livenessInitialDelaySeconds: 10

pdf:
  mountTmpVolume: true

token:
  secretKeyRef: "TOKEN_KEY"

nodeAgent:
  tolerationEffect: "NoSchedule"

opsInspector:
  serviceAccountName: "ops-inspector-sa"
  memoryRequest: "64Mi"
  memoryLimit: "128Mi"
