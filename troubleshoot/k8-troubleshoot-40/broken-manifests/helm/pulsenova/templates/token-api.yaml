apiVersion: v1
kind: Secret
metadata:
  name: token-secret
  namespace: {{ .Values.namespaces.edge }}
type: Opaque
stringData:
  TOKEN_KEY: "nova-token-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: token-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-api
  template:
    metadata:
      labels:
        app: token-api
    spec:
      containers:
        - name: token-api
          image: {{ .Values.global.pythonImage }}
          env:
            - name: TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: token-secret
                  key: {{ .Values.token.secretKeyRef }}
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "token-api", "status": "ok", "loaded": bool(os.environ.get("TOKEN_KEY"))}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.token.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.token.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.token.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: token-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: token-api
  ports:
    - name: http
      port: {{ .Values.token.servicePort }}
      targetPort: {{ .Values.token.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: token-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /token
            pathType: Prefix
            backend:
              service:
                name: token-api
                port:
                  number: {{ .Values.token.servicePort }}
