apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
    spec:
      containers:
        - name: analytics-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json, time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              time.sleep(6)
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "analytics-api", "status": "ok", "events": 512}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.analytics.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.analytics.containerPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.analytics.containerPort }}
            initialDelaySeconds: {{ .Values.analytics.livenessInitialDelaySeconds }}
            periodSeconds: 2
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.analytics.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: analytics-api
  ports:
    - name: http
      port: {{ .Values.analytics.servicePort }}
      targetPort: {{ .Values.analytics.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-api
                port:
                  number: {{ .Values.analytics.servicePort }}
