apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: streamcart
spec:
  replicas: {{ .Values.ordersService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/part-of: streamcart
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: orders-service
          image: "{{ .Values.ordersService.image.repository }}:{{ .Values.ordersService.image.tag }}"
          imagePullPolicy: {{ .Values.ordersService.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server, json, socketserver, time

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/healthz":
                          body = json.dumps({"status": "ok", "service": "orders-service"}).encode("utf-8")
                      else:
                          time.sleep(2.5)
                          body = json.dumps({"status": "ok", "service": "orders-service", "recent_orders": 8}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.ordersService.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.ordersService.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ordersService.resources | nindent 12 }}
