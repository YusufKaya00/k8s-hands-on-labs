apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: metrics-service
    app.kubernetes.io/part-of: streamcart
spec:
  replicas: {{ .Values.metricsService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-service
        app.kubernetes.io/part-of: streamcart
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: metrics-service
          image: "{{ .Values.metricsService.image.repository }}:{{ .Values.metricsService.image.tag }}"
          imagePullPolicy: {{ .Values.metricsService.image.pullPolicy }}
          env:
            - name: BIND_ADDRESS
              value: {{ .Values.metricsService.bindAddress | quote }}
          command:
            - python3
            - -c
            - |
              import http.server, json, os, socketserver

              BIND_ADDR = os.environ["BIND_ADDRESS"]

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      body = json.dumps({"status": "ok", "service": "metrics-service", "rps": 420}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer((BIND_ADDR, {{ .Values.metricsService.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.metricsService.containerPort }}
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.metricsService.containerPort }}/api/metrics"
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.metricsService.containerPort }}/api/metrics"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.metricsService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/name: metrics-service
    app.kubernetes.io/part-of: streamcart
spec:
