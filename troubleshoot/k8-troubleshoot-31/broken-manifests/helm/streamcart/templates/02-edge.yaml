apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: streamcart
spec:
  replicas: {{ .Values.edgeGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/part-of: streamcart
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: edge-gateway
          image: "{{ .Values.edgeGateway.image.repository }}:{{ .Values.edgeGateway.image.tag }}"
          imagePullPolicy: {{ .Values.edgeGateway.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, socket

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/live":
                          body = json.dumps({
                              "status": "ok",
                              "service": "edge-gateway",
                              "pod": socket.gethostname(),
                              "client_ip": self.client_address[0]
                          }).encode("utf-8")
                          code = 200
                      else:
                          body = json.dumps({"error": "not found", "path": path}).encode("utf-8")
                          code = 404
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.edgeGateway.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.edgeGateway.containerPort }}
          readinessProbe:
            httpGet:
              path: /live
              port: {{ .Values.edgeGateway.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.edgeGateway.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.edgeGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-lb
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/live"
spec:
  type: {{ .Values.edgeGateway.service.type }}
  selector:
    app.kubernetes.io/name: edge-gateway
  ports:
    - name: http
      port: {{ .Values.edgeGateway.service.port }}
      targetPort: {{ .Values.edgeGateway.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: reverse-proxy.{{ .Values.namespaces.app }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.reverseProxy.service.port }}
---
{{- $ingressHost := .Values.global.ingressHost | default .Values.ingress.host }}
{{- $webhookHost := $ingressHost | replace "stream." "webhook." }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: reverse-proxy
                port:
                  number: {{ .Values.reverseProxy.service.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: reverse-proxy
                port:
                  number: {{ .Values.reverseProxy.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: reverse-proxy
                port:
                  number: {{ .Values.reverseProxy.service.port }}
{{- end }}
---
{{- if .Values.paymentsIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-payments-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.paymentsIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.paymentsIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: reverse-proxy
                port:
                  number: {{ .Values.reverseProxy.service.port }}
{{- end }}
---
{{- if .Values.webhookIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-webhook-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.webhookIngress.ingressClassName }}
  rules:
    - host: {{ $webhookHost | quote }}
      http:
        paths:
          - path: {{ .Values.webhookIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: reverse-proxy
                port:
                  number: {{ .Values.webhookIngress.servicePort }}
{{- end }}
