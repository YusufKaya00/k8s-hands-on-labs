apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: streamcart
spec:
  replicas: {{ .Values.ledgerDb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-db
        app.kubernetes.io/part-of: streamcart
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: ledger-db
          image: "{{ .Values.ledgerDb.image.repository }}:{{ .Values.ledgerDb.image.tag }}"
          imagePullPolicy: {{ .Values.ledgerDb.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server, json, socketserver

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      body = json.dumps({"status": "ok", "service": "ledger-db", "tx_count": 9041}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.ledgerDb.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.ledgerDb.containerPort }}
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.ledgerDb.containerPort }}/api/ledger"
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - -T
                - "2"
                - "http://127.0.0.1:{{ .Values.ledgerDb.containerPort }}/api/ledger"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ledgerDb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: streamcart
spec:
  type: {{ .Values.ledgerDb.service.type }}
  selector:
    app.kubernetes.io/name: ledger-db
  ports:
    - name: http
      port: {{ .Values.ledgerDb.service.port }}
      targetPort: {{ .Values.ledgerDb.service.targetPort }}
{{- if .Values.ledgerDb.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-netpol
  namespace: {{ .Values.namespaces.store }}
  labels:
    app.kubernetes.io/name: ledger-db
    app.kubernetes.io/part-of: streamcart
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml .Values.ledgerDb.networkPolicy.ingressRules | nindent 4 }}
{{- end }}
