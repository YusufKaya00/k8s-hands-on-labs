      app.kubernetes.io/name: vault-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-service
        app.kubernetes.io/part-of: streamcart
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: vault-service
          image: "{{ .Values.vaultService.image.repository }}:{{ .Values.vaultService.image.tag }}"
          imagePullPolicy: {{ .Values.vaultService.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server, json, socketserver

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      body = json.dumps({"status": "ok", "service": "vault-service", "keys": "unlocked"}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.vaultService.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.vaultService.containerPort }}
          readinessProbe:
            httpGet:
              path: /api/vault
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/vault
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.vaultService.resources | nindent 12 }}
