apiVersion: v1
kind: Namespace
metadata:
  name: shop-chaos
  labels:
    app.kubernetes.io/part-of: chaos-troubleshooting-7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-redis
  namespace: shop-chaos
  labels:
    app: cache-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-redis
  template:
    metadata:
      labels:
        app: cache-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cache-redis
  namespace: shop-chaos
  labels:
    app: cache-redis
spec:
  selector:
    app: cache-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-code
  namespace: shop-chaos
data:
  server.py: |
    import json
    import os
    import socket
    import threading
    import time
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ROLE = os.environ.get("DB_ROLE", "replica")
    lock = threading.Lock()
    state = {"queries_total": 0, "delay_ms": 0}


    class Handler(BaseHTTPRequestHandler):
        def _send_json(self, code: int, payload: dict) -> None:
            raw = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self) -> None:
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path == "/healthz":
                self._send_json(200, {"status": "ok", "role": ROLE, "pod": socket.gethostname()})
                return

            if parsed.path == "/admin/delay":
                qs = urllib.parse.parse_qs(parsed.query)
                if "ms" in qs:
                    try:
                        ms = max(0, min(10000, int(qs["ms"][0])))
                    except ValueError:
                        self._send_json(400, {"error": "invalid ms"})
                        return
                    with lock:
                        state["delay_ms"] = ms
                with lock:
                    cur = state["delay_ms"]
                self._send_json(200, {"role": ROLE, "pod": socket.gethostname(), "delay_ms": cur})
                return

            if parsed.path == "/stock":
                with lock:
                    state["queries_total"] += 1
                    delay_ms = state["delay_ms"]
                if delay_ms > 0:
                    time.sleep(delay_ms / 1000.0)
                self._send_json(200, {
                    "role": ROLE,
                    "pod": socket.gethostname(),
                    "sku": "GPU-4090-CLUSTER",
                    "in_stock": 42,
                    "delay_ms": delay_ms,
                })
                return

            if parsed.path == "/metrics":
                with lock:
                    q = state["queries_total"]
                    delay_s = state["delay_ms"] / 1000.0
                metric_name = "primary_queries_total" if ROLE == "primary" else "replica_queries_total"
                lines = [
                    f"# HELP {metric_name} Total inventory queries handled by {ROLE}",
                    f"# TYPE {metric_name} counter",
                    f"{metric_name} {q}",
                    "# HELP injected_delay_seconds Configured artificial latency in seconds",
                    "# TYPE injected_delay_seconds gauge",
                    f"injected_delay_seconds {delay_s}",
                ]
                raw = ("\n".join(lines) + "\n").encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(raw)))
                self.end_headers()
                self.wfile.write(raw)
                return

            self._send_json(404, {"error": "not found"})

        def do_POST(self) -> None:
            self.do_GET()

        def log_message(self, format: str, *args) -> None:
            return


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-primary
  namespace: shop-chaos
  labels:
    app: inventory-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-primary
  template:
    metadata:
      labels:
        app: inventory-primary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: inventory-primary
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_ROLE
              value: "primary"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 4
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: inventory-code
