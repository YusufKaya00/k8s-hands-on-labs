apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-vault
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/name: token-vault
    app.kubernetes.io/part-of: novamesh
spec:
  replicas: {{ .Values.tokenVault.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: token-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-vault
        app.kubernetes.io/part-of: novamesh
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: token-vault
          image: "{{ .Values.tokenVault.image.repository }}:{{ .Values.tokenVault.image.tag }}"
          imagePullPolicy: {{ .Values.tokenVault.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import socketserver

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      body = json.dumps({"status": "ok", "service": "token-vault", "token_state": "valid"}).encode("utf-8")
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.tokenVault.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.tokenVault.containerPort }}
          readinessProbe:
            httpGet:
              path: /token
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /token
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.tokenVault.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: token-vault
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/name: token-vault
    app.kubernetes.io/part-of: novamesh
spec:
  type: {{ .Values.tokenVault.service.type }}
  selector:
    app.kubernetes.io/name: token-vault
  ports:
    - name: http
      port: {{ .Values.tokenVault.service.port }}
      targetPort: {{ .Values.tokenVault.service.targetPort }}
{{- if .Values.tokenVault.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-vault-netpol
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/name: token-vault
    app.kubernetes.io/part-of: novamesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: token-vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.tokenVault.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tokenVault.containerPort }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: novamesh
spec:
  replicas: {{ .Values.reportService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-service
        app.kubernetes.io/part-of: novamesh
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: report-service
          image: "{{ .Values.reportService.image.repository }}:{{ .Values.reportService.image.tag }}"
          imagePullPolicy: {{ .Values.reportService.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import socketserver

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/reports/daily":
                          body = json.dumps({"status": "ok", "service": "report-service", "report": "daily-2026", "entries": 42}).encode("utf-8")
                          code = 200
                      else:
                          body = json.dumps({"error": "not found", "received_path": path}).encode("utf-8")
                          code = 404
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.reportService.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.reportService.containerPort }}
          readinessProbe:
            httpGet:
              path: /reports/daily
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /reports/daily
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.reportService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: novamesh
spec:
  type: {{ .Values.reportService.service.type }}
  selector:
    app.kubernetes.io/name: report-service
  ports:
    - name: http
      port: {{ .Values.reportService.service.port }}
      targetPort: {{ .Values.reportService.service.targetPort }}
