apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-evaluator
  namespace: {{ .Values.namespaces.api }}
  labels:
    app.kubernetes.io/name: risk-evaluator
    app.kubernetes.io/part-of: novamesh
spec:
  replicas: {{ .Values.riskEvaluator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-evaluator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-evaluator
        app.kubernetes.io/part-of: novamesh
    spec:
      terminationGracePeriodSeconds: 2
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "1"
      containers:
        - name: risk-evaluator
          image: "{{ .Values.riskEvaluator.image.repository }}:{{ .Values.riskEvaluator.image.tag }}"
          imagePullPolicy: {{ .Values.riskEvaluator.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import socketserver
              import threading
              import urllib.request

              DATA_NS = "{{ .Values.namespaces.data }}"
              TARGET_URL = f"http://report-service.{DATA_NS}.svc.cluster.local:80/reports/daily"

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              def query_report():
                  result = {"code": 502, "body": json.dumps({"error": "dns lookup or upstream timeout", "target": TARGET_URL})}
                  def _worker():
                      try:
                          with urllib.request.urlopen(TARGET_URL, timeout=1.2) as resp:
                              result["code"] = resp.status
                              result["body"] = json.dumps({
                                  "status": "ok",
                                  "service": "risk-evaluator",
                                  "risk_score": "low",
                                  "upstream": json.loads(resp.read().decode("utf-8"))
                              })
                      except Exception as e:
                          result["code"] = 502
                          result["body"] = json.dumps({"error": "upstream lookup failed", "target": TARGET_URL, "detail": str(e)})
                  t = threading.Thread(target=_worker, daemon=True)
                  t.start()
                  t.join(timeout=1.6)
                  return result["code"], result["body"]

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def _send(self, code, body):
                      data = body.encode("utf-8")
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/healthz":
                          self._send(200, json.dumps({"status": "ok", "service": "risk-evaluator"}))
                          return
                      code, body = query_report()
                      self._send(code, body)

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.riskEvaluator.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.riskEvaluator.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.riskEvaluator.resources | nindent 12 }}
