apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: {{ .Values.namespaces.api }}
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/part-of: novamesh
spec:
  replicas: {{ .Values.gatewayApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-api
        app.kubernetes.io/part-of: novamesh
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: gateway-api
          image: "{{ .Values.gatewayApi.image.repository }}:{{ .Values.gatewayApi.image.tag }}"
          imagePullPolicy: {{ .Values.gatewayApi.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import socket
              import socketserver
              import urllib.error
              import urllib.request

              DATA_NS = "{{ .Values.namespaces.data }}"

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              def fetch_upstream(url, timeout=1.2):
                  try:
                      with urllib.request.urlopen(url, timeout=timeout) as resp:
                          return resp.status, resp.read().decode("utf-8")
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode("utf-8")
                  except urllib.error.URLError as e:
                      if isinstance(e.reason, (socket.timeout, TimeoutError)):
                          return 504, json.dumps({"error": "upstream timeout", "target": url, "detail": str(e.reason)})
                      return 502, json.dumps({"error": "upstream unreachable", "target": url, "detail": str(e.reason)})
                  except (socket.timeout, TimeoutError) as e:
                      return 504, json.dumps({"error": "upstream timeout", "target": url, "detail": str(e)})
                  except Exception as e:
                      return 502, json.dumps({"error": "upstream error", "target": url, "detail": str(e)})

              class Handler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def log_message(self, format, *args):
                      pass

                  def _send(self, code, body):
                      data = body.encode("utf-8") if isinstance(body, str) else body
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      path = self.path.split("?")[0]
                      if path == "/api/v1/health":
                          self._send(200, json.dumps({"status": "ok", "service": "gateway-api"}))
                      elif path == "/partner/sync":
                          self._send(200, json.dumps({"status": "ok", "service": "gateway-api", "route": "partner-sync"}))
                      elif path == "/portal/status":
                          self._send(200, json.dumps({"status": "ok", "service": "gateway-api", "route": "portal-status"}))
                      elif path == "/api/v1/quote":
                          code, body = fetch_upstream("http://pricing-engine:8081/quote", timeout=1.2)
                          self._send(code, body)
                      elif path == "/api/v1/risk":
                          code, body = fetch_upstream("http://risk-evaluator:8082/eval", timeout=3.0)
                          self._send(code, body)
                      elif path == "/api/v1/receipt":
                          code, body = fetch_upstream("http://receipt-service:8083/receipt", timeout=1.2)
                          self._send(code, body)
                      elif path == "/api/v1/token":
                          code, body = fetch_upstream(f"http://token-vault.{DATA_NS}.svc.cluster.local:8084/token", timeout=1.2)
                          self._send(code, body)
                      elif path == "/api/v1/bridge":
                          code, body = fetch_upstream("http://report-bridge:80/reports/daily", timeout=1.2)
                          self._send(code, body)
                      else:
                          self._send(404, json.dumps({"error": "not found", "received_path": path}))

              with ThreadedTCPServer(("0.0.0.0", {{ .Values.gatewayApi.containerPort }}), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.gatewayApi.containerPort }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gatewayApi.resources | nindent 12 }}
---
