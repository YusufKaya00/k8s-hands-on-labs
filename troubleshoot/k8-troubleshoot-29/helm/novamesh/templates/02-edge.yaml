apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: edge-proxy
spec:
  replicas: {{ .Values.edgeProxy.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-proxy
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: proxy
          image: "{{ .Values.edgeProxy.image.repository }}:{{ .Values.edgeProxy.image.tag }}"
          imagePullPolicy: {{ .Values.edgeProxy.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, socket

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class EdgeHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def send_json(self, code, payload):
                      body = json.dumps(payload).encode()
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      if self.path == "/edge/ping":
                          self.send_json(200, {
                              "proxy": "edge-proxy",
                              "status": "online",
                              "pod": socket.gethostname(),
                              "client_ip": self.client_address[0]
                          })
                      else:
                          self.send_json(404, {"error": "not found", "path": self.path})

              with ThreadedTCPServer(("0.0.0.0", 8080), EdgeHandler) as httpd:
                  print("edge-proxy listening on 0.0.0.0:8080", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.edgeProxy.containerPort }}
          readinessProbe:
            httpGet:
              path: /edge/ping
              port: {{ .Values.edgeProxy.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
{{- toYaml .Values.edgeProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-proxy-lb
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/edge/ping"
spec:
  type: {{ .Values.edgeProxy.service.type }}
  selector:
    app.kubernetes.io/name: edge-proxy
  ports:
    - name: http
      port: {{ .Values.edgeProxy.service.port }}
      targetPort: {{ .Values.edgeProxy.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: gateway-api.{{ .Values.namespaces.api }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.gatewayApi.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: catalog-api.{{ .Values.namespaces.api }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.catalogApi.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: {{ .Values.namespaces.edge }}
spec:
  type: ExternalName
  externalName: report-service.{{ .Values.namespaces.data }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.reportService.service.port }}
---
{{- $ingressHost := .Values.global.ingressHost | default .Values.ingress.host }}
{{- $portalHost := $ingressHost | replace "novamesh." "portal." }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novamesh-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: /api/v2
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.catalogIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novamesh-catalog-ingress
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: {{ .Values.catalogIngress.useRegex | quote }}
{{- if .Values.catalogIngress.rewriteTarget }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.catalogIngress.rewriteTarget | quote }}
{{- end }}
spec:
  ingressClassName: {{ .Values.catalogIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.catalogIngress.path | quote }}
            pathType: {{ .Values.catalogIngress.pathType }}
            backend:
              service:
                name: catalog-api
                port:
                  number: {{ .Values.catalogApi.service.port }}
{{- end }}
---
{{- if .Values.partnerIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novamesh-partner-ingress
  namespace: {{ .Values.namespaces.edge }}
{{- if .Values.partnerIngress.whitelistSourceRange }}
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.partnerIngress.whitelistSourceRange | quote }}
{{- end }}
spec:
  ingressClassName: {{ .Values.partnerIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.partnerIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.portalIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novamesh-portal-ingress
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.portalIngress.forceSslRedirect | quote }}
spec:
  ingressClassName: {{ .Values.portalIngress.ingressClassName }}
  rules:
    - host: {{ $portalHost | quote }}
      http:
        paths:
          - path: {{ .Values.portalIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.service.port }}
{{- end }}
---
{{- if .Values.reportIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novamesh-report-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: {{ .Values.reportIngress.ingressClassName }}
  rules:
    - host: {{ $ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.reportIngress.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: report-service
                port:
                  number: {{ .Values.reportIngress.servicePort }}
{{- end }}
