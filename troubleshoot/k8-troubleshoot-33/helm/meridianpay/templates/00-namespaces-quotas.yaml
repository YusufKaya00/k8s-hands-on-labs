apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.edge }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.edge }}
    meridian.io/tier: edge
    environment: {{ .Values.global.environment }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.core }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.core }}
    meridian.io/tier: core
    environment: {{ .Values.global.environment }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.data }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.data }}
    meridian.io/tier: data
    environment: {{ .Values.global.environment }}
{{- if .Values.dataQuota.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-resource-quota
  namespace: {{ .Values.namespaces.data }}
  labels:
    app.kubernetes.io/part-of: meridianpay
spec:
  hard:
    requests.memory: {{ .Values.dataQuota.requestsMemory | quote }}
    limits.memory: {{ .Values.dataQuota.limitsMemory | quote }}
    pods: {{ .Values.dataQuota.pods | quote }}
{{- end }}
