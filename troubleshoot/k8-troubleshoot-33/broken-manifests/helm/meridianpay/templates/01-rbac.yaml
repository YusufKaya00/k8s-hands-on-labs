apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.auditCollector.rbacServiceAccountName }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: audit-collector
    app.kubernetes.io/part-of: meridianpay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-collector-role
  namespace: {{ .Values.namespaces.core }}
rules:
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-collector-binding
  namespace: {{ .Values.namespaces.core }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.auditCollector.rbacServiceAccountName }}
    namespace: {{ .Values.namespaces.core }}
roleRef:
  kind: Role
  name: audit-collector-role
  apiGroup: rbac.authorization.k8s.io
