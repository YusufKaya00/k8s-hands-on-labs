apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-proxy
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: cache-proxy
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.cacheProxy.replicaCount }}
  selector:
    matchLabels:
      app: cache-proxy
  template:
    metadata:
      labels:
        app: cache-proxy
    spec:
      containers:
        - name: cache-proxy
          image: "{{ .Values.cacheProxy.image.repository }}:{{ .Values.cacheProxy.image.tag }}"
          imagePullPolicy: {{ .Values.cacheProxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cacheProxy.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              TARGET = "http://cache-db-0.{{ .Values.cacheDb.headlessServiceName }}.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.cacheDb.port }}/ping"

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = b'{"status":"ok"}\n'
                          self.send_response(200)
                      elif self.path == "/api/cache/ping":
                          try:
                              with urllib.request.urlopen(TARGET, timeout=2) as resp:
                                  upstream = json.loads(resp.read().decode())
                              body = json.dumps({"service": "cache-proxy", "target": TARGET, "upstream": upstream, "status": "ok"}).encode()
                              self.send_response(200)
                          except Exception as e:
                              body = json.dumps({"service": "cache-proxy", "target": TARGET, "error": str(e)}).encode()
                              self.send_response(502)
                      else:
                          body = b'{"error":"not_found"}\n'
                          self.send_response(404)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              ReusableServer(("0.0.0.0", {{ .Values.cacheProxy.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.cacheProxy.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cacheProxy.resources | nindent 12 }}
