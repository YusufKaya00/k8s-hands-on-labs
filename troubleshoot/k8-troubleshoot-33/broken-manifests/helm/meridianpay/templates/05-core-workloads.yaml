apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: payments-api
    app.kubernetes.io/part-of: meridianpay
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: {{ .Values.paymentsApi.port }}
      targetPort: {{ .Values.paymentsApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: payments-api
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.paymentsApi.replicaCount }}
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: "{{ .Values.paymentsApi.image.repository }}:{{ .Values.paymentsApi.image.tag }}"
          imagePullPolicy: {{ .Values.paymentsApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.paymentsApi.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/payments/summary", "/healthz"):
                          body = json.dumps({"service": "payments-api", "daily_volume": 12450, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.paymentsApi.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.paymentsApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.paymentsApi.resources | nindent 12 }}
