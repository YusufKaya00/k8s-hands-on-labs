apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-gateway
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: risk-gateway
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.riskGateway.replicaCount }}
  selector:
    matchLabels:
      app: risk-gateway
  template:
    metadata:
      labels:
        app: risk-gateway
    spec:
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "1"
      containers:
        - name: risk-gateway
          image: "{{ .Values.riskGateway.image.repository }}:{{ .Values.riskGateway.image.tag }}"
          imagePullPolicy: {{ .Values.riskGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.riskGateway.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              TARGET = "http://risk-engine.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.riskEngine.port }}/score"

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = b'{"status":"ok"}\n'
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      elif self.path == "/api/risk/score":
                          try:
                              with urllib.request.urlopen(TARGET, timeout=2) as resp:
                                  upstream = json.loads(resp.read().decode())
                              body = json.dumps({"service": "risk-gateway", "upstream": upstream, "status": "ok"}).encode()
                              self.send_response(200)
                          except Exception as e:
                              body = json.dumps({"service": "risk-gateway", "error": str(e), "target": TARGET}).encode()
                              self.send_response(502)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.riskGateway.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.riskGateway.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.riskGateway.resources | nindent 12 }}
