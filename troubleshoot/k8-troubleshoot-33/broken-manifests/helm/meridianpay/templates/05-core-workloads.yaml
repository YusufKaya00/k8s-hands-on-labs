apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-collector
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: audit-collector
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.auditCollector.replicaCount }}
  selector:
    matchLabels:
      app: audit-collector
  template:
    metadata:
      labels:
        app: audit-collector
    spec:
      {{- if .Values.auditCollector.serviceAccountName }}
      serviceAccountName: {{ .Values.auditCollector.serviceAccountName }}
      {{- end }}
      containers:
        - name: audit-collector
          image: "{{ .Values.auditCollector.image.repository }}:{{ .Values.auditCollector.image.tag }}"
          imagePullPolicy: {{ .Values.auditCollector.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auditCollector.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, ssl, sys, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                  token = f.read().strip()
              with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace") as f:
                  ns = f.read().strip()
              ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def fetch_k8s(resource):
                  url = f"https://kubernetes.default.svc/api/v1/namespaces/{ns}/{resource}"
                  req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                  with urllib.request.urlopen(req, context=ctx, timeout=4) as resp:
                      return len(json.loads(resp.read().decode()).get("items", []))

              try:
                  evt_count = fetch_k8s("events")
                  print(f"Audit collector initialized: {evt_count} events visible in {ns}")
              except Exception as e:
                  print(f"FATAL: Kubernetes API access denied: {e}", file=sys.stderr)
                  sys.exit(1)

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/api/audit/events", "/healthz"):
                          events = fetch_k8s("events")
                          body = json.dumps({"service": "audit-collector", "namespace": ns, "events": events, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.auditCollector.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.auditCollector.resources | nindent 12 }}
