apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-reporter
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: slow-reporter
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.slowReporter.replicaCount }}
  selector:
    matchLabels:
      app: slow-reporter
  template:
    metadata:
      labels:
        app: slow-reporter
    spec:
      containers:
        - name: slow-reporter
          image: "{{ .Values.slowReporter.image.repository }}:{{ .Values.slowReporter.image.tag }}"
          imagePullPolicy: {{ .Values.slowReporter.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.slowReporter.port }}
          env:
            - name: DELAY_SEC
              value: {{ .Values.slowReporter.delaySeconds | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os, time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              DELAY = float(os.environ.get("DELAY_SEC", "2.5"))

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path == "/healthz":
                          body = b'{"status":"ok"}\n'
                          self.send_response(200)
                      elif self.path == "/api/reports/slow":
                          time.sleep(DELAY)
                          body = json.dumps({"service": "slow-reporter", "elapsed_s": DELAY, "status": "ok"}).encode()
                          self.send_response(200)
                      else:
                          body = b'{"error":"not_found"}\n'
                          self.send_response(404)
                      try:
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              ReusableServer(("0.0.0.0", {{ .Values.slowReporter.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.slowReporter.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.slowReporter.resources | nindent 12 }}
