apiVersion: v1
kind: Service
metadata:
  name: vault-core
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-core
    app.kubernetes.io/part-of: meridianpay
spec:
  selector:
    app: vault-core
  ports:
    - name: http
      port: {{ .Values.vaultCore.port }}
      targetPort: {{ .Values.vaultCore.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-core
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-core
    app.kubernetes.io/part-of: meridianpay
spec:
  replicas: {{ .Values.vaultCore.replicaCount }}
  selector:
    matchLabels:
      app: vault-core
  template:
    metadata:
      labels:
        app: vault-core
    spec:
      containers:
        - name: vault-core
          image: "{{ .Values.vaultCore.image.repository }}:{{ .Values.vaultCore.image.tag }}"
          imagePullPolicy: {{ .Values.vaultCore.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vaultCore.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class ReusableServer(ThreadingHTTPServer):
                  allow_reuse_address = True

              class Handler(BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]
                  def log_message(self, fmt, *args):
                      pass
                  def do_GET(self):
                      if self.path in ("/verify", "/healthz"):
                          body = json.dumps({"service": "vault-core", "key_state": "active", "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

              ReusableServer(("0.0.0.0", {{ .Values.vaultCore.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.vaultCore.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.vaultCore.resources | nindent 12 }}
