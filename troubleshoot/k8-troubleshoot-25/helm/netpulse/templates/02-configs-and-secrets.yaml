apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ledgerDb.secretName }}
  namespace: {{ .Values.namespaces.data }}
type: Opaque
stringData:
  {{ .Values.ledgerDb.secretKey }}: "NetPulseZeroTrust2026!"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ledgerDb.secretName }}
  namespace: {{ .Values.namespaces.core }}
type: Opaque
stringData:
  {{ .Values.ledgerDb.secretKey }}: "NetPulseZeroTrust2026!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-engine-config
  namespace: {{ .Values.namespaces.core }}
data:
  LEDGER_HOST: "ledger-db-0.{{ .Values.ledgerDb.headlessServiceName }}.{{ .Values.namespaces.data }}.svc.cluster.local"
  LEDGER_PORT: {{ .Values.ledgerDb.port | quote }}
  SIGNER_URL: "http://token-signer.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.tokenSigner.port }}/v1/sign"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-router-conf
  namespace: {{ .Values.namespaces.edge }}
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      resolver kube-dns.kube-system.svc.cluster.local valid=5s;
      server {
        listen {{ .Values.edgeRouter.port }};

        location = /edge-health {
          return 200 '{"edge_router":"ok"}\n';
          add_header Content-Type application/json;
        }

        location / {
          proxy_connect_timeout 3s;
          proxy_read_timeout 5s;
          proxy_pass {{ .Values.edgeRouter.upstreamUrl }};
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }
