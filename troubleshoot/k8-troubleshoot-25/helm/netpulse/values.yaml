global:
  environment: production
  ingressHost: "netpulse.127.0.0.1.nip.io"

namespaces:
  edge: netpulse-edge
  core: netpulse-core
  data: netpulse-data

# =====================================================================
# BÖLÜM 1: VERİ KATMANI (netpulse-data)
# =====================================================================
ledgerDb:
  replicas: 1
  image: redis:7.2-alpine
  port: 6379
  # [Fault 1] Kümede olmayan bir StorageClass adı
  storageClassName: azure-ultra-nvme
  storageSize: 1Gi
  # [Fault 2] Headless Service adı 'ledger-headless' iken StatefulSet serviceName farklı!
  serviceName: ledger-internal-svc
  headlessServiceName: ledger-headless
  secretName: netpulse-data-secret
  secretKey: REDIS_PASSWORD

tokenSigner:
  replicas: 1
  image: python:3.11-alpine
  # [Fault 3] Uygulama 0.0.0.0 yerine sadece loopback (127.0.0.1) dinliyor!
  bindAddress: "127.0.0.1"
  port: 9000

dataNetworkPolicy:
  # [Fault 4a] netpulse-core namespace'inin gerçek etiketi 'core' iken burada 'backend-v1' aranıyor!
  allowedNamespaceTier: backend-v1
  allowedRedisPort: 6379
  # [Fault 4b] token-signer 9000 portunda çalışırken NetworkPolicy 9090 portuna izin veriyor!
  allowedSignerPort: 9090

netAgent:
  image: busybox:1.36
  # [Fault 5] Node'larda olmayan donanım etiketi ve salt-okunur dosya sistemi
  nodeSelector:
    network-card: smartnic-100g
  readOnlyRootFilesystem: true
  mountRunEmptyDir: false

# =====================================================================
# BÖLÜM 2: ÇEKİRDEK KATMAN (netpulse-core)
# =====================================================================
rbac:
  serviceAccountName: core-engine-sa
  # [Fault 6] 'services' var ancak 'endpoints' kaynağı listede eksik!
  allowedResources:
    - pods
    - configmaps
    - secrets
    - services

sharedStorage:
  pvcName: audit-archive-pvc
  storageClassName: managed-csi
  accessMode: ReadWriteOnce
  size: 1Gi

paymentEngine:
  replicas: 2
  image: python:3.11-alpine
  serviceAccountName: core-engine-sa
  port: 8080
  containerPortName: http-api
  # [Fault 10a] Pod etiketi 'core-engine' iken Service selector 'legacy-engine' arıyor!
  serviceSelectorComponent: legacy-engine
  # [Fault 10b] Container port adı 'http-api' iken Service targetPort 'http-legacy' arıyor!
  serviceTargetPort: http-legacy
  livenessProbe:
    path: /healthz
    # [Fault 9] Uygulama 8080 portunda çalışırken livenessProbe 8081 portuna vuruyor!
    port: 8081
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"

coreNetworkPolicy:
  # [Fault 7] Egress açık ancak CoreDNS (UDP/TCP 53) izni kapalı! Hiçbir DNS adı çözülemez!
  allowDnsEgress: false
  allowedDataRedisPort: 6379
  # [Fault 8] Egress kuralında token-signer (9000) yerine yanlışlıkla 9099 portuna çıkış verilmiş!
  allowedDataSignerPort: 9099
  # [Fault 13] Ingress kuralında netpulse-edge ('edge') yerine 'api-gateway' tier etiketi aranıyor!
  allowedIngressTier: api-gateway

batch:
  seedJob:
    image: redis:7.2-alpine
    # [Fault 11a] Redis 6379 portunda çalışırken seed job 6380 portuna bağlanmaya çalışıyor!
    targetRedisPort: 6380
  reconcileCron:
    image: busybox:1.36
    schedule: "*/2 * * * *"
    suspend: false

scaling:
  hpa:
    # [Fault 11b] Deployment adı 'payment-engine' iken HPA 'payment-api-v1' arıyor!
    targetDeploymentName: payment-api-v1
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    # [Fault 11c] 2 replikalı Deployment için minAvailable: 3 (ALLOWED DISRUPTIONS: 0)
    minAvailable: 3

# =====================================================================
# BÖLÜM 3: EDGE GATEWAY & INGRESS KATMANI (netpulse-edge)
# =====================================================================
edgeRouter:
  replicas: 1
  image: nginx:1.25-alpine
  port: 8080
  # [Fault 12] Farklı namespace'teki servise kısa adla ('payment-engine') gidilemez! Tam FQDN gerekli!
  upstreamUrl: "http://payment-engine:8080"

edgeNetworkPolicy:
  # [Fault 14] NGINX Ingress Controller 'ingress-nginx' namespace'inde çalışırken burada 'kube-ingress' yazılmış!
  allowedIngressControllerNamespace: kube-ingress

ingress:
  # [Fault 15] Kümede 'nginx' IngressClass varken 'istio-external' yazıldığı için ADDRESS boş kalır!
  className: istio-external
  # [Fault 16] İstemciler '/api/v1/status' adresine gelirken path '/v2/internal' olarak kısıtlanmış (404 döner)!
  path: /v2/internal
