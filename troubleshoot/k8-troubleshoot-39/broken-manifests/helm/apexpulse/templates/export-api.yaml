apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: export-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: export-api
  template:
    metadata:
      labels:
        app: export-api
    spec:
      containers:
        - name: export-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json, time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      time.sleep(4)
                      body = json.dumps({"service": "export-api", "status": "completed", "rows": 2500}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.export.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.export.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.export.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: export-api
  namespace: {{ .Values.namespaces.web }}
spec:
  selector:
    app: export-api
  ports:
    - name: http
      port: {{ .Values.export.servicePort }}
      targetPort: {{ .Values.export.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: export-ingress
  namespace: {{ .Values.namespaces.web }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.export.proxyReadTimeout | quote }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /export
            pathType: Prefix
            backend:
              service:
                name: export-api
                port:
                  number: {{ .Values.export.servicePort }}
