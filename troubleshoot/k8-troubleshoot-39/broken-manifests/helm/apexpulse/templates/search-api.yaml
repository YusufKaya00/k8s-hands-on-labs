apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      containers:
        - name: search-api
          image: {{ .Values.global.pythonImage }}
          env:
            - name: BIND_HOST
              value: {{ .Values.search.bindHost | quote }}
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              bind_host = os.environ.get("BIND_HOST", "0.0.0.0")
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "search-api", "status": "ok", "bindHost": bind_host}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer((bind_host, {{ .Values.search.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.search.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.search.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: {{ .Values.namespaces.web }}
spec:
  selector:
    app: search-api
  ports:
    - name: http
      port: {{ .Values.search.servicePort }}
      targetPort: {{ .Values.search.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  number: {{ .Values.search.servicePort }}
