apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: billing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: billing-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "billing-api", "status": "ok", "invoices": 14}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.billing.containerPort }}), H).serve_forever()
          ports:
            - name: {{ .Values.billing.containerPortName }}
              containerPort: {{ .Values.billing.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.billing.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: {{ .Values.namespaces.web }}
spec:
  selector:
    app: billing-api
  ports:
    - name: http
      port: {{ .Values.billing.servicePort }}
      targetPort: {{ .Values.billing.serviceTargetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: billing-api
                port:
                  number: {{ .Values.billing.servicePort }}
