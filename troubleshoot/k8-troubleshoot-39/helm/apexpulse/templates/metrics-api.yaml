apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-api
  namespace: {{ .Values.namespaces.web }}
  labels:
    app: metrics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-api
  template:
    metadata:
      labels:
        app: metrics-api
    spec:
      containers:
        - name: metrics-api
          image: {{ .Values.global.pythonImage }}
          command:
            - python3
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                          return
                      if self.path.startswith("/metrics"):
                          body = json.dumps({"service": "metrics-api", "status": "ok", "rps": 310}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                          return
                      self.send_response(404)
                      self.end_headers()
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.metrics.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.metrics.containerPort }}
          livenessProbe:
            httpGet:
              path: {{ .Values.metrics.livenessPath }}
              port: {{ .Values.metrics.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 4
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-api
  namespace: {{ .Values.namespaces.web }}
spec:
  selector:
    app: metrics-api
  ports:
    - name: http
      port: {{ .Values.metrics.servicePort }}
      targetPort: {{ .Values.metrics.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics-ingress
  namespace: {{ .Values.namespaces.web }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: metrics-api
                port:
                  number: {{ .Values.metrics.servicePort }}
