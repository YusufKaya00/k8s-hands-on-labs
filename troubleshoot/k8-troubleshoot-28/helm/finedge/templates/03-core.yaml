metadata:
  name: fraud-service
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: fraud-service
spec:
  replicas: {{ .Values.fraudService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - payment-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: fraud
          image: "{{ .Values.fraudService.image.repository }}:{{ .Values.fraudService.image.tag }}"
          imagePullPolicy: {{ .Values.fraudService.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, os, socket

              NODE_NAME = os.environ.get("NODE_NAME", "unknown")

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class FraudHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def do_GET(self):
                      body = json.dumps({
                          "fraud_check": "PASS",
                          "risk_score": 0.02,
                          "node": NODE_NAME,
                          "pod": socket.gethostname()
                      }).encode()
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", 8083), FraudHandler) as httpd:
                  print(f"fraud-service listening on 0.0.0.0:8083 (node={NODE_NAME})", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.fraudService.containerPort }}
          readinessProbe:
            httpGet:
              path: /verify
              port: {{ .Values.fraudService.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
