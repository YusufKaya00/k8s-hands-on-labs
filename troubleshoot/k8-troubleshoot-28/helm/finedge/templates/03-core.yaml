apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-logger
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: audit-logger
spec:
  replicas: {{ .Values.auditLogger.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-logger
    spec:
      containers:
        - name: logger
          image: "{{ .Values.auditLogger.image.repository }}:{{ .Values.auditLogger.image.tag }}"
          imagePullPolicy: {{ .Values.auditLogger.image.pullPolicy }}
          env:
            - name: LEDGER_NS
              value: {{ .Values.namespaces.ledger | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, urllib.request, json, os, socket

              LEDGER_NS = os.environ.get("LEDGER_NS", "finedge-ledger")

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class AuditHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def send_json(self, code, payload):
                      body = json.dumps(payload).encode()
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_json(200, {"status": "alive"})
                      elif self.path == "/audit/check":
                          host = f"compliance-vault.{LEDGER_NS}.svc.cluster.local"
                          try:
                              resolved_vip = socket.gethostbyname(host)
                          except Exception as e:
                              self.send_json(502, {"vault_status": "dns_failed", "error": str(e)})
                              return
                          url = f"http://{host}:8085/record"
                          try:
                              with urllib.request.urlopen(url, timeout=1.0) as resp:
                                  data = json.loads(resp.read().decode())
                                  self.send_json(200, {
                                      "audit_status": "ok",
                                      "resolved_vip": resolved_vip,
                                      "vault": data
                                  })
                          except Exception as e:
                              msg = str(e)
                              code = 504 if "timed out" in msg.lower() else 502
                              self.send_json(code, {
                                  "audit_status": "blocked",
                                  "resolved_vip": resolved_vip,
                                  "target": url,
                                  "error": msg
                              })
                      else:
                          self.send_json(404, {"error": "not found"})

              with ThreadedTCPServer(("0.0.0.0", 18091), AuditHandler) as httpd:
                  print("audit-logger listening on 0.0.0.0:18091", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.auditLogger.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.auditLogger.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{- toYaml .Values.auditLogger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: audit-logger
  namespace: {{ .Values.namespaces.core }}
spec:
  type: {{ .Values.auditLogger.service.type }}
  selector:
    app.kubernetes.io/name: audit-logger
  ports:
    - name: http
      port: {{ .Values.auditLogger.service.port }}
      targetPort: {{ .Values.auditLogger.service.targetPort }}
---
{{- if .Values.auditLogger.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-logger-netpol
  namespace: {{ .Values.namespaces.core }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-logger
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
{{- toYaml .Values.auditLogger.networkPolicy.vaultEgressTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8085
{{- end }}
