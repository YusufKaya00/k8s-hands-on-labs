apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: payment-api
spec:
  replicas: {{ .Values.paymentApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - fraud-service
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: "{{ .Values.paymentApi.image.repository }}:{{ .Values.paymentApi.image.tag }}"
          imagePullPolicy: {{ .Values.paymentApi.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RECONCILE_DURATION
              value: {{ .Values.paymentApi.reconcileDurationSec | quote }}
            - name: CORE_NS
              value: {{ .Values.namespaces.core | quote }}
            - name: LEDGER_NS
              value: {{ .Values.namespaces.ledger | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, urllib.request, urllib.error, json, os, socket, time

              NODE_NAME = os.environ.get("NODE_NAME", "unknown")
              RECONCILE_DURATION = float(os.environ.get("RECONCILE_DURATION", "4"))
              CORE_NS = os.environ.get("CORE_NS", "finedge-core")
              LEDGER_NS = os.environ.get("LEDGER_NS", "finedge-ledger")

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              def fetch_json(url, timeout=1.2):
                  try:
                      req = urllib.request.Request(url)
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as e:
                      raw = e.read().decode()
                      try:
                          return e.code, json.loads(raw)
                      except Exception:
                          return e.code, {"error": raw}
                  except Exception as e:
                      msg = str(e)
                      code = 504 if "timed out" in msg.lower() else 502
                      return code, {"error": msg, "target": url}

              class PaymentHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def send_json(self, code, payload):
                      body = json.dumps(payload).encode()
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          print(f"WARNING: Client closed connection early on {self.path} (BrokenPipeError)", flush=True)

                  def do_POST(self):
                      if self.path == "/api/v1/settlements/batch":
                          length = int(self.headers.get("Content-Length", 0))
                          remaining = length
                          while remaining > 0:
                              chunk = self.rfile.read(min(65536, remaining))
                              if not chunk:
                                  break
                              remaining -= len(chunk)
                          print(f"Accepted settlement batch payload: {length} bytes", flush=True)
                          self.send_json(200, {
                              "status": "accepted",
                              "payload_bytes": length,
                              "pod": socket.gethostname()
                          })
                      else:
                          self.send_json(404, {"error": "not found"})

                  def do_GET(self):
                      if self.path == "/api/v1/health":
                          self.send_json(200, {
                              "service": "payment-api",
                              "status": "healthy",
                              "node": NODE_NAME,
                              "pod": socket.gethostname()
                          })
                      elif self.path == "/admin/status":
                          self.send_json(200, {
                              "service": "payment-api",
                              "admin": "online",
                              "protocol": "http",
                              "pod": socket.gethostname()
                          })
                      elif self.path == "/api/v1/reconcile":
                          print(f"Starting reconciliation job ({RECONCILE_DURATION}s)...", flush=True)
                          time.sleep(RECONCILE_DURATION)
                          print("Reconciliation computation finished, sending HTTP 200", flush=True)
                          self.send_json(200, {
                              "status": "reconciled",
                              "duration_sec": RECONCILE_DURATION,
                              "pod": socket.gethostname()
                          })
                      elif self.path == "/api/v1/pay":
                          code, data = fetch_json(f"http://fraud-service.{CORE_NS}.svc.cluster.local:8083/verify")
                          if code == 200:
                              self.send_json(200, {
                                  "payment": "approved",
                                  "caller_node": NODE_NAME,
                                  "fraud_service": data
                              })
                          else:
                              self.send_json(code, {
                                  "payment": "failed",
                                  "caller_node": NODE_NAME,
                                  "upstream": "fraud-service:8083",
                                  "detail": data
                              })
                      elif self.path == "/api/v1/dispatcher":
                          code, data = fetch_json(f"http://webhook-dispatcher.{CORE_NS}.svc.cluster.local:18090/dispatch/check", timeout=2.0)
                          out_code = 200 if data.get("dns_ok") else 502
                          self.send_json(out_code, data)
                      elif self.path == "/api/v1/audit":
                          code, data = fetch_json(f"http://audit-logger.{CORE_NS}.svc.cluster.local:18091/audit/check", timeout=2.0)
                          self.send_json(code, data)
                      elif self.path == "/api/v1/ledger":
                          code, data = fetch_json(f"http://ledger-api.{LEDGER_NS}.svc.cluster.local:80/ledger/balance")
                          self.send_json(code, {
                              "ledger_call": "ok" if code == 200 else "failed",
                              "upstream": f"ledger-api.{LEDGER_NS}:80",
                              "detail": data
                          })
                      elif self.path == "/api/v1/settle":
                          code, data = fetch_json(f"http://settlement-worker.{LEDGER_NS}.svc.cluster.local:8084/settle")
                          self.send_json(code, {
                              "settlement_call": "ok" if code == 200 else "failed",
                              "upstream": f"settlement-worker.{LEDGER_NS}:8084",
                              "detail": data
                          })
                      elif self.path == "/api/v1/ledger/db-dns":
                          svc_name = f"ledger-headless.{LEDGER_NS}.svc.cluster.local"
                          pod_fqdn = f"ledger-db-0.ledger-headless.{LEDGER_NS}.svc.cluster.local"
                          try:
                              pod_dns_ip = socket.gethostbyname(pod_fqdn)
                              svc_dns_ip = socket.gethostbyname(svc_name)
                              with socket.create_connection((svc_dns_ip, 6379), timeout=1.2):
                                  pass
                              if svc_dns_ip != pod_dns_ip:
                                  self.send_json(502, {
                                      "db_dns": "failed",
                                      "error": "Headless service resolved to virtual ClusterIP instead of direct Pod IP",
                                      "svc_dns": svc_name,
                                      "svc_dns_ip": svc_dns_ip,
                                      "pod_fqdn": pod_fqdn,
                                      "pod_dns_ip": pod_dns_ip
                                  })
                              else:
                                  self.send_json(200, {
                                      "db_dns": "ok",
                                      "svc_dns": svc_name,
                                      "pod_fqdn": pod_fqdn,
                                      "resolved_ip": pod_dns_ip
                                  })
                          except Exception as e:
                              self.send_json(502, {
                                  "db_dns": "failed",
                                  "target": pod_fqdn,
                                  "error": str(e)
                              })
                      else:
                          self.send_json(404, {"error": "not found", "path": self.path})

              with ThreadedTCPServer(("0.0.0.0", 8080), PaymentHandler) as httpd:
                  print(f"payment-api listening on 0.0.0.0:8080 (node={NODE_NAME})", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.paymentApi.containerPort }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.paymentApi.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.paymentApi.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{- toYaml .Values.paymentApi.resources | nindent 12 }}
