apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-dispatcher
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: webhook-dispatcher
spec:
  replicas: {{ .Values.webhookDispatcher.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-dispatcher
    spec:
      hostNetwork: {{ .Values.webhookDispatcher.hostNetwork }}
      dnsPolicy: {{ .Values.webhookDispatcher.dnsPolicy }}
      containers:
        - name: dispatcher
          image: "{{ .Values.webhookDispatcher.image.repository }}:{{ .Values.webhookDispatcher.image.tag }}"
          imagePullPolicy: {{ .Values.webhookDispatcher.image.pullPolicy }}
          env:
            - name: CORE_NS
              value: {{ .Values.namespaces.core | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, urllib.request, json, os

              CORE_NS = os.environ.get("CORE_NS", "finedge-core")

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              def get_nameservers():
                  try:
                      with open("/etc/resolv.conf") as f:
                          return [line.strip() for line in f if line.startswith("nameserver")]
                  except Exception as e:
                      return [str(e)]

              class DispatcherHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def send_json(self, code, payload):
                      body = json.dumps(payload).encode()
                      try:
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_json(200, {"status": "alive"})
                      elif self.path == "/dispatch/check":
                          target = f"http://payment-api.{CORE_NS}.svc.cluster.local:8080/api/v1/health"
                          ns_list = get_nameservers()
                          try:
                              with urllib.request.urlopen(target, timeout=2.0) as resp:
                                  self.send_json(200, {
                                      "dns_ok": True,
                                      "target": target,
                                      "nameservers": ns_list,
                                      "upstream_status": resp.status
                                  })
                          except Exception as e:
                              print(f"Dispatcher DNS/connect check failed: {e}", flush=True)
                              self.send_json(200, {
                                  "dns_ok": False,
                                  "target": target,
                                  "nameservers": ns_list,
                                  "error": str(e)
                              })
                      else:
                          self.send_json(404, {"error": "not found"})

              with ThreadedTCPServer(("0.0.0.0", 18090), DispatcherHandler) as httpd:
                  print("webhook-dispatcher listening on 0.0.0.0:18090", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.webhookDispatcher.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.webhookDispatcher.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{- toYaml .Values.webhookDispatcher.resources | nindent 12 }}
