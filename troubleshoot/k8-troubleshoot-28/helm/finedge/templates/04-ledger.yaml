apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: {{ .Values.namespaces.ledger }}
  labels:
    app.kubernetes.io/name: ledger-api
spec:
  replicas: {{ .Values.ledgerApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-api
    spec:
      containers:
        - name: ledger
          image: "{{ .Values.ledgerApi.image.repository }}:{{ .Values.ledgerApi.image.tag }}"
          imagePullPolicy: {{ .Values.ledgerApi.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, socket

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class LedgerHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def do_GET(self):
                      body = json.dumps({
                          "ledger": "balanced",
                          "currency": "USD",
                          "available_balance": 1489200.50,
                          "pod": socket.gethostname()
                      }).encode()
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", 8082), LedgerHandler) as httpd:
                  print("ledger-api listening on 0.0.0.0:8082", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.ledgerApi.containerPort }}
          readinessProbe:
            httpGet:
              path: /ledger/balance
              port: {{ .Values.ledgerApi.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{- toYaml .Values.ledgerApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: {{ .Values.namespaces.ledger }}
spec:
  type: {{ .Values.ledgerApi.service.type }}
  selector:
    app.kubernetes.io/name: ledger-api
  ports:
    - name: http
      port: {{ .Values.ledgerApi.service.port }}
      targetPort: {{ .Values.ledgerApi.service.targetPort }}
      protocol: TCP
---
{{- if .Values.ledgerApi.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-api-netpol
  namespace: {{ .Values.namespaces.ledger }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.core }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-api
      ports:
        - protocol: TCP
          port: {{ .Values.ledgerApi.networkPolicy.allowedPort }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: {{ .Values.namespaces.ledger }}
  labels:
    app.kubernetes.io/name: settlement-worker
spec:
  replicas: {{ .Values.settlementWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.settlementWorker.image.repository }}:{{ .Values.settlementWorker.image.tag }}"
          imagePullPolicy: {{ .Values.settlementWorker.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, socketserver, json, socket

              class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              class SettlementHandler(http.server.BaseHTTPRequestHandler):
                  def address_string(self):
                      return self.client_address[0]

                  def do_GET(self):
                      body = json.dumps({
                          "settlement": "committed",
                          "batch_id": "STL-2026-8841",
                          "pod": socket.gethostname()
                      }).encode()
                      try:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      except BrokenPipeError:
                          pass

              with ThreadedTCPServer(("0.0.0.0", 8084), SettlementHandler) as httpd:
                  print("settlement-worker listening on 0.0.0.0:8084", flush=True)
                  httpd.serve_forever()
          ports:
            - name: http
              containerPort: {{ .Values.settlementWorker.containerPort }}
          readinessProbe:
            httpGet:
              path: /settle
              port: {{ .Values.settlementWorker.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{- toYaml .Values.settlementWorker.resources | nindent 12 }}
