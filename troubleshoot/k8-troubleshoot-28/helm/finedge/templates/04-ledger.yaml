apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ledgerDb.headlessService.name }}
  namespace: {{ .Values.namespaces.ledger }}
spec:
{{- if .Values.ledgerDb.headlessService.clusterIP }}
  clusterIP: {{ .Values.ledgerDb.headlessService.clusterIP | quote }}
{{- end }}
  selector:
    app.kubernetes.io/name: ledger-db
  ports:
    - name: redis
      port: {{ .Values.ledgerDb.headlessService.port }}
      targetPort: {{ .Values.ledgerDb.containerPort }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.ledger }}
spec:
  serviceName: {{ .Values.ledgerDb.statefulSet.serviceName }}
  replicas: {{ .Values.ledgerDb.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-db
    spec:
      containers:
        - name: redis
          image: "{{ .Values.ledgerDb.image.repository }}:{{ .Values.ledgerDb.image.tag }}"
          imagePullPolicy: {{ .Values.ledgerDb.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.ledgerDb.containerPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.ledgerDb.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
{{- toYaml .Values.ledgerDb.resources | nindent 12 }}
