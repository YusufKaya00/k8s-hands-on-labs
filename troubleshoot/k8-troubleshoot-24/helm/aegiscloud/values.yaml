global:
  environment: production
  ingressHost: "aegis.127.0.0.1.nip.io"

namespaces:
  edge: aegis-edge
  core: aegis-core
  data: aegis-data

priorityClass:
  name: aegis-high-priority
  value: 1000000

quotas:
  core:
    requestsCpu: "2"
    requestsMemory: "1Gi"
    limitsCpu: "6"
    limitsMemory: "6Gi"
    pods: "15"

limitRange:
  core:
    defaultCpuLimit: "600m"
    defaultMemoryLimit: "512Mi"
    defaultCpuRequest: "50m"
    defaultMemoryRequest: "64Mi"

rbac:
  serviceAccountName: aegis-core-sa
  allowedResources:
    - pods
    - configmaps
    - secrets
    - services
    - endpoints

sharedStorage:
  pvcName: aegis-shared-report
  storageClassName: managed-csi
  accessMode: ReadWriteOnce
  size: 2Gi

stateStore:
  replicas: 1
  image: redis:7.2-alpine
  priorityClassName: aegis-high-priority
  serviceName: state-store-headless
  headlessServiceName: state-store-headless
  port: 6379
  storageClassName: managed-csi
  storageSize: 1Gi
  secretName: aegis-data-secrets
  secretDataKey: REDIS_AUTH_TOKEN
  envSecretKey: REDIS_MASTER_PASS

cryptoVault:
  replicas: 1
  image: python:3.11-alpine
  bindAddress: "0.0.0.0"
  port: 8443
  networkPolicy:
    targetLabelTier: security-vault
    allowedPort: 8443

nodeSentinel:
  image: busybox:1.36
  nodeSelector:
    accelerator: nvidia-h100
  readOnlyRootFilesystem: true
  mountLogEmptyDir: true

coreApi:
  replicas: 2
  image: python:3.11-alpine
  serviceAccountName: aegis-core-sa
  port: 8000
  containerPortName: http-core
  serviceTargetPort: http-core
  serviceSelectorComponent: core-api
  configVaultAddr: "http://crypto-vault.aegis-data.svc.cluster.local:8443"
  overrideVaultAddr: ""
  livenessProbe:
    path: /healthz
    port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "2Gi"
  egressPolicy:
    allowDns: true
    allowedDataPort: 6379

batch:
  migrator:
    image: busybox:1.36
    targetRedisPort: 6379
  auditor:
    image: busybox:1.36
    schedule: "*/2 * * * *"
    suspend: false

scaling:
  hpa:
    targetDeploymentName: core-api
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    minAvailable: 3

edgeProxy:
  replicas: 1
  image: nginx:1.25-alpine
  port: 8080
  upstreamUrl: "http://core-api.aegis-core.svc.cluster.local:8000"

ingress:
  className: nginx-internal
  backendPath: /backend
