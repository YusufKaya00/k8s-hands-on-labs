apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.edge }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.edge }}
    aegis.io/zone: edge
    environment: {{ .Values.global.environment }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.core }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.core }}
    aegis.io/zone: core
    environment: {{ .Values.global.environment }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.data }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.namespaces.data }}
    aegis.io/zone: data
    environment: {{ .Values.global.environment }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
description: "Priority class for mission-critical AegisCloud stateful services"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aegis-core-quota
  namespace: {{ .Values.namespaces.core }}
spec:
  hard:
    requests.cpu: {{ .Values.quotas.core.requestsCpu | quote }}
    requests.memory: {{ .Values.quotas.core.requestsMemory | quote }}
    limits.cpu: {{ .Values.quotas.core.limitsCpu | quote }}
    limits.memory: {{ .Values.quotas.core.limitsMemory | quote }}
    pods: {{ .Values.quotas.core.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: aegis-core-limits
  namespace: {{ .Values.namespaces.core }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.core.defaultCpuLimit | quote }}
        memory: {{ .Values.limitRange.core.defaultMemoryLimit | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.core.defaultCpuRequest | quote }}
        memory: {{ .Values.limitRange.core.defaultMemoryRequest | quote }}
