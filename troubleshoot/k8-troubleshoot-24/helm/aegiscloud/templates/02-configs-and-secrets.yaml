apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.stateStore.secretName }}
  namespace: {{ .Values.namespaces.data }}
type: Opaque
stringData:
  {{ .Values.stateStore.secretDataKey }}: "AegisSovereignRedisPass2026!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: {{ .Values.namespaces.core }}
data:
  STATE_STORE_HOST: "state-store-0.{{ .Values.stateStore.headlessServiceName }}.{{ .Values.namespaces.data }}.svc.cluster.local"
  STATE_STORE_PORT: {{ .Values.stateStore.port | quote }}
  VAULT_ADDR: {{ .Values.coreApi.configVaultAddr | quote }}
  REPORT_MOUNT_PATH: "/mnt/shared-reports"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-config
  namespace: {{ .Values.namespaces.edge }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 512;
    }

    http {
      proxy_temp_path /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen {{ .Values.edgeProxy.port }};
        server_name _;

        location /edge-health {
          access_log off;
          return 200 '{"edge":"healthy","version":"7.0.0"}\n';
          add_header Content-Type application/json;
        }

        location / {
          proxy_pass {{ .Values.edgeProxy.upstreamUrl }};
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_connect_timeout 3s;
          proxy_read_timeout 5s;
        }
      }
    }
