apiVersion: v1
kind: Service
metadata:
  name: crypto-vault
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: crypto-vault
    tier: security-vault
spec:
  selector:
    app: crypto-vault
    tier: security-vault
  ports:
    - name: http-vault
      port: {{ .Values.cryptoVault.port }}
      targetPort: {{ .Values.cryptoVault.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-vault
  namespace: {{ .Values.namespaces.data }}
spec:
  replicas: {{ .Values.cryptoVault.replicas }}
  selector:
    matchLabels:
      app: crypto-vault
      tier: security-vault
  template:
    metadata:
      labels:
        app: crypto-vault
        tier: security-vault
    spec:
      containers:
        - name: vault-engine
          image: {{ .Values.cryptoVault.image }}
          command:
            - python3
            - -u
            - -c
            - |
              import os, json
              from http.server import BaseHTTPRequestHandler, HTTPServer

              BIND_ADDR = os.environ.get("VAULT_BIND_ADDR", "127.0.0.1")
              PORT = int(os.environ.get("VAULT_PORT", "8443"))

              class VaultHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ["/healthz", "/v1/keys/status"]:
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          payload = {"vault": "sealed_verified", "key_id": "aegis-kms-v7", "status": "ok"}
                          self.wfile.write(json.dumps(payload).encode())
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      return

              print(f"Starting Crypto-Vault HSM Simulator on {BIND_ADDR}:{PORT}")
              HTTPServer((BIND_ADDR, PORT), VaultHandler).serve_forever()
          env:
            - name: VAULT_BIND_ADDR
              value: {{ .Values.cryptoVault.bindAddress | quote }}
            - name: VAULT_PORT
              value: {{ .Values.cryptoVault.port | quote }}
          ports:
            - name: http-vault
              containerPort: {{ .Values.cryptoVault.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.cryptoVault.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
