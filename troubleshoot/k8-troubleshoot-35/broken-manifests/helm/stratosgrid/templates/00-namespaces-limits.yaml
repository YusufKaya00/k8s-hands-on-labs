apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.edge }}
  labels:
    stratos.io/tier: edge
    app.kubernetes.io/part-of: stratosgrid
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.core }}
  labels:
    stratos.io/tier: core
    app.kubernetes.io/part-of: stratosgrid
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.data }}
  labels:
    stratos.io/tier: data
    app.kubernetes.io/part-of: stratosgrid
---
apiVersion: v1
kind: LimitRange
metadata:
  name: core-limit-range
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/part-of: stratosgrid
spec:
  limits:
    - type: Container
      max:
        memory: {{ .Values.coreLimitRange.maxMemory }}
        cpu: {{ .Values.coreLimitRange.maxCpu }}
      default:
        memory: {{ .Values.coreLimitRange.defaultMemory }}
      defaultRequest:
        memory: {{ .Values.coreLimitRange.defaultRequestMemory }}
