# 5. checkout-api (Ticket 6: Hard podAntiAffinity deadlock on 2 nodes)
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: {{ .Values.checkoutApi.port }}
      targetPort: {{ .Values.checkoutApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  replicas: {{ .Values.checkoutApi.replicaCount }}
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      tolerations:
        - key: {{ .Values.nodeAgent.tolerationKey | quote }}
          operator: Equal
          value: {{ .Values.nodeAgent.tolerationValue | quote }}
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          {{- if eq .Values.checkoutApi.antiAffinityMode "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: checkout-api
              topologyKey: kubernetes.io/hostname
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: checkout-api
                topologyKey: kubernetes.io/hostname
          {{- end }}
      containers:
        - name: app
          image: "{{ .Values.checkoutApi.image.repository }}:{{ .Values.checkoutApi.image.tag }}"
          imagePullPolicy: {{ .Values.checkoutApi.image.pullPolicy }}
          command: ["python3", "/app/simple.py"]
          env:
            - name: PORT
              value: {{ .Values.checkoutApi.port | quote }}
            - name: SERVICE_NAME
              value: "checkout-api"
          ports:
            - name: http
              containerPort: {{ .Values.checkoutApi.port }}
          readinessProbe:
            httpGet:
              path: /api/checkout/status
              port: {{ .Values.checkoutApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            {{- toYaml .Values.checkoutApi.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: core-apps-code
---
# 6. report-api (Ticket 7: runAsNonRoot without runAsUser)
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: report-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  selector:
    app: report-api
  ports:
    - name: http
      port: {{ .Values.reportApi.port }}
      targetPort: {{ .Values.reportApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: report-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  replicas: {{ .Values.reportApi.replicaCount }}
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      containers:
        - name: app
          image: "{{ .Values.reportApi.image.repository }}:{{ .Values.reportApi.image.tag }}"
          imagePullPolicy: {{ .Values.reportApi.image.pullPolicy }}
          command: ["python3", "/app/simple.py"]
          env:
            - name: PORT
              value: {{ .Values.reportApi.port | quote }}
            - name: SERVICE_NAME
              value: "report-api"
          ports:
            - name: http
              containerPort: {{ .Values.reportApi.port }}
          securityContext:
            runAsNonRoot: {{ .Values.reportApi.securityContext.runAsNonRoot }}
            {{- if .Values.reportApi.securityContext.runAsUser }}
            runAsUser: {{ .Values.reportApi.securityContext.runAsUser }}
            {{- end }}
            {{- if .Values.reportApi.securityContext.runAsGroup }}
            runAsGroup: {{ .Values.reportApi.securityContext.runAsGroup }}
            {{- end }}
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /api/reports/health
              port: {{ .Values.reportApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            {{- toYaml .Values.reportApi.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: core-apps-code
---
