# 1. catalog-api + stratos-catalog-ingress (Ticket 1)
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      port: {{ .Values.catalogApi.port }}
      targetPort: {{ .Values.catalogApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  replicas: {{ .Values.catalogApi.replicaCount }}
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: app
          image: "{{ .Values.catalogApi.image.repository }}:{{ .Values.catalogApi.image.tag }}"
          imagePullPolicy: {{ .Values.catalogApi.image.pullPolicy }}
          command: ["python3", "/app/catalog.py"]
          env:
            - name: PORT
              value: {{ .Values.catalogApi.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.catalogApi.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.catalogApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            {{- toYaml .Values.catalogApi.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: core-apps-code
{{- if .Values.catalogIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stratos-catalog-ingress
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/part-of: stratosgrid
  annotations:
    {{- if eq (toString .Values.catalogIngress.useRegex) "true" }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
    {{- if .Values.catalogIngress.rewriteTarget }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.catalogIngress.rewriteTarget | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.catalogIngress.ingressClassName }}
  rules:
    - host: {{ .Values.global.ingressHost | quote }}
      http:
        paths:
          - path: {{ .Values.catalogIngress.path }}
            pathType: {{ .Values.catalogIngress.pathType }}
            backend:
              service:
                name: catalog-api
                port:
                  number: {{ .Values.catalogApi.port }}
{{- end }}
---
