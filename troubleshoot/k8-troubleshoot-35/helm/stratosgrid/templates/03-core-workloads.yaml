# 3. auth-api + vault-bridge ExternalName Service (Ticket 3)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vaultBridge.name }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/part-of: stratosgrid
spec:
