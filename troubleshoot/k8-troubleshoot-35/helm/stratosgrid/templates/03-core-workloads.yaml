    app: auth-api
  ports:
    - name: http
      port: {{ .Values.authApi.port }}
      targetPort: {{ .Values.authApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: auth-api
    app.kubernetes.io/part-of: stratosgrid
spec:
  replicas: {{ .Values.authApi.replicaCount }}
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: app
          image: "{{ .Values.authApi.image.repository }}:{{ .Values.authApi.image.tag }}"
          imagePullPolicy: {{ .Values.authApi.image.pullPolicy }}
          command: ["python3", "/app/auth.py"]
          env:
            - name: PORT
              value: {{ .Values.authApi.port | quote }}
            - name: VAULT_URL
              value: "http://{{ .Values.vaultBridge.name }}:{{ .Values.vaultCore.port }}/verify"
