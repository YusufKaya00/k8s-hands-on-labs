              containerPort: {{ .Values.authApi.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.authApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            {{- toYaml .Values.authApi.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: core-apps-code
