apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: report-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: report-api
          image: {{ .Values.global.pythonImage }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          command:
            - python3
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              CACHE_DIR = "/var/cache/reports"
              os.makedirs(CACHE_DIR, exist_ok=True)
              with open(os.path.join(CACHE_DIR, "boot.tmp"), "w") as f:
                  f.write("ready\n")
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"service": "report-api", "status": "ok", "cacheWritable": True}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", {{ .Values.reports.containerPort }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.reports.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.reports.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          {{- if .Values.reports.mountCacheVolume }}
          volumeMounts:
            - name: report-cache
              mountPath: /var/cache/reports
          {{- end }}
      {{- if .Values.reports.mountCacheVolume }}
      volumes:
        - name: report-cache
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: {{ .Values.namespaces.edge }}
spec:
  selector:
    app: report-api
  ports:
    - name: http
      port: {{ .Values.reports.servicePort }}
      targetPort: {{ .Values.reports.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-ingress
  namespace: {{ .Values.namespaces.edge }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /reports
            pathType: Prefix
            backend:
              service:
                name: report-api
                port:
                  number: {{ .Values.reports.servicePort }}
