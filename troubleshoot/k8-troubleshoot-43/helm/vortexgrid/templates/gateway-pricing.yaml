apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-svc
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: pricing-svc
spec:
  replicas: {{ .Values.pricingSvc.replicaCount }}
  selector:
    matchLabels:
      app: pricing-svc
  template:
    metadata:
      labels:
        app: pricing-svc
    spec:
      containers:
        - name: pricing-svc
          image: {{ .Values.pricingSvc.image }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              MARGIN = int(os.environ.get("MARGIN_BPS", "15"))

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({"status": "ok", "margin_bps": MARGIN, "price": 100.15}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", {{ .Values.pricingSvc.port }}), Handler).serve_forever()
          env:
            - name: MARGIN_BPS
              value: {{ .Values.pricingSvc.marginBps | quote }}
          ports:
            - containerPort: {{ .Values.pricingSvc.port }}
              name: http
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .Values.pricingSvc.port }}/quote', timeout=2)"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.pricingSvc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-svc
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: pricing-svc
spec:
  selector:
    app: pricing-svc
  ports:
    - name: http
      port: {{ .Values.pricingSvc.port }}
      targetPort: {{ .Values.pricingSvc.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: gateway-api
spec:
  replicas: {{ .Values.gatewayApi.replicaCount }}
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: {{ .Values.gatewayApi.image }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, threading, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              PRICING_URL = os.environ["PRICING_URL"]
              lock = threading.Lock()
              counter = {"requests": 0}

              class Handler(BaseHTTPRequestHandler):
                  def _send(self, code, payload, ctype="application/json"):
                      raw = payload if isinstance(payload, bytes) else json.dumps(payload).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", ctype)
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)

                  def do_GET(self):
                      if self.path == "/healthz":
                          self._send(200, {"status": "ok"})
                          return
                      if self.path == "/metrics":
                          with lock:
                              val = counter["requests"]
                          self._send(200, f"gateway_requests_total {val}\n".encode(), "text/plain")
                          return
                      if self.path.startswith("/api/v1/quote"):
                          with lock:
                              counter["requests"] += 1
                          try:
                              with urllib.request.urlopen(f"{PRICING_URL}/quote", timeout=5) as r:
                                  data = json.loads(r.read().decode())
                              self._send(200, {"gateway": "ok", "quote": data})
                          except Exception as exc:
                              self._send(502, {"gateway": "error", "upstream": "pricing-svc", "detail": str(exc)})
                          return
                      self._send(404, {"error": "not found"})

                  def log_message(self, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", {{ .Values.gatewayApi.port }}), Handler).serve_forever()
          env:
            - name: PRICING_URL
              value: {{ .Values.gatewayApi.pricingUrl | quote }}
          ports:
            - containerPort: {{ .Values.gatewayApi.port }}
              name: http
          readinessProbe:
            httpGet:
              path: {{ .Values.gatewayApi.readinessProbe.path }}
              port: {{ .Values.gatewayApi.port }}
            initialDelaySeconds: {{ .Values.gatewayApi.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.gatewayApi.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gatewayApi.readinessProbe.path }}
              port: {{ .Values.gatewayApi.port }}
            initialDelaySeconds: {{ .Values.gatewayApi.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.gatewayApi.livenessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.gatewayApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: gateway-api
spec:
  selector:
    app: gateway-api
  ports:
    - name: http
      port: {{ .Values.gatewayApi.port }}
      targetPort: {{ .Values.gatewayApi.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: {{ .Values.namespaces.app }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /api/v1/quote
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: {{ .Values.gatewayApi.port }}
