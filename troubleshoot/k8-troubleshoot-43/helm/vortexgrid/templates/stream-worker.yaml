apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-config
  namespace: {{ .Values.namespaces.app }}
data:
  STREAM_MODE: "paused"
  CONSUMER_GROUP: {{ .Values.streamWorker.consumerGroup | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-worker
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: stream-worker
spec:
  replicas: {{ .Values.streamWorker.replicaCount }}
  selector:
    matchLabels:
      app: stream-worker
  template:
    metadata:
      labels:
        app: stream-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: stream-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: stream-worker
          image: {{ .Values.streamWorker.image }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, socket
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              MODE = os.environ.get("STREAM_MODE", "paused")
              GROUP = os.environ.get("CONSUMER_GROUP", "default")

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          code = 200 if MODE == "active" else 503
                          self._send(code, {"mode": MODE, "pod": socket.gethostname()})
                          return
                      if self.path.startswith("/stream/status"):
                          code = 200 if MODE == "active" else 503
                          self._send(code, {"status": MODE, "consumer_group": GROUP, "pod": socket.gethostname()})
                          return
                      self._send(404, {"error": "not found"})

                  def _send(self, code, payload):
                      raw = json.dumps(payload).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)

                  def log_message(self, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", {{ .Values.streamWorker.port }}), Handler).serve_forever()
          envFrom:
            - configMapRef:
                name: stream-config
          ports:
            - containerPort: {{ .Values.streamWorker.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.streamWorker.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.streamWorker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: stream-worker
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: stream-worker
spec:
  selector:
    app: stream-worker
  ports:
    - name: http
      port: {{ .Values.streamWorker.port }}
      targetPort: {{ .Values.streamWorker.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stream-ingress
  namespace: {{ .Values.namespaces.app }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: stream-worker
                port:
                  number: {{ .Values.streamWorker.port }}
