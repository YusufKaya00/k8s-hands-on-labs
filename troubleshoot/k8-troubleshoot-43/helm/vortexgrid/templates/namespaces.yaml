apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.app }}
  labels:
    role: app
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.data }}
  labels:
    role: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.ops }}
  labels:
    role: ops
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ops-quota
  namespace: {{ .Values.namespaces.ops }}
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    pods: "10"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-vortex-app
  namespace: {{ .Values.namespaces.app }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-vortex-app
  namespace: {{ .Values.namespaces.app }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-vortex-app
  namespace: {{ .Values.namespaces.app }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ops-scrape
  namespace: {{ .Values.namespaces.app }}
spec:
  podSelector:
    matchLabels:
      app: gateway-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: metrics-collector
      ports:
        - protocol: TCP
          port: 8080
