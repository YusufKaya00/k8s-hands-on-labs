apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: {{ .Values.namespaces.ops }}
  labels:
    app: metrics-collector
spec:
  replicas: {{ .Values.metricsCollector.replicaCount }}
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      containers:
        - name: metrics-collector
          image: {{ .Values.metricsCollector.image }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, threading, time, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              SCRAPE_URL = os.environ["SCRAPE_URL"]
              INTERVAL = int(os.environ.get("SCRAPE_INTERVAL", "5"))
              state = {"ok": False, "last_error": "not yet scraped", "body": ""}
              lock = threading.Lock()

              def loop():
                  while True:
                      try:
                          with urllib.request.urlopen(SCRAPE_URL, timeout=2) as r:
                              txt = r.read().decode().strip()
                          with lock:
                              state["ok"] = (r.status == 200)
                              state["last_error"] = ""
                              state["body"] = txt
                      except Exception as exc:
                          with lock:
                              state["ok"] = False
                              state["last_error"] = str(exc)
                      time.sleep(INTERVAL)

              threading.Thread(target=loop, daemon=True).start()

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      with lock:
                          snap = dict(state)
                      code = 200 if snap["ok"] else 503
                      raw = json.dumps(snap).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)

                  def log_message(self, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", {{ .Values.metricsCollector.port }}), Handler).serve_forever()
          env:
            - name: SCRAPE_URL
              value: {{ .Values.metricsCollector.scrapeUrl | quote }}
            - name: SCRAPE_INTERVAL
              value: {{ .Values.metricsCollector.scrapeIntervalSeconds | quote }}
          ports:
            - containerPort: {{ .Values.metricsCollector.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metricsCollector.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.metricsCollector.resources.requests.cpu | quote }}
              memory: {{ .Values.metricsCollector.resources.requests.memory | quote }}
