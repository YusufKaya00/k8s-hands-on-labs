apiVersion: v1
kind: Service
metadata:
  name: ledger-headless
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-db
spec:
  clusterIP: None
  selector:
    app: ledger-db
  ports:
    - name: tcp
      port: {{ .Values.ledgerDb.port }}
      targetPort: {{ .Values.ledgerDb.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-db
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: ledger-db
spec:
  serviceName: "ledger-svc"
  replicas: {{ .Values.ledgerDb.replicaCount }}
  selector:
    matchLabels:
      app: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
    spec:
      containers:
        - name: ledger-db
          image: {{ .Values.ledgerDb.image }}
          command: ["python3", "-c"]
          args:
            - |
              import socket, threading

              srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              srv.bind(("0.0.0.0", {{ .Values.ledgerDb.port }}))
              srv.listen(32)
              while True:
                  conn, _ = srv.accept()
                  try:
                      conn.sendall(b"VORTEX-LEDGER-OK\n")
                  finally:
                      conn.close()
          ports:
            - containerPort: {{ .Values.ledgerDb.port }}
              name: tcp
          readinessProbe:
            tcpSocket:
              port: {{ .Values.ledgerDb.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ledgerDb.resources | nindent 12 }}
          volumeMounts:
            - name: ledger-data
              mountPath: /var/lib/ledger
  volumeClaimTemplates:
    - metadata:
        name: ledger-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "ultra-ssd-missing"
        resources:
          requests:
            storage: {{ .Values.ledgerDb.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: ledger-api
spec:
  replicas: {{ .Values.ledgerApi.replicaCount }}
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
        - name: ledger-api
          image: {{ .Values.ledgerApi.image }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, socket
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              HOST = os.environ["LEDGER_HOST"]
              PORT = int(os.environ["LEDGER_PORT"])

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          self._send(200, {"status": "ok"})
                          return
                      if self.path.startswith("/ledger/health"):
                          try:
                              with socket.create_connection((HOST, PORT), timeout=2) as s:
                                  banner = s.recv(64).decode(errors="replace").strip()
                              self._send(200, {"ledger": "connected", "target": HOST, "banner": banner})
                          except Exception as exc:
                              self._send(503, {"ledger": "unreachable", "target": HOST, "detail": str(exc)})
                          return
                      self._send(404, {"error": "not found"})

                  def _send(self, code, payload):
                      raw = json.dumps(payload).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(raw)))
                      self.end_headers()
                      self.wfile.write(raw)

                  def log_message(self, *args):
                      return

              ThreadingHTTPServer(("0.0.0.0", {{ .Values.ledgerApi.port }}), Handler).serve_forever()
          env:
            - name: LEDGER_HOST
              value: {{ .Values.ledgerApi.targetPodHost | quote }}
            - name: LEDGER_PORT
              value: {{ .Values.ledgerApi.targetPodPort | quote }}
          ports:
            - containerPort: {{ .Values.ledgerApi.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ledgerApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ledgerApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: ledger-api
spec:
  selector:
    app: ledger-api
  ports:
    - name: http
      port: {{ .Values.ledgerApi.port }}
      targetPort: {{ .Values.ledgerApi.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-ingress
  namespace: {{ .Values.namespaces.app }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
    - host: {{ .Values.global.ingressHost }}
      http:
        paths:
          - path: /ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-api
                port:
                  number: {{ .Values.ledgerApi.port }}
