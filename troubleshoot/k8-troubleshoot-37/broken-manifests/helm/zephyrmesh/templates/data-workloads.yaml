apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-inspector
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: audit-inspector
    app.kubernetes.io/part-of: zephyrmesh
spec:
  replicas: {{ .Values.auditInspector.replicaCount }}
  selector:
    matchLabels:
      app: audit-inspector
  template:
    metadata:
      labels:
        app: audit-inspector
    spec:
      serviceAccountName: {{ .Values.auditInspector.podServiceAccountName | quote }}
      containers:
        - name: audit-inspector
          image: "{{ .Values.auditInspector.image.repository }}:{{ .Values.auditInspector.image.tag }}"
          imagePullPolicy: {{ .Values.auditInspector.image.pullPolicy }}
          command: ["python3", "/scripts/audit_inspector.py"]
          env:
            - name: PORT
              value: {{ .Values.auditInspector.port | quote }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.namespaces.data | quote }}
          ports:
            - containerPort: {{ .Values.auditInspector.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.auditInspector.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.auditInspector.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: zephyr-data-scripts
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-agent
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: node-log-agent
    app.kubernetes.io/part-of: zephyrmesh
spec:
  selector:
    matchLabels:
      app: node-log-agent
  template:
    metadata:
      labels:
        app: node-log-agent
    spec:
      tolerations:
        - key: {{ .Values.nodeAgent.tolerationKey | quote }}
          operator: Equal
          value: {{ .Values.nodeAgent.tolerationValue | quote }}
          effect: {{ .Values.nodeAgent.tolerationEffect | quote }}
      containers:
        - name: node-log-agent
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
