apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-engine
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: fraud-engine
    app.kubernetes.io/part-of: zephyrmesh
spec:
  replicas: {{ .Values.fraudEngine.replicaCount }}
  selector:
    matchLabels:
      app: fraud-engine
  template:
    metadata:
      labels:
        app: fraud-engine
    spec:
      containers:
        - name: fraud-engine
          image: "{{ .Values.fraudEngine.image.repository }}:{{ .Values.fraudEngine.image.tag }}"
          imagePullPolicy: {{ .Values.fraudEngine.image.pullPolicy }}
          command: ["python3", "/scripts/fraud_engine.py"]
          env:
            - name: PORT
              value: {{ .Values.fraudEngine.port | quote }}
          ports:
            - containerPort: {{ .Values.fraudEngine.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.fraudEngine.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.fraudEngine.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: zephyr-data-scripts
---
