apiVersion: v1
kind: Service
metadata:
  name: status-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app.kubernetes.io/part-of: zephyrmesh
spec:
  selector:
    app: status-api
  ports:
    - port: {{ .Values.statusApi.port }}
      targetPort: {{ .Values.statusApi.port }}
