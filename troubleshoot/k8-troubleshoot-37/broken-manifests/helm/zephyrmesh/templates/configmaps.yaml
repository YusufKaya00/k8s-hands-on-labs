  checkout_api.py: |
    import json
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    FRAUD_URL = os.environ["FRAUD_URL"]

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            try:
                with urllib.request.urlopen(f"{FRAUD_URL}/score", timeout=3) as resp:
                    fraud_data = json.loads(resp.read().decode())
                body = json.dumps({"service": "checkout-api", "verified": True, "fraud": fraud_data}).encode()
                self.send_response(200)
            except Exception as exc:
                body = json.dumps({"service": "checkout-api", "verified": False, "error": str(exc)}).encode()
                self.send_response(502)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            pass

    HTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8084"))), Handler).serve_forever()

