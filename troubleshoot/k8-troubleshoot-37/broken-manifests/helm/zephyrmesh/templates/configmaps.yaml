    import json
    import os
    import ssl
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    NS = os.environ["WATCH_NAMESPACE"]

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            try:
                with open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r", encoding="utf-8") as f:
                    token = f.read().strip()
                ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
                req = urllib.request.Request(
                    f"https://kubernetes.default.svc/api/v1/namespaces/{NS}/services",
                    headers={"Authorization": f"Bearer {token}"},
                )
                with urllib.request.urlopen(req, context=ctx, timeout=4) as resp:
                    data = json.loads(resp.read().decode())
                names = [item["metadata"]["name"] for item in data.get("items", [])]
                body = json.dumps({"service": "audit-inspector", "discovered_services": len(names), "services": names}).encode()
                self.send_response(200)
            except Exception as exc:
                body = json.dumps({"service": "audit-inspector", "error": str(exc)}).encode()
                self.send_response(500)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            pass

    HTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8091"))), Handler).serve_forever()
