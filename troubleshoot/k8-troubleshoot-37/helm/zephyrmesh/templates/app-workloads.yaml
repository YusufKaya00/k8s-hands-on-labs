apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: billing-api
    app.kubernetes.io/part-of: zephyrmesh
spec:
  replicas: {{ .Values.billingApi.replicaCount }}
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: billing-api
          image: "{{ .Values.billingApi.image.repository }}:{{ .Values.billingApi.image.tag }}"
          imagePullPolicy: {{ .Values.billingApi.image.pullPolicy }}
          command: ["python3", "/scripts/billing_api.py"]
          env:
            - name: PORT
              value: {{ .Values.billingApi.port | quote }}
            - name: BIND_HOST
              value: {{ .Values.billingApi.bindHost | quote }}
          ports:
            - containerPort: {{ .Values.billingApi.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.billingApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.billingApi.port }}
            initialDelaySeconds: 6
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.billingApi.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: zephyr-app-scripts
---
