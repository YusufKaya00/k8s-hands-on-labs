apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-server
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: core
data:
  server.py: |
    import http.server
    import socketserver
    import urllib.request
    import json
    import os

    PORT = int(os.environ.get("PORT", "8080"))

    class ThreadedTCPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
        daemon_threads = True
        allow_reuse_address = True

    class OrderHandler(http.server.BaseHTTPRequestHandler):
        def address_string(self):
            return self.client_address[0]

        def log_message(self, format, *args):
            pass

        def do_GET(self):
            client_ip = self.headers.get("X-Forwarded-For", self.client_address[0])
            pod_name = os.environ.get("HOSTNAME", "unknown-pod")
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"OK")
            elif self.path in ["/api/orders", "/api/orders/"]:
                resp = {
                    "service": "order-service",
                    "status": "ready",
                    "pod": pod_name,
                    "client_ip": client_ip,
                    "orders": [{"id": 101, "item": "cloud-tier", "status": "processing"}]
                }
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(resp).encode())
            elif self.path == "/api/orders/checkout":
                # Inter-service call to inventory-service
                try:
                    req = urllib.request.urlopen("http://inventory-service.cloudapex-inventory:8081/api/inventory/reserve", timeout=3)
                    inv_resp = json.loads(req.read().decode())
                    resp = {
                        "action": "checkout",
                        "status": "confirmed",
                        "pod": pod_name,
                        "inventory": inv_resp
                    }
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps(resp).encode())
                except Exception as e:
                    self.send_response(504)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": f"Inventory call failed: {str(e)}"}).encode())
            elif self.path == "/api/orders/cloud-token":
                # Check link-local Azure IMDS
                try:
                    req = urllib.request.Request("http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/")
                    req.add_header("Metadata", "true")
                    token_resp = urllib.request.urlopen(req, timeout=2).read().decode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(token_resp.encode())
                except Exception as e:
                    self.send_response(502)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": f"IMDS access blocked: {str(e)}"}).encode())
            else:
                self.send_response(404)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"NotFound")

    with ThreadedTCPServer(("0.0.0.0", PORT), OrderHandler) as httpd:
        print(f"Order Service serving on 0.0.0.0:{PORT}")
        httpd.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: core
    spec:
      {{- if .Values.orderService.dnsConfig.enabled }}
      dnsConfig:
        options:
          - name: ndots
            value: {{ .Values.orderService.dnsConfig.ndots | quote }}
      {{- end }}
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: {{ .Values.orderService.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.orderService.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: order-service-server
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.namespaces.core }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: core
spec:
  type: {{ .Values.orderService.service.type }}
  sessionAffinity: {{ .Values.orderService.service.sessionAffinity }}
  {{- if eq .Values.orderService.service.sessionAffinity "ClientIP" }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.orderService.service.sessionAffinityTimeout }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.orderService.service.port }}
      targetPort: {{ .Values.orderService.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: order-service
---
{{- if .Values.orderService.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-netpol
  namespace: {{ .Values.namespaces.core }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.edge }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.inventory }}
      ports:
        - protocol: TCP
          port: 8081
    {{- if .Values.orderService.networkPolicy.allowImds }}
    - to:
        - ipBlock:
            cidr: {{ .Values.orderService.networkPolicy.imdsIp }}
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
{{- end }}
