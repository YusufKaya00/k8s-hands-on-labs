apiVersion: v1
kind: ConfigMap
metadata:
  name: order-gateway-server
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: gateway
data:
  server.py: |
    import http.server
    import socketserver
    import json
    import os

    PORT = int(os.environ.get("PORT", "8080"))

    class GatewayHandler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            client_ip = self.headers.get("X-Forwarded-For", self.client_address[0])
            if self.path == "/api/health":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"OK - Gateway Healthy\n")
            elif self.path in ["/api/orders", "/api/orders/"]:
                resp = {
                    "gateway": "order-gateway",
                    "status": "online",
                    "client_ip": client_ip,
                    "service": "cloudapex-direct-lb"
                }
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(resp).encode())
            elif self.path.startswith("/api/orders/"):
                resp = {
                    "order_id": self.path.split("/")[-1],
                    "status": "received",
                    "client_ip": client_ip
                }
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(resp).encode())
            else:
                self.send_response(404)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"NotFound\n")

    with socketserver.TCPServer(("0.0.0.0", PORT), GatewayHandler) as httpd:
        print(f"Order Gateway running on 0.0.0.0:{PORT}")
        httpd.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-gateway
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.orderGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-gateway
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.orderGateway.image.repository }}:{{ .Values.orderGateway.image.tag }}"
          imagePullPolicy: {{ .Values.orderGateway.image.pullPolicy }}
          command: ["python", "-u", "/app/server.py"]
          env:
            - name: PORT
              value: "{{ .Values.orderGateway.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.orderGateway.service.port }}
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.orderGateway.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.orderGateway.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.orderGateway.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: order-gateway-server
---
apiVersion: v1
kind: Service
metadata:
  name: order-gateway-lb
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: gateway
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: {{ .Values.orderGateway.service.healthProbePath | quote }}
spec:
  type: {{ .Values.orderGateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.orderGateway.service.port }}
      targetPort: {{ .Values.orderGateway.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: order-gateway
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudapex-ingress
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    {{- if .Values.ingress.affinity.enabled }}
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: {{ .Values.ingress.affinity.cookieName | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.global.ingressHost | default .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.ordersPath }}
            pathType: {{ .Values.ingress.ordersPathType }}
            backend:
              service:
                name: order-service
                port:
                  number: 8080
          - path: {{ .Values.ingress.inventoryPath }}
            pathType: {{ .Values.ingress.inventoryPathType }}
            backend:
              service:
                name: inventory-service
                port:
                  number: 8081
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-gateway-netpol
  namespace: {{ .Values.namespaces.edge }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.core }}
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
