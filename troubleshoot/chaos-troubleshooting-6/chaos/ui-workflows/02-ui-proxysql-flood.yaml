apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: custom-proxysql-load
  namespace: litmus
  labels:
    subject: custom-proxysql-load
spec:
  entrypoint: custom-proxysql-load
  serviceAccountName: argo-chaos
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  templates:
    - name: custom-proxysql-load
      steps:
        - - name: run-proxysql-flood
            template: run-proxysql-flood
    - name: run-proxysql-flood
      container:
        image: python:3.11-alpine
        imagePullPolicy: IfNotPresent
        command: ["python3", "-c"]
        args:
          - |
            import concurrent.futures
            import json
            import socket
            import time
            import urllib.parse
            import urllib.request

            TARGET_URL = "http://orders-api.chaos-shop.svc.cluster.local:8080/orders"
            PROXYSQL_HOST = "proxysql.chaos-shop.svc.cluster.local"
            PROXYSQL_PORT = 6033
            VM_URL = "http://victoriametrics.chaos-shop.svc.cluster.local:8428"
            CONCURRENCY = 16
            REQUESTS = 160

            def hit_once(_idx):
                t0 = time.monotonic()
                try:
                    with urllib.request.urlopen(TARGET_URL, timeout=3) as resp:
                        resp.read()
                        code = resp.status
                    with socket.create_connection((PROXYSQL_HOST, PROXYSQL_PORT), timeout=2) as sock:
                        banner = sock.recv(128)
                        ok = (code == 200 and len(banner) >= 6)
                    return ok, time.monotonic() - t0, None
                except Exception as exc:
                    return False, time.monotonic() - t0, str(exc)

            print(f"[custom-proxysql-load] Sending {REQUESTS} requests (concurrency={CONCURRENCY}) -> {TARGET_URL}")
            with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as pool:
                results = list(pool.map(hit_once, range(REQUESTS)))

            ok_count = sum(1 for ok, _, _ in results if ok)
            latencies = sorted(lat for _, lat, _ in results)
            p95 = latencies[int(len(latencies) * 0.95) - 1] if latencies else 0.0
            success_rate = (ok_count / len(results)) * 100.0
            errors = [err for ok, _, err in results if not ok][:5]

            print("[custom-proxysql-load] Waiting 6s for VictoriaMetrics scrape cycle...")
            time.sleep(6)

            vm_total = "unavailable"
            try:
                q = urllib.parse.quote("sum(orders_requests_total)")
                with urllib.request.urlopen(f"{VM_URL}/api/v1/query?query={q}", timeout=3) as resp:
                    vm_data = json.loads(resp.read().decode("utf-8"))
                    res = vm_data.get("data", {}).get("result", [])
                    if res:
                        vm_total = res[0]["value"][1]
            except Exception as exc:
                vm_total = f"err:{exc}"

            print(f"[custom-proxysql-load] Result: {ok_count}/{len(results)} ok ({success_rate:.1f}%), p95={p95:.3f}s, vm_orders_requests_total={vm_total}")
            if errors:
                print(f"[custom-proxysql-load] Sample errors: {errors}")

            if success_rate < 95.0:
                raise SystemExit(f"Failed: success_rate={success_rate:.1f}% < 95%")
