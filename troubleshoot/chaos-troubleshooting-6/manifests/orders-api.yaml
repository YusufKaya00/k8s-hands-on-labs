apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-code
  namespace: chaos-shop
data:
  server.py: |
    import json
    import os
    import socket
    import threading
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PROXYSQL_HOST = os.environ.get("PROXYSQL_HOST", "proxysql.chaos-shop.svc.cluster.local")
    PROXYSQL_PORT = int(os.environ.get("PROXYSQL_PORT", "6033"))
    CLICKHOUSE_URL = os.environ.get("CLICKHOUSE_URL", "http://clickhouse.chaos-shop.svc.cluster.local:8123")

    lock = threading.Lock()
    metrics = {
        "orders_requests_total": 0,
        "orders_errors_total": 0,
        "analytics_requests_total": 0,
        "clickhouse_degraded_total": 0,
        "proxysql_last_check_seconds": 0.0,
    }


    def check_proxysql_handshake(timeout: float = 2.0) -> str:
        start = time.monotonic()
        with socket.create_connection((PROXYSQL_HOST, PROXYSQL_PORT), timeout=timeout) as sock:
            sock.settimeout(timeout)
            greeting = sock.recv(256)
            if len(greeting) < 6:
                raise RuntimeError("ProxySQL returned empty/incomplete MySQL handshake")
            protocol_ver = greeting[4]
            version_end = greeting.find(b"\x00", 5)
            server_banner = greeting[5:version_end].decode("utf-8", errors="replace") if version_end > 5 else "unknown"
        elapsed = time.monotonic() - start
        with lock:
            metrics["proxysql_last_check_seconds"] = round(elapsed, 6)
        return f"proto={protocol_ver} banner={server_banner}"


    def query_clickhouse(sql: str, timeout: float = 1.5) -> str:
        encoded = urllib.parse.quote(sql)
        req = urllib.request.Request(f"{CLICKHOUSE_URL}/?query={encoded}", method="POST")
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            return resp.read().decode("utf-8", errors="replace").strip()


    class Handler(BaseHTTPRequestHandler):
        def _send_json(self, code: int, payload: dict) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self) -> None:
            if self.path == "/healthz":
                self._send_json(200, {"status": "ok", "pod": socket.gethostname()})
                return

            if self.path == "/orders":
                try:
                    proxy_info = check_proxysql_handshake()
                except Exception as exc:
                    with lock:
                        metrics["orders_requests_total"] += 1
                        metrics["orders_errors_total"] += 1
                    self._send_json(503, {"status": "error", "upstream": "proxysql", "detail": str(exc)})
                    return

                ch_status = "recorded"
                try:
                    query_clickhouse("INSERT INTO analytics.order_events (sku, status) VALUES ('API-ORDER', 'ok')")
                except Exception:
                    ch_status = "degraded-skipped"
                    with lock:
                        metrics["clickhouse_degraded_total"] += 1

                with lock:
                    metrics["orders_requests_total"] += 1

                self._send_json(200, {
                    "status": "ok",
                    "pod": socket.gethostname(),
                    "proxysql": proxy_info,
                    "analytics_event": ch_status,
                })
                return

            if self.path == "/analytics":
                with lock:
                    metrics["analytics_requests_total"] += 1
                try:
                    count = query_clickhouse("SELECT count() FROM analytics.order_events")
                    self._send_json(200, {
                        "status": "ok",
                        "source": "clickhouse",
                        "order_events_count": int(count) if count.isdigit() else count,
                    })
                except Exception as exc:
                    with lock:
                        metrics["clickhouse_degraded_total"] += 1
                    self._send_json(503, {
                        "status": "degraded",
                        "source": "clickhouse-unavailable",
                        "detail": str(exc),
                    })
                return

            if self.path == "/metrics":
                with lock:
                    snap = dict(metrics)
                pod = socket.gethostname()
                lines = [
                    "# HELP orders_requests_total Total /orders HTTP requests handled",
                    "# TYPE orders_requests_total counter",
                    f'orders_requests_total{{pod="{pod}"}} {snap["orders_requests_total"]}',
                    "# HELP orders_errors_total Total /orders failures due to ProxySQL/MariaDB",
                    "# TYPE orders_errors_total counter",
                    f'orders_errors_total{{pod="{pod}"}} {snap["orders_errors_total"]}',
                    "# HELP analytics_requests_total Total /analytics HTTP requests handled",
                    "# TYPE analytics_requests_total counter",
                    f'analytics_requests_total{{pod="{pod}"}} {snap["analytics_requests_total"]}',
                    "# HELP clickhouse_degraded_total Total requests where ClickHouse was unavailable",
                    "# TYPE clickhouse_degraded_total counter",
                    f'clickhouse_degraded_total{{pod="{pod}"}} {snap["clickhouse_degraded_total"]}',
                    "# HELP proxysql_last_check_seconds Last ProxySQL handshake latency in seconds",
                    "# TYPE proxysql_last_check_seconds gauge",
                    f'proxysql_last_check_seconds{{pod="{pod}"}} {snap["proxysql_last_check_seconds"]}',
                ]
                body = ("\n".join(lines) + "\n").encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            self._send_json(404, {"error": "not found"})

        def log_message(self, format: str, *args) -> None:
            return


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: chaos-shop
  labels:
    app: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PROXYSQL_HOST
              value: "proxysql.chaos-shop.svc.cluster.local"
            - name: PROXYSQL_PORT
              value: "6033"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.chaos-shop.svc.cluster.local:8123"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: orders-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: chaos-shop
  labels:
    app: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-pdb
  namespace: chaos-shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orders-api
