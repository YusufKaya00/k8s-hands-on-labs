apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-scrape-config
  namespace: chaos-shop
data:
  scrape.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "orders-api"
        metrics_path: /metrics
        static_configs:
          - targets: ["orders-api.chaos-shop.svc.cluster.local:8080"]
      - job_name: "victoriametrics"
        static_configs:
          - targets: ["localhost:8428"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: chaos-shop
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.106.0
          args:
            - "-promscrape.config=/etc/vm/scrape.yml"
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod=1d"
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: scrape-config
              mountPath: /etc/vm
            - name: vm-data
              mountPath: /victoria-metrics-data
      volumes:
        - name: scrape-config
          configMap:
            name: vm-scrape-config
        - name: vm-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: chaos-shop
  labels:
    app: victoriametrics
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
