apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.settlementWorker.secretName }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: settlement-worker
    app.kubernetes.io/part-of: atlasflow
type: Opaque
stringData:
  {{ .Values.settlementWorker.actualSecretKey }}: "atlas-settlement-prod-token-2026"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-conf
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: edge-proxy
    app.kubernetes.io/part-of: atlasflow
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 512;
    }

    http {
      proxy_temp_path /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

      server {
        listen {{ .Values.edgeProxy.port }};
        server_name _;

        location /healthz {
          access_log off;
          add_header Content-Type application/json;
          return 200 '{"service":"edge-proxy","status":"ok","version":"15.0.0"}\n';
        }

        location /api/catalog {
          set $up_catalog "catalog-api.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.catalogApi.port }}";
          proxy_pass http://$up_catalog;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/pricing {
          set $up_pricing "pricing-engine.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.pricingEngine.port }}";
          proxy_pass http://$up_pricing;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/checkout {
          set $up_checkout "checkout-api.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.checkoutApi.port }}";
          proxy_pass http://$up_checkout;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/settlement {
          set $up_settlement "settlement-worker.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.settlementWorker.port }}";
          proxy_pass http://$up_settlement;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/topology {
          set $up_topology "topology-watcher.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.topologyWatcher.port }}";
          proxy_pass http://$up_topology;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/reports {
          set $up_reports "report-exporter.{{ .Values.namespaces.core }}.svc.cluster.local:{{ .Values.reportExporter.port }}";
          proxy_pass http://$up_reports;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/vault {
          set $up_vault "vault-api.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.vaultApi.port }}";
          proxy_pass http://$up_vault;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/analytics {
          set $up_analytics "{{ .Values.edgeProxy.analyticsUpstream }}";
          proxy_pass http://$up_analytics;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }

        location /api/audit {
          set $up_audit "audit-store.{{ .Values.namespaces.data }}.svc.cluster.local:{{ .Values.auditStore.port }}";
          proxy_pass http://$up_audit;
          proxy_http_version 1.1;
          proxy_connect_timeout 2s;
          proxy_read_timeout 3s;
        }
      }
    }
