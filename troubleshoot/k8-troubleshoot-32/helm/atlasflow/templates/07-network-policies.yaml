apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-pricing-netpol
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: pricing-engine
    app.kubernetes.io/part-of: atlasflow
spec:
  podSelector:
    matchLabels:
      app: pricing-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicies.pricingFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.pricingEngine.port }}
