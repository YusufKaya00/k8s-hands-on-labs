apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: atlasflow
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      port: {{ .Values.catalogApi.port }}
      targetPort: {{ .Values.catalogApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: atlasflow
spec:
  replicas: {{ .Values.catalogApi.replicaCount }}
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: "{{ .Values.catalogApi.image.repository }}:{{ .Values.catalogApi.image.tag }}"
          imagePullPolicy: {{ .Values.catalogApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.catalogApi.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/catalog", "/api/catalog/featured", "/healthz"):
                          body = json.dumps({
                              "service": "catalog-api",
                              "path": self.path,
                              "status": "ok",
                              "pod": os.environ.get("HOSTNAME", "unknown")
                          }).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          body = b'{"error":"not_found"}\n'
                          self.send_response(404)
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                  def log_message(self, fmt, *args):
                      pass

              HTTPServer(("0.0.0.0", {{ .Values.catalogApi.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.catalogApi.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              {{- if .Values.catalogApi.resources.requestsCpu }}
              cpu: {{ .Values.catalogApi.resources.requestsCpu | quote }}
              {{- end }}
              memory: {{ .Values.catalogApi.resources.requestsMemory | quote }}
            limits:
              cpu: {{ .Values.catalogApi.resources.limitsCpu | quote }}
              memory: {{ .Values.catalogApi.resources.limitsMemory | quote }}
