apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: settlement-worker
    app.kubernetes.io/part-of: atlasflow
spec:
  replicas: {{ .Values.settlementWorker.replicaCount }}
  selector:
    matchLabels:
      app: settlement-worker
  template:
    metadata:
      labels:
        app: settlement-worker
    spec:
      containers:
        - name: settlement-worker
          image: "{{ .Values.settlementWorker.image.repository }}:{{ .Values.settlementWorker.image.tag }}"
          imagePullPolicy: {{ .Values.settlementWorker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.settlementWorker.port }}
          env:
            - name: SETTLEMENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.settlementWorker.secretName }}
                  key: {{ .Values.settlementWorker.secretKeyRef }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os, sys
              from http.server import BaseHTTPRequestHandler, HTTPServer

              if not os.environ.get("SETTLEMENT_API_TOKEN"):
                  print("FATAL: SETTLEMENT_API_TOKEN missing", file=sys.stderr)
                  sys.exit(1)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/settlement/health", "/healthz"):
                          body = json.dumps({"service": "settlement-worker", "token_loaded": True, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      pass

              HTTPServer(("0.0.0.0", {{ .Values.settlementWorker.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.settlementWorker.resources | nindent 12 }}
