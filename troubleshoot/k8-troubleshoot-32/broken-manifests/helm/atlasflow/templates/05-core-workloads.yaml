apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-exporter
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: report-exporter
    app.kubernetes.io/part-of: atlasflow
spec:
  replicas: {{ .Values.reportExporter.replicaCount }}
  selector:
    matchLabels:
      app: report-exporter
  template:
    metadata:
      labels:
        app: report-exporter
    spec:
      containers:
        - name: report-exporter
          image: "{{ .Values.reportExporter.image.repository }}:{{ .Values.reportExporter.image.tag }}"
          imagePullPolicy: {{ .Values.reportExporter.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.reportExporter.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              os.makedirs("/data/reports", exist_ok=True)
              report_file = "/data/reports/latest.txt"
              with open(report_file, "w") as f:
                  f.write("atlasflow-daily-export=ready\n")

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/reports/export", "/healthz"):
                          with open(report_file) as f:
                              marker = f.read().strip()
                          body = json.dumps({"service": "report-exporter", "storage": "bound", "marker": marker, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      pass

              HTTPServer(("0.0.0.0", {{ .Values.reportExporter.port }}), Handler).serve_forever()
          volumeMounts:
            - name: report-volume
              mountPath: /data/reports
          resources:
            {{- toYaml .Values.reportExporter.resources | nindent 12 }}
      volumes:
        - name: report-volume
          persistentVolumeClaim:
            claimName: {{ .Values.reportExporter.storage.pvcName }}
