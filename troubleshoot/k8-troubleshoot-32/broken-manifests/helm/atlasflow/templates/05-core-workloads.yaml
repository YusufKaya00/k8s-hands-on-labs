apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-watcher
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: topology-watcher
    app.kubernetes.io/part-of: atlasflow
spec:
  replicas: {{ .Values.topologyWatcher.replicaCount }}
  selector:
    matchLabels:
      app: topology-watcher
  template:
    metadata:
      labels:
        app: topology-watcher
    spec:
      serviceAccountName: {{ .Values.topologyWatcher.serviceAccountName }}
      containers:
        - name: topology-watcher
          image: "{{ .Values.topologyWatcher.image.repository }}:{{ .Values.topologyWatcher.image.tag }}"
          imagePullPolicy: {{ .Values.topologyWatcher.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.topologyWatcher.port }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, ssl, sys, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer

              with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                  token = f.read().strip()
              with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace") as f:
                  ns = f.read().strip()
              ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def fetch_k8s(resource):
                  url = f"https://kubernetes.default.svc/api/v1/namespaces/{ns}/{resource}"
                  req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                  with urllib.request.urlopen(req, context=ctx, timeout=4) as resp:
                      return len(json.loads(resp.read().decode()).get("items", []))

              try:
                  pod_count = fetch_k8s("pods")
                  svc_count = fetch_k8s("services")
                  print(f"K8s API discovery ok: {pod_count} pods, {svc_count} services in {ns}")
              except Exception as e:
                  print(f"FATAL: Kubernetes API access denied/failed for namespace '{ns}': {e}", file=sys.stderr)
                  sys.exit(1)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/topology", "/healthz"):
                          try:
                              pods = fetch_k8s("pods")
                              svcs = fetch_k8s("services")
                              body = json.dumps({"service": "topology-watcher", "namespace": ns, "pods": pods, "services": svcs, "status": "ok"}).encode()
                              self.send_response(200)
                          except Exception as err:
                              body = json.dumps({"service": "topology-watcher", "error": str(err)}).encode()
                              self.send_response(500)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      pass

              HTTPServer(("0.0.0.0", {{ .Values.topologyWatcher.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.topologyWatcher.resources | nindent 12 }}
