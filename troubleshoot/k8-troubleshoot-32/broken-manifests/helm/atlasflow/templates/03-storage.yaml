apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.reportExporter.storage.pvcName }}
  namespace: {{ .Values.namespaces.core }}
  labels:
    app: report-exporter
    app.kubernetes.io/part-of: atlasflow
spec:
  accessModes:
    - {{ .Values.reportExporter.storage.accessMode }}
  storageClassName: {{ .Values.reportExporter.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.reportExporter.storage.size }}
