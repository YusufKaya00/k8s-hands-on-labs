apiVersion: v1
kind: Service
metadata:
  name: vault-api
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-api
    app.kubernetes.io/part-of: atlasflow
spec:
  selector:
    app: vault-api
  ports:
    - name: http
      port: {{ .Values.vaultApi.port }}
      targetPort: {{ .Values.vaultApi.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-api
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: vault-api
    app.kubernetes.io/part-of: atlasflow
spec:
  replicas: {{ .Values.vaultApi.replicaCount }}
  selector:
    matchLabels:
      app: vault-api
  template:
    metadata:
      labels:
        app: vault-api
    spec:
      containers:
        - name: vault-api
          image: "{{ .Values.vaultApi.image.repository }}:{{ .Values.vaultApi.image.tag }}"
          imagePullPolicy: {{ .Values.vaultApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vaultApi.port }}
          env:
            - name: BIND_HOST
              value: {{ .Values.vaultApi.bindHost | quote }}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              bind_host = os.environ.get("BIND_HOST", "127.0.0.1")

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/vault/status", "/healthz"):
                          body = json.dumps({"service": "vault-api", "sealed": False, "bind": bind_host, "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      pass

              print(f"vault-api binding socket on {bind_host}:{{ .Values.vaultApi.port }}")
              HTTPServer((bind_host, {{ .Values.vaultApi.port }}), Handler).serve_forever()
          resources:
            {{- toYaml .Values.vaultApi.resources | nindent 12 }}
