            - -c
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path in ("/api/audit", "/healthz"):
                          body = json.dumps({"service": "audit-store", "node_pod": os.environ.get("HOSTNAME", "unknown"), "status": "ok"}).encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, fmt, *args):
                      pass

              HTTPServer(("0.0.0.0", {{ .Values.auditStore.port }}), Handler).serve_forever()
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.auditStore.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.auditStore.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-guardian
  namespace: {{ .Values.namespaces.data }}
  labels:
    app: node-guardian
    app.kubernetes.io/part-of: atlasflow
spec:
  selector:
    matchLabels:
      app: node-guardian
  template:
    metadata:
      labels:
        app: node-guardian
    spec:
      {{- with .Values.nodeGuardian.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: guardian
          image: "{{ .Values.nodeGuardian.image.repository }}:{{ .Values.nodeGuardian.image.tag }}"
          imagePullPolicy: {{ .Values.nodeGuardian.image.pullPolicy }}
          command:
            - python3
            - -u
            - -c
            - |
              import os, time
              print(f"node-guardian active on pod {os.environ.get('HOSTNAME')}")
              while True:
                  time.sleep(30)
          resources:
            {{- toYaml .Values.nodeGuardian.resources | nindent 12 }}
