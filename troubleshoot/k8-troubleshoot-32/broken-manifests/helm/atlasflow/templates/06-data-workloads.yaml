  selector:
    matchLabels:
      app: audit-store
  template:
    metadata:
      labels:
        app: audit-store
    spec:
      {{- if .Values.auditStore.nodeSelectorEnabled }}
      nodeSelector:
        {{ .Values.auditStore.nodeSelectorKey }}: {{ .Values.auditStore.nodeSelectorValue | quote }}
      {{- end }}
      containers:
        - name: audit-store
          image: "{{ .Values.auditStore.image.repository }}:{{ .Values.auditStore.image.tag }}"
          imagePullPolicy: {{ .Values.auditStore.image.pullPolicy }}
