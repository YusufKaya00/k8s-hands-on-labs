# ==============================================================================
# BROKEN MANIFEST 5: Memory Allocation Spike Missing Cgroup Target (OOM Killer 137)
# ==============================================================================
# KÖK NEDEN (RCA):
# Pod üzerinde Cgroup v2 bellek sınırı (resources.limits.memory: 256Mi) tanımlanmış
# ancak uygulama çalışma zamanında (Runtime / GC) bir hedef sınır (GOMEMLIMIT veya
# hedef bellek temizleme limiti) tanımlanmamıştır (ENABLE_MEMORY_TARGET_LIMIT="false").
#
# KAOS ALTINDAKİ BELİRTİ:
# Chaos Mesh 'StressChaos' ile pod üzerine 180MB sentetik bellek yükü bindirildiğinde,
# uygulama ve kaos stresinin toplamı 256MiB sınırına çarpar. Garbage Collector
# cgroup sınırından habersiz olduğu için tetiklenemez ve Linux çekirdeği (Kernel)
# OOM Killer mekanizması podu 'SIGKILL' ile acımasızca sonlandırır (ExitCode 137).
#
# DÜZELTME (FIX):
# ENABLE_MEMORY_TARGET_LIMIT="true" ve MEMORY_TARGET_LIMIT_MIB="192" ayarlayın
# (Cgroup sınırının %75'i) veya Go uygulamalarında GOMEMLIMIT=192MiB kullanın.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumpay-analytics-no-target
  namespace: app
  labels:
    app.kubernetes.io/name: quantumpay
    app.kubernetes.io/component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quantumpay
      app.kubernetes.io/component: analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantumpay
        app.kubernetes.io/component: analytics
    spec:
      containers:
        - name: analytics
          image: python:3.11-slim
          command: ["python3", "/app/analytics.py"]
          env:
            # ❌ HATA: Hedef sınır tanımlanmamış, GC cgroup sınırını göremiyor!
            - name: ENABLE_MEMORY_TARGET_LIMIT
              value: "false"
            - name: MEMORY_TARGET_LIMIT_MIB
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              # Pod cgroup sınırı:
              memory: 256Mi
