# ==============================================================================
# QUANTUMPAY DISTRIBUTED CORE — BASELINE VALUES (values.yaml)
# ==============================================================================

replicaCount:
  gateway: 2
  engine: 2
  consumer: 1
  analytics: 1
  ledgerDb: 1

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  host: "app.9.205.30.202.nip.io"

# Gateway Configuration
gateway:
  port: 8080
  downstreamTimeout: 0
  readHeaderTimeout: 0
  idleTimeout: 0
  maxConnections: 1000
  preStopEnabled: false
  preStopSleepSeconds: 0
  terminationGracePeriodSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Transaction Engine Configuration
engine:
  port: 8081
  circuitBreaker:
    enabled: false
    errorThreshold: 5
    recoveryTimeSeconds: 15
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Settlement Consumer Configuration
consumer:
  dlqEnabled: false
  maxRetries: 999999
  pollIntervalMs: 2000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Risk Analytics Worker Configuration
analytics:
  enableMemoryTargetLimit: false
  memoryTargetLimitMib: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Ledger DB (StatefulSet) Configuration
ledgerDb:
  port: 5432
  storageSize: 500Mi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# PDB (Pod Disruption Budget)
pdb:
  enabled: true
  minAvailable: 1

# HPA (Horizontal Pod Autoscaler)
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 65

# ServiceMonitor (Prometheus)
serviceMonitor:
  enabled: true
  interval: 10s
