apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumpay-engine
  labels:
    {{- include "quantumpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.replicaCount.engine }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quantumpay.name" . }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "quantumpay.labels" . | nindent 8 }}
        app.kubernetes.io/component: engine
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/engine.py"]
          ports:
            - name: http
              containerPort: {{ .Values.engine.port }}
              protocol: TCP
          env:
            - name: ENGINE_PORT
              value: {{ .Values.engine.port | quote }}
            - name: CIRCUIT_BREAKER_ENABLED
              value: {{ .Values.engine.circuitBreaker.enabled | quote }}
            - name: CB_THRESHOLD
              value: {{ .Values.engine.circuitBreaker.errorThreshold | quote }}
            - name: CB_RECOVERY_TIME
              value: {{ .Values.engine.circuitBreaker.recoveryTimeSeconds | quote }}
            - name: WAL_PATH
              value: "/var/lib/quantumpay/data/wal.log"
            - name: EVENTS_DIR
              value: "/var/lib/quantumpay/data/events"
          envFrom:
            - secretRef:
                name: {{ include "quantumpay.fullname" . }}-credentials
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /app
            - name: shared-data
              mountPath: /var/lib/quantumpay/data
      volumes:
        - name: scripts
          configMap:
            name: {{ include "quantumpay.fullname" . }}-scripts
            defaultMode: 0755
        - name: shared-data
          emptyDir: {}
