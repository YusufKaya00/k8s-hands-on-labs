{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quantumpay-monitor
  labels:
    {{- include "quantumpay.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quantumpay.name" . }}
      app.kubernetes.io/component: gateway
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
