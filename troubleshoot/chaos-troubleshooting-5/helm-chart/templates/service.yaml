apiVersion: v1
kind: Service
metadata:
  name: quantumpay-gateway
  labels:
    {{- include "quantumpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "quantumpay.name" . }}
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: quantumpay-engine
  labels:
    {{- include "quantumpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.engine.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "quantumpay.name" . }}
    app.kubernetes.io/component: engine
---
apiVersion: v1
kind: Service
metadata:
  name: quantumpay-ledger-db
  labels:
    {{- include "quantumpay.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger-db
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.ledgerDb.port }}
      name: db
  selector:
    app.kubernetes.io/name: {{ include "quantumpay.name" . }}
    app.kubernetes.io/component: ledger-db
