    #!/usr/bin/env python3
    import http.server
    import socketserver
    import json
    import os
    import sys
    import time
    import threading

    PORT = int(os.environ.get("ENGINE_PORT", "8081"))
    WAL_PATH = os.environ.get("WAL_PATH", "/var/lib/quantumpay/data/wal.log")
    EVENTS_DIR = os.environ.get("EVENTS_DIR", "/var/lib/quantumpay/data/events")
    CB_ENABLED = os.environ.get("CIRCUIT_BREAKER_ENABLED", "false").lower() == "true"
    CB_THRESHOLD = int(os.environ.get("CB_THRESHOLD", "3"))
    CB_RECOVERY_TIME = float(os.environ.get("CB_RECOVERY_TIME", "10"))

    os.makedirs(os.path.dirname(WAL_PATH), exist_ok=True)
    os.makedirs(EVENTS_DIR, exist_ok=True)

    # Circuit Breaker State: CLOSED, OPEN, HALF_OPEN
    CB_STATE = "CLOSED"
    CONSECUTIVE_ERRORS = 0
    LAST_FAILURE_TIME = 0
    CB_LOCK = threading.Lock()

    class EngineHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            if "/healthz" not in self.path:
                sys.stdout.write(f"[ENGINE] {format%args}\n")

        def check_circuit_breaker(self):
            global CB_STATE, CONSECUTIVE_ERRORS, LAST_FAILURE_TIME
            if not CB_ENABLED:
                return True

            with CB_LOCK:
                now = time.time()
                if CB_STATE == "OPEN":
                    if now - LAST_FAILURE_TIME > CB_RECOVERY_TIME:
                        CB_STATE = "HALF_OPEN"
                        sys.stderr.write("[ENGINE CB] Recovery period elapsed. Circuit transitioning to HALF_OPEN.\n")
                        return True
                    return False
                return True

        def record_cb_success(self):
            global CB_STATE, CONSECUTIVE_ERRORS
            if not CB_ENABLED:
                return
            with CB_LOCK:
                CONSECUTIVE_ERRORS = 0
                CB_STATE = "CLOSED"

        def record_cb_failure(self):
            global CB_STATE, CONSECUTIVE_ERRORS, LAST_FAILURE_TIME
            if not CB_ENABLED:
                return
            with CB_LOCK:
                CONSECUTIVE_ERRORS += 1
                LAST_FAILURE_TIME = time.time()
                if CONSECUTIVE_ERRORS >= CB_THRESHOLD:
                    CB_STATE = "OPEN"
                    sys.stderr.write(f"[ENGINE CB ALERT] Consecutive disk/IO errors reached threshold ({CONSECUTIVE_ERRORS}). Circuit Breaker is now OPEN!\n")

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"status":"ok","component":"engine"}\n')
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            content_length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(content_length)

            if self.path == "/api/v1/execute":
                if not self.check_circuit_breaker():
                    self.send_response(503)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Retry-After", "5")
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "error": "circuit_breaker_open",
                        "status": "CIRCUIT_BREAKER_OPEN",
                        "message": "Storage layer is experiencing severe I/O faults. Degrading gracefully to prevent thread exhaustion."
                    }).encode() + b'\n')
                    return

                try:
                    payload = json.loads(body) if body else {"tx_id": f"tx-{int(time.time()*1000)}"}
                    tx_id = payload.get("tx_id", f"tx-{int(time.time()*1000)}")

                    # ACID Write to Persistent Ledger WAL
                    # Under IOChaos (latency or EIO), this call will hang or raise OSError (EIO = errno 5)
                    with open(WAL_PATH, "a") as f:
                        f.write(f"{time.time()}|{tx_id}|COMMITTED\n")
                        f.flush()
                        os.fsync(f.fileno())

                    # Publish transaction event for settlement consumer
                    evt_file = os.path.join(EVENTS_DIR, f"{tx_id}.json")
                    with open(evt_file, "w") as ef:
                        json.dump(payload, ef)

                    self.record_cb_success()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "status": "SUCCESS",
                        "tx_id": tx_id,
                        "circuit_breaker": CB_STATE
                    }).encode() + b'\n')

                except OSError as e:
                    self.record_cb_failure()
                    sys.stderr.write(f"[ENGINE DISK ERROR] WAL fsync failed: {e}\n")
                    self.send_response(500)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "error": "disk_io_error",
                        "errno": getattr(e, 'errno', None),
                        "message": str(e),
                        "circuit_breaker": CB_STATE
                    }).encode() + b'\n')

            elif self.path == "/api/v1/poison":
                tx_id = f"poison-tx-{int(time.time()*1000)}"
                evt_file = os.path.join(EVENTS_DIR, f"{tx_id}.json")
                with open(evt_file, "w") as ef:
                    json.dump({"tx_id": tx_id, "corrupt": True, "poison": True, "payload": "MALFORMED_HEADER_DATA"}, ef)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "POISON_PILL_QUEUED", "tx_id": tx_id}).encode() + b'\n')

            else:
                self.send_response(404)
                self.end_headers()

    class ThreadedHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True
        allow_reuse_address = True

    print(f"[ENGINE] QuantumPay Engine listening on port {PORT} (Circuit Breaker: {CB_ENABLED})...")
    server = ThreadedHTTPServer(("0.0.0.0", PORT), EngineHandler)
    server.serve_forever()

