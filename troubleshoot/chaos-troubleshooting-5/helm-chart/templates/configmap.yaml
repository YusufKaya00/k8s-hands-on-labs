    #!/usr/bin/env python3
    import os
    import sys
    import time
    import json
    import glob

    EVENTS_DIR = os.environ.get("EVENTS_DIR", "/var/lib/quantumpay/data/events")
    DLQ_DIR = os.environ.get("DLQ_DIR", "/var/lib/quantumpay/data/dlq")
    DLQ_ENABLED = os.environ.get("DLQ_ENABLED", "false").lower() == "true"
    MAX_RETRIES = int(os.environ.get("MAX_RETRIES", "999999"))
    POLL_INTERVAL_MS = int(os.environ.get("POLL_INTERVAL_MS", "2000"))

    os.makedirs(EVENTS_DIR, exist_ok=True)
    os.makedirs(DLQ_DIR, exist_ok=True)

    retry_counts = {}

    print(f"[CONSUMER] Settlement Consumer started. DLQ_ENABLED={DLQ_ENABLED}, MAX_RETRIES={MAX_RETRIES}...")

    while True:
        try:
            event_files = sorted(glob.glob(os.path.join(EVENTS_DIR, "*.json")))
            for ef in event_files:
                base = os.path.basename(ef)
                try:
                    with open(ef, "r") as f:
                        data = json.load(f)

                    # Check for poison pill
                    if data.get("corrupt") or data.get("poison"):
                        current_retries = retry_counts.get(base, 0) + 1
                        retry_counts[base] = current_retries

                        sys.stderr.write(f"[CONSUMER ALERT] Unhandled exception processing {base} (Attempt {current_retries}): Malformed payload!\n")

                        if DLQ_ENABLED and current_retries >= MAX_RETRIES:
                            # Forward to Dead Letter Queue and advance stream
                            dlq_dest = os.path.join(DLQ_DIR, base)
                            os.rename(ef, dlq_dest)
                            sys.stderr.write(f"[CONSUMER DLQ] Successfully routed poison pill {base} to DLQ ({dlq_dest}). Offset committed! Consumer group healthy.\n")
                            retry_counts.pop(base, None)
                        else:
                            # Without DLQ, consumer keeps retrying the exact same offset!
                            if current_retries > 5:
                                sys.stderr.write(f"[CRITICAL HEARTBEAT TIMEOUT] Consumer blocked on {base} for > 30s! max.poll.interval.ms exceeded!\n")
                                sys.stderr.write(f"[ALERT] BROKER INITIATING REBALANCE STORM! Group partition assignments revoked across all consumers!\n")
                            time.sleep(1.0)
                            # Do not delete or advance
                            continue
                    else:
                        # Clean message processed
                        os.remove(ef)
                        retry_counts.pop(base, None)
                        print(f"[CONSUMER] Successfully settled and committed transaction {data.get('tx_id')}")

                except Exception as ex:
                    sys.stderr.write(f"[CONSUMER ERROR] Error reading {base}: {ex}\n")

            time.sleep(POLL_INTERVAL_MS / 1000.0)

        except Exception as e:
            sys.stderr.write(f"[CONSUMER LOOP ERROR] {e}\n")
            time.sleep(2.0)

  analytics.py: |
    #!/usr/bin/env python3
    import os
    import sys
    import time
    import gc

    TARGET_LIMIT_ENABLED = os.environ.get("ENABLE_MEMORY_TARGET_LIMIT", "false").lower() == "true"
    TARGET_LIMIT_MIB = int(os.environ.get("MEMORY_TARGET_LIMIT_MIB", "192"))

    print(f"[ANALYTICS] Risk Analytics Worker running. TargetLimitEnabled={TARGET_LIMIT_ENABLED}, TargetLimitMib={TARGET_LIMIT_MIB}MiB...")

    matrix_cache = []

    def get_cgroup_memory_usage_mib():
        # Read from cgroup v2 or v1
        for path in ["/sys/fs/cgroup/memory.current", "/sys/fs/cgroup/memory/memory.usage_in_bytes"]:
            if os.path.exists(path):
                try:
                    with open(path) as f:
                        return int(f.read().strip()) / (1024 * 1024)
                except Exception:
                    pass
        return len(matrix_cache) * 2 # Fallback estimate

    iteration = 0
    while True:
        iteration += 1
        # Allocate simulation matrices
        chunk = bytearray(2 * 1024 * 1024) # 2 MiB chunks
        matrix_cache.append(chunk)

        usage = get_cgroup_memory_usage_mib()
        if iteration % 5 == 0:
            print(f"[ANALYTICS] Calculated portfolio risk matrix #{iteration}. Estimated memory: {usage:.1f} MiB (Cache size: {len(matrix_cache)} chunks)")

        if TARGET_LIMIT_ENABLED and usage >= TARGET_LIMIT_MIB:
            print(f"[ANALYTICS GC] Memory usage ({usage:.1f} MiB) reached target limit ({TARGET_LIMIT_MIB} MiB). Evicting cache and forcing GC...")
            matrix_cache.clear()
            gc.collect()

        # In baseline mode without target limit, under StressChaos, memory grows until kernel OOM killer fires
        if not TARGET_LIMIT_ENABLED and len(matrix_cache) > 100:
            # Keep cache bounded under normal runs to stay pristine, but vulnerable under external memory stress
            matrix_cache = matrix_cache[-80:]

        time.sleep(1.0)
