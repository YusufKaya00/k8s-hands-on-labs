    #!/usr/bin/env python3
    import http.server
    import socketserver
    import json
    import os
    import sys
    import time
    import urllib.request
    import urllib.error
    import signal
    import threading

    PORT = int(os.environ.get("GATEWAY_PORT", "8080"))
    DOWNSTREAM_TIMEOUT = float(os.environ.get("DOWNSTREAM_TIMEOUT", "0"))
    ENGINE_URL = os.environ.get("ENGINE_URL", "http://quantumpay-engine:8081")

    # Metrics counters
    REQUESTS_TOTAL = 0
    ERRORS_TOTAL = 0
    ACTIVE_CONNS = 0
    METRICS_LOCK = threading.Lock()

    SHUTTING_DOWN = False

    def handle_signal(sig, frame):
        global SHUTTING_DOWN
        sys.stderr.write(f"[GATEWAY] Signal {sig} received. Starting graceful shutdown sequence...\n")
        SHUTTING_DOWN = True

    signal.signal(signal.SIGTERM, handle_signal)
    signal.signal(signal.SIGINT, handle_signal)

    class GatewayHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            # Suppress normal access logs to prevent log spam
            if "/metrics" not in self.path and "/healthz" not in self.path:
                sys.stdout.write(f"[GATEWAY] {self.address_string()} - {format%args}\n")

        def do_GET(self):
            global REQUESTS_TOTAL, ERRORS_TOTAL, ACTIVE_CONNS
            with METRICS_LOCK:
                ACTIVE_CONNS += 1
                REQUESTS_TOTAL += 1

            try:
                if self.path == "/healthz":
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(b'{"status":"ok","component":"gateway"}\n')
                    return

                elif self.path == "/readyz":
                    # Readiness verifies downstream engine connectivity
                    try:
                        timeout = DOWNSTREAM_TIMEOUT if DOWNSTREAM_TIMEOUT > 0 else 2.0
                        req = urllib.request.Request(f"{ENGINE_URL}/healthz")
                        with urllib.request.urlopen(req, timeout=timeout) as resp:
                            if resp.status == 200:
                                self.send_response(200)
                                self.send_header("Content-Type", "application/json")
                                self.end_headers()
                                self.wfile.write(b'{"status":"ready","downstream":"ok"}\n')
                                return
                    except Exception as e:
                        self.send_response(503)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({"status":"not_ready","error":str(e)}).encode() + b'\n')
                        return

                elif self.path == "/api/v1/metrics":
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.end_headers()
                    body = (
                        f"# HELP quantumpay_requests_total Total HTTP requests handled\n"
                        f"# TYPE quantumpay_requests_total counter\n"
                        f"quantumpay_requests_total {REQUESTS_TOTAL}\n"
                        f"# HELP quantumpay_errors_total Total errors encountered\n"
                        f"# TYPE quantumpay_errors_total counter\n"
                        f"quantumpay_errors_total {ERRORS_TOTAL}\n"
                        f"# HELP quantumpay_active_connections Current active connections\n"
                        f"# TYPE quantumpay_active_connections gauge\n"
                        f"quantumpay_active_connections {ACTIVE_CONNS}\n"
                        f"# HELP quantumpay_downstream_timeout_configured Configured downstream timeout in seconds\n"
                        f"# TYPE quantumpay_downstream_timeout_configured gauge\n"
                        f"quantumpay_downstream_timeout_configured {DOWNSTREAM_TIMEOUT}\n"
                    )
                    self.wfile.write(body.encode())
                    return

                elif self.path == "/api/v1/status":
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        "system": "QuantumPay Core",
                        "status": "OPERATIONAL",
                        "downstream_timeout": DOWNSTREAM_TIMEOUT,
                        "engine_url": ENGINE_URL
                    }).encode() + b'\n')
                    return

                else:
                    self.send_response(404)
                    self.end_headers()
                    self.wfile.write(b'{"error":"not_found"}\n')

            finally:
                with METRICS_LOCK:
                    ACTIVE_CONNS -= 1

        def do_POST(self):
            global REQUESTS_TOTAL, ERRORS_TOTAL, ACTIVE_CONNS
            with METRICS_LOCK:
                ACTIVE_CONNS += 1
                REQUESTS_TOTAL += 1

            try:
                content_length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(content_length)

                if self.path == "/api/v1/transfer":
                    # Forward transfer to transaction engine
                    timeout = DOWNSTREAM_TIMEOUT if DOWNSTREAM_TIMEOUT > 0 else None
                    req = urllib.request.Request(
                        f"{ENGINE_URL}/api/v1/execute",
                        data=body,
                        headers={"Content-Type": "application/json"}
                    )
                    try:
                        with urllib.request.urlopen(req, timeout=timeout) as resp:
                            resp_data = resp.read()
                            self.send_response(resp.status)
                            self.send_header("Content-Type", "application/json")
                            self.end_headers()
                            self.wfile.write(resp_data)
                            return
                    except urllib.error.HTTPError as e:
                        with METRICS_LOCK:
                            ERRORS_TOTAL += 1
                        self.send_response(e.code)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(e.read())
                        return
                    except (urllib.error.URLError, TimeoutError, socket.timeout) as e:
                        with METRICS_LOCK:
                            ERRORS_TOTAL += 1
                        sys.stderr.write(f"[GATEWAY ERROR] Downstream call failed: {e}\n")
                        self.send_response(504)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({
                            "error": "gateway_timeout",
                            "message": f"Engine failed to respond within {DOWNSTREAM_TIMEOUT}s timeout: {e}"
                        }).encode() + b'\n')
                        return

                elif self.path == "/api/v1/poison":
                    # Forward poison pill injection
                    req = urllib.request.Request(
                        f"{ENGINE_URL}/api/v1/poison",
                        data=body or b'{"poison": true}',
                        headers={"Content-Type": "application/json"}
                    )
                    try:
                        with urllib.request.urlopen(req, timeout=5.0) as resp:
                            self.send_response(resp.status)
                            self.send_header("Content-Type", "application/json")
                            self.end_headers()
                            self.wfile.write(resp.read())
                            return
                    except Exception as e:
                        self.send_response(500)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({"error": str(e)}).encode() + b'\n')
                        return

                else:
                    self.send_response(404)
                    self.end_headers()
                    self.wfile.write(b'{"error":"not_found"}\n')

            finally:
                with METRICS_LOCK:
                    ACTIVE_CONNS -= 1

    class ThreadedHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True
        allow_reuse_address = True

    print(f"[GATEWAY] QuantumPay Gateway listening on port {PORT} (Downstream Timeout: {DOWNSTREAM_TIMEOUT}s)...")
    server = ThreadedHTTPServer(("0.0.0.0", PORT), GatewayHandler)
    server.serve_forever()

