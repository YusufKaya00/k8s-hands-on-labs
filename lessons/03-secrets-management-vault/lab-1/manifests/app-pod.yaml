apiVersion: v1
kind: Pod
metadata:
  name: payments-app
  namespace: demo-app
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "payments-role"
    vault.hashicorp.com/agent-inject-secret-config.txt: "app/data/payments"
    vault.hashicorp.com/agent-inject-template-config.txt: |
      {{- with secret "app/data/payments" -}}
      API_KEY={{ .Data.data.api_key }}
      DB_HOST={{ .Data.data.db_host }}
      {{- end -}}
spec:
  serviceAccountName: payments-sa
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'App running. Inspect /vault/secrets/config.txt'; sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
