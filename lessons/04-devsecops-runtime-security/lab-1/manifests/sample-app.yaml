apiVersion: v1
kind: Namespace
metadata:
  name: demo-sec
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-target
  namespace: demo-sec
  labels:
    app: web-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-target
  template:
    metadata:
      labels:
        app: web-target
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
