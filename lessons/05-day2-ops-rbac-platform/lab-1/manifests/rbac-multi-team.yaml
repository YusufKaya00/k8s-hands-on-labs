apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-readonly-sa
  namespace: mesh-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-readonly-role
  namespace: mesh-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-readonly-binding
  namespace: mesh-demo
subjects:
  - kind: ServiceAccount
    name: dev-readonly-sa
    namespace: mesh-demo
roleRef:
  kind: Role
  name: dev-readonly-role
  apiGroup: rbac.authorization.k8s.io
