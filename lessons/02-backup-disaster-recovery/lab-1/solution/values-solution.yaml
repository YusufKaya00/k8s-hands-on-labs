velero:
  bsl:
    bucket: "velero-backups"
    s3Url: "http://minio.velero.svc.cluster.local:9000"
  rbac:
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - statefulsets
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  backup:
    hook:
      container: "postgres"
      dbName: "payments"
      onError: "Fail"
  restore:
    storageClassMapping:
      from: "gp3-encrypted"
      to: "standard"
