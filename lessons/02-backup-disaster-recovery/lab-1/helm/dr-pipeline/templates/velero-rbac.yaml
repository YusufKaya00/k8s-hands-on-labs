apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-server
  namespace: {{ .Values.namespaces.velero }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-server
rules:
  - apiGroups: ["", "apps"]
    resources:
{{- range .Values.velero.rbac.resources }}
      - {{ . | quote }}
{{- end }}
    verbs:
{{- range .Values.velero.rbac.verbs }}
      - {{ . | quote }}
{{- end }}
  - apiGroups: ["velero.io"]
    resources: ["backupstoragelocations", "backups", "restores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-server
subjects:
  - kind: ServiceAccount
    name: velero-server
    namespace: {{ .Values.namespaces.velero }}
