apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-script
  namespace: {{ .Values.namespaces.velero }}
data:
  minio.py: |
    import html
    import json
    import os
    import threading
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DATA_DIR = "/data"
    BUCKET = os.environ.get("DEFAULT_BUCKET", "velero-backups")
    S3_PORT = int(os.environ.get("S3_PORT", "9000"))
    CONSOLE_PORT = int(os.environ.get("CONSOLE_PORT", "9001"))

    os.makedirs(os.path.join(DATA_DIR, BUCKET), exist_ok=True)

    def safe_path(bucket, key=""):
        if not bucket or "/" in bucket or ".." in bucket:
            return None
        bdir = os.path.join(DATA_DIR, bucket)
        if not os.path.isdir(bdir):
            return None
        if not key:
            return bdir
        clean_key = key.strip("/").replace("/", "_")
        if ".." in clean_key:
            return None
        return os.path.join(bdir, clean_key)

    class S3Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path in ("/healthz", "/minio/health/live"):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return

            parts = [p for p in parsed.path.split("/") if p]
            if not parts:
                buckets = sorted(d for d in os.listdir(DATA_DIR) if os.path.isdir(os.path.join(DATA_DIR, d)))
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"buckets": buckets}).encode())
                return

            bucket = parts[0]
            if len(parts) == 1:
                bdir = safe_path(bucket)
                if not bdir:
                    self.send_response(404)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": "NoSuchBucket", "bucket": bucket}).encode())
                    return
                objs = sorted(os.listdir(bdir))
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"bucket": bucket, "objects": objs}).encode())
                return

            key = "/".join(parts[1:])
            obj_path = safe_path(bucket, key)
            if not obj_path or not os.path.isfile(obj_path):
                self.send_response(404)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": "NoSuchKey", "bucket": bucket, "key": key}).encode())
                return
            with open(obj_path, "rb") as f:
                data = f.read()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(data)

        def do_PUT(self):
            parsed = urllib.parse.urlparse(self.path)
            parts = [p for p in parsed.path.split("/") if p]
            if len(parts) < 2:
                self.send_response(400)
                self.end_headers()
                return
            bucket, key = parts[0], "/".join(parts[1:])
            bdir = safe_path(bucket)
            if not bdir:
                self.send_response(404)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": "NoSuchBucket", "bucket": bucket}).encode())
                return
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length)
            obj_path = safe_path(bucket, key)
            with open(obj_path, "wb") as f:
                f.write(body)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"stored": True, "bucket": bucket, "key": key, "bytes": len(body)}).encode())

        def log_message(self, format, *args):
            pass

    class ConsoleHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path == "/object":
                qs = urllib.parse.parse_qs(parsed.query)
                bucket = qs.get("bucket", [""])[0]
                key = qs.get("key", [""])[0]
                obj_path = safe_path(bucket, key)
                if not obj_path or not os.path.isfile(obj_path):
                    self.send_response(404)
                    self.end_headers()
                    return
                with open(obj_path, "rb") as f:
                    data = f.read()
                self.send_response(200)
                self.send_header("Content-Type", "application/json; charset=utf-8")
                self.end_headers()
                self.wfile.write(data)
                return

            rows = []
            bdir = os.path.join(DATA_DIR, BUCKET)
            for name in sorted(os.listdir(bdir)):
                fpath = os.path.join(bdir, name)
                size = os.path.getsize(fpath)
                sc = "-"
                created = "-"
                try:
                    meta = json.loads(open(fpath, "r", encoding="utf-8").read())
                    sc = html.escape(str(meta.get("archivedStorageClass", "-")))
                    created = html.escape(str(meta.get("createdAt", "-")))
                except Exception:
                    pass
                ename = html.escape(name)
                rows.append(
                    f"<tr><td>{ename}</td><td>{sc}</td><td>{size} B</td><td>{created}</td>"
                    f"<td><a href='/object?bucket={html.escape(BUCKET)}&key={urllib.parse.quote(name)}'>Inspect JSON/SQL</a></td></tr>"
                )
            table = "".join(rows) or "<tr><td colspan='5'>No backup objects stored yet.</td></tr>"
            page = f"""<!doctype html><html><head><title>MinIO Object Storage Console</title>
            <style>body{{font-family:sans-serif;margin:2rem;background:#0f172a;color:#e2e8f0}}
            table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #334155;padding:.6rem;text-align:left}}
            th{{background:#1e293b}}a{{color:#38bdf8}}</style></head>
            <body><h1>MinIO S3 Console — Bucket: {html.escape(BUCKET)}</h1>
            <p>S3 API endpoint: <code>http://minio.velero.svc.cluster.local:{S3_PORT}</code></p>
            <table><thead><tr><th>Object</th><th>Archived StorageClass</th><th>Size</th><th>Created</th><th>Payload</th></tr></thead>
            <tbody>{table}</tbody></table></body></html>"""
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.end_headers()
            self.wfile.write(page.encode())

        def log_message(self, format, *args):
            pass

    t1 = threading.Thread(target=ThreadingHTTPServer(("0.0.0.0", S3_PORT), S3Handler).serve_forever, daemon=True)
    t1.start()
    ThreadingHTTPServer(("0.0.0.0", CONSOLE_PORT), ConsoleHandler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespaces.velero }}
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command: ["python3", "/scripts/minio.py"]
          env:
            - name: DEFAULT_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: S3_PORT
              value: {{ .Values.minio.s3Port | quote }}
            - name: CONSOLE_PORT
              value: {{ .Values.minio.consolePort | quote }}
          ports:
            - name: s3
              containerPort: {{ .Values.minio.s3Port }}
            - name: console
              containerPort: {{ .Values.minio.consolePort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.minio.s3Port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: minio-script
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespaces.velero }}
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: {{ .Values.minio.s3Port }}
      targetPort: {{ .Values.minio.s3Port }}
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: {{ .Values.minio.consolePort }}
