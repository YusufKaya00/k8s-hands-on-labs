apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: {{ .Values.namespaces.logging }}
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fluentbit-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: fluent-bit
{{- if .Values.fluentbit.tolerations }}
      tolerations:
{{ toYaml .Values.fluentbit.tolerations | indent 8 }}
{{- end }}
      containers:
        - name: fluent-bit
          image: {{ .Values.fluentbit.image }}
          ports:
            - name: metrics
              containerPort: {{ .Values.fluentbit.httpPort }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.fluentbit.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.fluentbit.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 96Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
            - name: config
              mountPath: /fluent-bit/etc/
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          emptyDir: {}
        - name: config
          configMap:
            name: fluent-bit-config
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: {{ .Values.namespaces.logging }}
spec:
  selector:
    app: fluent-bit
  ports:
    - name: metrics
      port: {{ .Values.fluentbit.httpPort }}
      targetPort: {{ .Values.fluentbit.httpPort }}
