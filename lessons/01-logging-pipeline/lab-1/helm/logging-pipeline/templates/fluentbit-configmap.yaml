apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: {{ .Values.namespaces.logging }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             1
        Daemon            Off
        Log_Level         info
        Parsers_File      parsers.conf
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         {{ .Values.fluentbit.httpPort }}

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_{{ .Values.namespaces.app }}_*.log
        Parser            cri
        DB                /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           {{ .Values.fluentbit.parser.mergeLog }}
        Keep_Log            {{ .Values.fluentbit.parser.keepLog }}
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
{{- range .Values.fluentbit.filters.modifyRules }}

    [FILTER]
        Name              modify
        Match             kube.*
        Condition         Key_exists {{ .key }}
        Set               {{ .key }} {{ .value }}
{{- end }}

    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              {{ .Values.fluentbit.output.lokiHost }}
        Port              {{ .Values.fluentbit.output.lokiPort }}
        Labels            job=fluentbit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], app=$kubernetes['labels']['app']
        Line_Format       json
        Auto_Kubernetes_Labels off

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
